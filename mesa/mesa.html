  }
  function renderSom() {
    const box = $('#som'); if (!box) return;
    const a = trilha().atual || {};
    box.classList.toggle('min', SOM.min);
    $('#somOv').innerHTML = SOM.erro ? `<i class="ph-fill ph-warning" title="${esc(SOM.erro)}"></i>` : SOM.bloqueado ? '<button id="somPlay" title="O navegador barrou o som: toque para ouvir" aria-label="Tocar"><i class="ph-fill ph-play"></i></button>' : '';
    $('#somBar').innerHTML = SOM.erro ? `<span class="som-t err" title="${esc(SOM.erro)}"><i class="ph-fill ph-warning"></i>${esc(SOM.erro)}</span>` : `<span class="som-t" title="${esc(tituloFaixa(a.id))}"><i class="ph-fill ph-music-notes"></i>${a.tocando ? '' : '(pausada) '}${esc(tituloFaixa(a.id))}</span>
      <button id="somMudo" title="${SOM.mudo ? 'Ligar o som' : 'Silenciar só para mim'}" aria-label="${SOM.mudo ? 'Ligar o som' : 'Silenciar'}"><i class="ph-bold ph-speaker-${SOM.mudo ? 'x' : 'high'}"></i></button>
      <button id="somMin" title="${SOM.min ? 'Aumentar' : 'Diminuir'} o player" aria-label="${SOM.min ? 'Aumentar' : 'Diminuir'} o player"><i class="ph-bold ph-arrows-${SOM.min ? 'out' : 'in'}-simple"></i></button>`;
    $('#somVol').innerHTML = `<i class="ph ph-speaker-low" style="color:var(--text-3)"></i><input type="range" min="0" max="100" value="${SOM.vol}" id="somR" aria-label="Volume (só para você)">`;
    const pl = $('#somPlay'); if (pl) pl.onclick = () => { SOM.bloqueado = false; SOM.yt.seekTo(posAgora(trilha().atual), true); SOM.yt.playVideo(); renderSom(); };
    $('#somMudo').onclick = () => { SOM.mudo = !SOM.mudo; aplicarVolume(); salvarSomLocal(); renderSom(); };
    $('#somMin').onclick = () => { SOM.min = !SOM.min; salvarSomLocal(); renderSom(); };
    $('#somR').oninput = e => { SOM.vol = +e.target.value; if (SOM.mudo && SOM.vol > 0) SOM.mudo = false; aplicarVolume(); };
    $('#somR').onchange = () => { salvarSomLocal(); renderSom(); };
  }

  // Ações do narrador
  async function salvarTrilha(novo) {
    const ant = S.mesa.trilha;
    S.mesa.trilha = novo; aplicarTrilha(); if (S.tab === 'trilha') paneTrilha();
    const { error } = await sb.from('mesas').update({ trilha: novo }).eq('id', S.mesa.id);
    if (error) { S.mesa.trilha = ant; aplicarTrilha(); if (S.tab === 'trilha') paneTrilha(); toast(esc(errMsg(error)), 'warning'); }
  }
  const comAtual = mud => { const tr = trilha(); return Object.assign({}, tr, { atual: Object.assign({}, tr.atual, mud) }); };
  function tocarFaixa(id) { const tr = trilha(); salvarTrilha(Object.assign({}, tr, { atual: { id, tocando: true, pos: 0, em: Date.now(), loop: !!(tr.atual && tr.atual.loop) } })); }
  function pausarRetomar() {
    const a = trilha().atual; if (!a) return;
    salvarTrilha(comAtual(a.tocando ? { tocando: false, pos: posAgora(a), em: Date.now() } : { tocando: true, em: Date.now() }));
  }
  function proximaFaixa(auto) {
    const tr = trilha(), L = tr.lista || [], a = tr.atual; if (!L.length) return;
    const i = a ? L.findIndex(f => f.id === a.id) : -1;
    // Fim da faixa: segue a playlist e volta ao começo depois da última (ambiente contínuo).
    if (auto && L.length === 1) return salvarTrilha(comAtual({ tocando: false, pos: 0, em: Date.now() }));
    tocarFaixa(L[(i + 1) % L.length].id);
  }
  async function adicionarFaixa(link) {
    const id = ytId(link);
    if (!id) return toast('Link do YouTube não reconhecido', 'warning');
    const tr = trilha(), lista = (tr.lista || []).slice();
    if (lista.some(f => f.id === id)) return toast('Essa música já está na playlist', 'music-notes');
    let t = '';
    try { const r = await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}`); if (r.ok) t = (await r.json()).title || ''; } catch (e) {}
    lista.push({ id, t: t || 'Faixa ' + (lista.length + 1) });
    const novo = Object.assign({}, tr, { lista });
    // Nada tocando: a primeira música adicionada já começa.
    if (!tr.atual || !tr.atual.id) novo.atual = { id, tocando: true, pos: 0, em: Date.now(), loop: false };
    await salvarTrilha(novo);
    toast(esc(`${t || 'Música'} na playlist`), 'music-notes');
  }
  function paneTrilha() {

      <p class="hint" style="margin:0 0 10px">Cole um link do YouTube. A música toca para todos na mesa, no mesmo ponto; cada um ajusta o próprio volume no player.</p>
      <form class="dice-form" id="trForm" style="margin-top:0" autocomplete="off"><input class="input" id="trLink" placeholder="https://youtube.com/watch?v=…" aria-label="Link do YouTube"><button class="btn btn-primary">Adicionar</button></form>
      ${a.id ? `<div class="sep"></div><h4>Tocando agora</h4>
        <div class="item on trk"><img src="https://i.ytimg.com/vi/${esc(a.id)}/mqdefault.jpg" alt=""><div style="min-width:0;flex:1"><b title="${esc(tituloFaixa(a.id))}">${esc(tituloFaixa(a.id))}</b><div class="tiny">${a.tocando ? 'Tocando para a mesa' : 'Pausada'}${a.loop ? ' · repetindo' : ''}</div></div></div>

          <button class="btn btn-sm ${a.loop ? 'on' : ''}" id="trLoop" title="Repetir esta música"><i class="ph-bold ph-repeat-once"></i></button>
          <button class="btn btn-sm" id="trStop" title="Parar" style="color:var(--red-6)"><i class="ph-fill ph-stop"></i></button></div>` : ''}
      <div class="sep"></div><h4>Playlist</h4>
      <div class="stack">${lista.length ? lista.map((f, i) => `<div class="item trk ${f.id === a.id ? 'on' : ''}"><img src="https://i.ytimg.com/vi/${esc(f.id)}/mqdefault.jpg" alt="">
          <div style="min-width:0;flex:1"><b title="${esc(f.t)}">${esc(f.t)}</b></div>
          <div class="acts"><button data-trplay="${i}" title="Tocar agora" aria-label="Tocar ${esc(f.t)}"><i class="ph-fill ph-play"></i></button><button class="rm" data-trdel="${i}" title="Tirar da playlist" aria-label="Tirar ${esc(f.t)} da playlist"><i class="ph-bold ph-x"></i></button></div></div>`).join('')

    $$('[data-trplay]').forEach(b => b.onclick = () => tocarFaixa(lista[+b.dataset.trplay].id));
    $$('[data-trdel]').forEach(b => b.onclick = () => {
      const f = lista[+b.dataset.trdel], novo = Object.assign({}, trilha(), { lista: lista.filter((_, i) => i !== +b.dataset.trdel) });

  /* ---------- Bestiário (só narrador) ---------- */
  // Criaturas de js/data/bestiary-data.js, o mesmo Bestiário da ficha. Cada uma vira um
  // token de NPC ligado à criatura por personagem_id = "bestiario:<nome>" (sem coluna nova).
  const BEST = window.BESTIARY_DATA || [];
  const BEST_CATS = ['TODOS', 'BESTA NATURAL', 'BESTA MÁGICA', 'BESTA DE NEN', 'ABERRAÇÃO', 'MONSTRUOSIDADE', 'PLAYTEST'];
  const BEST_COR = { 'BESTA NATURAL': '#22c55e', 'BESTA MÁGICA': '#a855f7', 'BESTA DE NEN': '#06b6d4', 'ABERRAÇÃO': '#f97316', 'MONSTRUOSIDADE': '#ef4444', 'PLAYTEST': '#f59e0b', 'PLANTA': '#4ade80', 'TODOS': '#00ff9d' };
  const BEST_PREFIXO = 'bestiario:';
  const BEST_ATR = [['for', 'FOR'], ['des', 'DES'], ['con', 'CON'], ['int', 'INT'], ['sab', 'SAB'], ['car', 'CAR']];
  const BB = { busca: '', cat: 'TODOS', aberto: null, imgs: null };
  const bestDe = t => (t && typeof t.personagem_id === 'string' && t.personagem_id.startsWith(BEST_PREFIXO)) ? (BEST.find(m => m.nome === t.personagem_id.slice(BEST_PREFIXO.length)) || null) : null;
  const bestImg = m => (BB.imgs || {})[NV.slugBest(m.nome)] || null;
  const bestPV = m => { const n = parseInt(String(m.pv || '')); return n > 0 ? n : 10; };
  // Tamanho do token pela categoria de tamanho do tipo ("Besta Enorme, Neutro" → 3×3).
  const bestTamanho = m => { const t = String(m.tipo || ''); return /Colossal|Imens/.test(t) ? 4 : /Enorme/.test(t) ? 3 : /Grande/.test(t) ? 2 : 1; };
  const bestMod = v => { const m = String(v || '').replace(/−/g, '-').match(/\(([+\-]\d+)\)/); return m ? parseInt(m[1]) : 0; };
  // "Atletismo +11, Furtividade +1" → [{ n: 'Atletismo', v: 11 }, …]
  const bestLista = s => String(s || '').replace(/−/g, '-').split(',').map(x => x.trim().match(/^(.+?)\s*([+\-]\d+)$/)).filter(Boolean).map(m => ({ n: m[1].trim(), v: parseInt(m[2]) }));
  // Mesma leitura das ações do bestiario.js: "+11 para atingir" e o dado entre parênteses;
  // além disso pega a CD ("TR DES CD 22" ou "CD 20 FOR") para ações sem jogada de ataque.
  function bestAcoes(m) {
    return (m.acoes || []).map(a => {
      const atk = a.d.match(/([+\-]\d+) para (atingir|acertar)/i);
      const dmg = a.d.match(/\((\d+d\d+(?:\s*[+\-]\s*\d+)?)\)/);
      const tipo = a.d.match(/\(\d+d\d+(?:\s*[+\-]\s*\d+)?\)\s+([a-záéíóúàãõâêîôûç]+)/i);
      const c1 = a.d.match(/TR\s+(?:de\s+)?(FOR|DES|CON|INT|SAB|CAR)\s+CD\s*(\d+)/i), c2 = a.d.match(/CD\s*(\d+)\s+(FOR|DES|CON|INT|SAB|CAR)/i);
      const cd = c1 ? { a: c1[1].toUpperCase(), v: +c1[2] } : c2 ? { a: c2[2].toUpperCase(), v: +c2[1] } : null;
      return { n: a.n, atk: atk ? parseInt(atk[1]) : null, dmg: dmg ? dmg[1].replace(/\s+/g, '') : null, tipo: tipo ? tipo[1] : '', cd };
    }).filter(a => a.atk != null || a.dmg || a.cd);
  }
  async function carregarImgsBest() {
    if (BB.imgs) return;
    try { BB.imgs = await NV.imagensBestiario(); } catch (e) { BB.imgs = {}; }
  }
  function paneBest() {
    P().innerHTML = `<h4>Bestiário</h4>
      <input class="input" id="bBusca" placeholder="Buscar criatura, tipo ou categoria…" value="${esc(BB.busca)}" autocomplete="off" aria-label="Buscar criatura">
      <div class="bcats">${BEST_CATS.map(c => `<button data-bcat="${c}" class="${BB.cat === c ? 'on' : ''}" style="--c:${BEST_COR[c]}">${c === 'TODOS' ? 'TODAS' : c}</button>`).join('')}</div>
      <div class="stack" id="bLista"></div>
      <p class="hint">As imagens enviadas aqui valem para todas as mesas. A criatura entra com PV cheio e com as barras escondidas dos jogadores.</p>`;

    $('#bBusca').oninput = e => { BB.busca = e.target.value; listaBest(); };
    $$('[data-bcat]').forEach(b => b.onclick = () => { BB.cat = b.dataset.bcat; paneBest(); });

  function listaBest() {
    const el = $('#bLista'); if (!el) return;
    const q = BB.busca.trim().toLowerCase();
    const lista = BEST.filter(m => (BB.cat === 'TODOS' || m.cat === BB.cat) && (!q || [m.nome, m.tipo, m.cat].some(x => String(x).toLowerCase().includes(q))));
    el.innerHTML = lista.length ? lista.map(m => {
      const cor = BEST_COR[m.cat] || '#94a3b8', img = bestImg(m), ab = BB.aberto === m.nome;
      const noMapa = Object.values(S.tokens).filter(t => t.personagem_id === BEST_PREFIXO + m.nome).length;
      return `<div class="bcard" style="--c:${cor}">
        <div class="bcard-h">${img ? `<img class="bthumb" src="${esc(img)}" alt="">` : `<span class="bthumb">${esc(m.nome[0])}</span>`}
          <div style="min-width:0;flex:1"><b>${esc(m.nome)}</b><div class="tiny">${esc(m.tipo)}</div>
          <div class="bstat"><span>CA ${esc(String(m.ca).split(' ')[0])}</span><span>PV ${bestPV(m)}</span><span>${esc(m.desl)}</span>${noMapa ? `<span style="color:var(--blue-6)">${noMapa} no mapa</span>` : ''}</div></div></div>
        <div class="row"><button class="btn btn-sm btn-primary" data-bput="${esc(m.nome)}"><i class="ph-bold ph-plus"></i> Mapa</button>
          <button class="btn btn-sm" data-bimg="${esc(m.nome)}"><i class="ph ph-image"></i> ${img ? 'Trocar imagem' : 'Imagem'}</button>
          <button class="btn btn-sm btn-ghost" data-bver="${esc(m.nome)}">${ab ? 'Fechar' : 'Ficha'}</button></div>
        ${ab ? bestDetalhe(m) : ''}</div>`;
    }).join('') : '<p class="hint">Nenhuma criatura encontrada.</p>';
    const acha = n => BEST.find(m => m.nome === n);
    $$('[data-bver]').forEach(b => b.onclick = () => { BB.aberto = BB.aberto === b.dataset.bver ? null : b.dataset.bver; listaBest(); });
    $$('[data-bput]').forEach(b => b.onclick = () => colocarBest(acha(b.dataset.bput), b));
    $$('[data-bimg]').forEach(b => b.onclick = () => imagemBest(acha(b.dataset.bimg), b));
  }
  function bestDetalhe(m) {
    const linha = (l, v) => v ? `<p><b>${l}:</b> ${esc(v)}</p>` : '';
    return `<div class="bdet">
      ${m.for !== '—' ? `<div class="attrs6">${BEST_ATR.map(([k, l]) => `<div><small>${l}</small>${esc(m[k])}</div>`).join('')}</div>` : ''}
      ${linha('CA', m.ca)}${linha('PV', m.pv)}${linha('Reações', m.reacoes)}${linha('Perícias', m.pericias)}${linha('TRs', m.trs)}${linha('Imunidades', m.imunidades)}${linha('Resistências', m.resistencias)}${linha('Vulnerabilidades', m.vulnerabilidades)}${linha('Sentidos', m.sentidos)}${linha('Língua', m.lingua)}
      ${(m.tracos || []).length ? `<h4 style="margin-top:10px">Traços</h4>${m.tracos.map(t => `<p><b>${esc(t.n)}.</b> ${esc(t.d)}</p>`).join('')}` : ''}
      ${(m.acoes || []).length ? `<h4 style="margin-top:10px">Ações</h4>${m.acoes.map(a => `<p><b>${esc(a.n)}.</b> ${esc(a.d)}</p>`).join('')}` : ''}
    </div>`;
  }
  async function colocarBest(m, btn) {
    if (!m) return;
    btn.disabled = true;
    // Bando: a segunda criatura igual vira "Corvo Ventríloquo 2", e assim por diante.
    const iguais = Object.values(S.tokens).filter(t => t.personagem_id === BEST_PREFIXO + m.nome).length;
    const hp = bestPV(m), pos = centroLivre(bestTamanho(m));
    const row = { mesa_id: S.mesa.id, tipo: 'npc', owner: NV.user.id, personagem_id: BEST_PREFIXO + m.nome, nome: iguais ? `${m.nome} ${iguais + 1}` : m.nome,
      img_url: bestImg(m), cor: BEST_COR[m.cat] || '#ef4444', tamanho: bestTamanho(m), hp, hp_max: hp, aura: 0, aura_max: 0, barras_publicas: false, x: pos.x, y: pos.y };
    const { data, error } = await sb.from('tokens').insert(row).select('*').single();
    btn.disabled = false;

  /* ---------- Dados (estilo Roll20) ---------- */
  const DADO = { qtd: 1, mod: 0, secreta: false, modo: 'Normal' };
  const d20 = () => 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * 20);
  // Mesmos modos do getRollResult da ficha: Vantagem/Desvantagem ficam com o maior/menor;
  // Ênfase fica com o dado mais longe de 10,5 (o resultado mais extremo).
  function d20Modo(modo) {
    const a = d20();
    if (modo === 'Normal') return { v: a, x: [] };
    const b = d20();
    const fica = modo === 'Vantagem' ? Math.max(a, b) : modo === 'Desvantagem' ? Math.min(a, b) : (Math.abs(a - 10.5) > Math.abs(b - 10.5) ? a : b);
    return { v: fica, x: [fica === a ? b : a] };
  }
  function parseRolagem(txt) {
    const f = String(txt || '').toLowerCase().replace(/\s+/g, '').replace(/^\+/, '');
    if (!f || !/^[0-9d+\-]+$/.test(f)) throw new Error('Use o formato 1d20+4, 2d6, 3d6-1…');
    const termos = f.match(/[+\-]?[^+\-]+/g);
    let total = 0, nd = 0; const det = [];
    termos.forEach(t => {
      const sinal = t[0] === '-' ? -1 : 1, corpo = t.replace(/^[+\-]/, '');
      const m = corpo.match(/^(\d*)d(\d+)$/);
      if (m) {
        const n = Math.max(1, +(m[1] || 1)), lados = +m[2];
        if (lados < 2 || lados > 1000) throw new Error('Dado de 2 a 1000 lados');
        nd += n; if (nd > 60) throw new Error('No máximo 60 dados por rolagem');
        const r = Array.from({ length: n }, () => 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * lados));
        const soma = r.reduce((a, b) => a + b, 0) * sinal; total += soma; det.push({ d: lados, s: sinal, r });
      } else if (/^\d+$/.test(corpo)) { total += sinal * +corpo; det.push({ k: sinal * +corpo }); }
      else throw new Error('Não entendi "' + t + '"');
    });
    if (!nd) throw new Error('Inclua pelo menos um dado, ex.: 1d20');
    return { total, det, formula: f };
  }
  function meuNome() {

  async function gravarRolagem(r, rotulo, nome) {
    const row = { mesa_id: S.mesa.id, user_id: NV.user.id, nome: nome || meuNome(), rotulo: rotulo || '', formula: r.formula, total: r.total, detalhe: r.det, secreta: DADO.secreta };

    if (error) { toast(errMsg(error), 'warning'); return null; }

  async function rolar(formula, rotulo, nome) {

    return gravarRolagem(r, rotulo, nome);

  // Teste de d20 + modificador respeitando o modo escolhido na aba Dados.
  // O dado descartado vai em "x" e aparece riscado no histórico.
  function rolarD20(mod, rotulo, nome) {
    const m = DADO.modo, d = d20Modo(m);
    const det = [{ d: 20, s: 1, r: [d.v], x: d.x }];

  function critico(r) {

  function fumaca() { // nuvem de anime: círculos com contorno único
    const P = [[22, 70, 16], [40, 78, 20], [62, 78, 18], [80, 70, 14], [32, 62, 12], [70, 62, 12], [52, 66, 14]];
    return `<svg viewBox="0 0 100 100" class="smoke"><g stroke="#1b1d2a" stroke-width="7">${P.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g><g fill="#f4f1ea">${P.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g><g fill="#fff">${P.slice(0, 4).map(([x, y, r]) => `<circle cx="${x - r * .3}" cy="${y - r * .3}" r="${r * .35}"/>`).join('')}</g></svg>`;
  }
  function renderDiceToast() {
    const st = $('#stage'); if (!st || !ultimaRolagem || Date.now() - ultimaRolagem.t > 7000) return;
    const old = $('#diceToast'); if (old) old.remove();
    const r = ultimaRolagem.r, c = critico(r);
    const dados = []; let mod = 0;
    (r.detalhe || []).forEach(x => { if (x.k != null) mod += x.k; else x.r.forEach(v => dados.push({ d: x.d, v, neg: x.s < 0 })); });
    const vis = dados.slice(0, 6), extra = dados.length - vis.length;
    const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = document.createElement('div'); el.id = 'diceToast'; el.className = 'droll ' + c + (reduz ? ' still' : '');
    el.innerHTML = `<div class="dr-tray">${vis.map((x, i) => `<div class="dr-die" style="--i:${i};--sx:${(i % 2 ? 1 : -1) * (120 + i * 30)}px;--rot:${(i % 2 ? 1 : -1) * (540 + i * 90)}deg">
        <div class="dr-smoke">${fumaca()}</div><div class="dr-body" data-d="${x.d}" data-v="${x.v}">${dadoSVG(x.d, '?')}</div>${x.neg ? '<b class="dr-neg">−</b>' : ''}</div>`).join('')}
        ${extra > 0 ? `<div class="dr-more">+${extra}</div>` : ''}</div>
      <div class="dr-info"><div class="dr-n">${esc(r.nome)}${r.rotulo ? ` · ${esc(r.rotulo)}` : ''}<small>${esc(r.formula)}${mod ? ` (${mod > 0 ? '+' : ''}${mod})` : ''}${r.secreta ? ' · <i class="ph ph-lock"></i> secreta' : ''}</small></div>
        <div class="dr-total"><span>Total</span><b>${r.total}</b></div></div>`;
    st.appendChild(el);
    // números trocando enquanto o dado gira; para no valor ao cair
    $$('.dr-body', el).forEach((b, i) => {
      const lados = +b.dataset.d, fim = b.dataset.v, para = reduz ? 0 : 1250 + i * 120;
      const t0 = performance.now();
      const tick = () => {
        const num = b.querySelector('.dnum'); if (!num || !el.isConnected) return;
        if (performance.now() - t0 >= para) { num.textContent = fim; b.classList.add('land'); return; }
        num.textContent = 1 + Math.floor(Math.random() * lados);
        setTimeout(tick, 80);
      };
      tick();
    });
    clearTimeout(diceTimer); diceTimer = setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 6500);
  }

  function paneNinja() {

      const row = { nome: p.nome, personagem_id: p.id, img_url: img, cor: cl ? cl.color : '#00ff9d', hp: r.hp, hp_max: r.hpMax, aura: r.aura, aura_max: r.auraMax };
      let res;
      if (meuTok) res = await sb.from('tokens').update(row).eq('id', meuTok.id).select('*').single();
      else { const pos = centroLivre(); res = await sb.from('tokens').insert(Object.assign(row, { mesa_id: S.mesa.id, tipo: 'pj', owner: NV.user.id, x: pos.x, y: pos.y })).select('*').single(); }
      if (res.error) { b.disabled = false; return toast(errMsg(res.error), 'warning'); }
      FICHAS[p.id] = p.dados;
      S.tokens[res.data.id] = res.data; if (vistaAtual() === 'mapa') renderTokens(); paneNinja(); toast(`${p.nome} está na mesa`, 'user');

  /* ---------- Chat ---------- */
  // Mensagens e rolagens aparecem juntas, em ordem (como no Roll20).
  // "/r 1d20+3" no campo rola o dado em vez de mandar texto.
  const hora = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  function paneChat() {
    if (!S.chatOk) {
      P().innerHTML = `<div class="chat-vazio"><i class="ph ph-chat-circle-slash" style="font-size:32px"></i><p style="margin-top:8px">O chat ainda não está ligado: falta criar a tabela <b>mensagens</b> no Supabase.</p></div>`;
      return;
    }
    P().innerHTML = `<div class="chat-head"><h4>Chat da mesa</h4>${S.gm && S.chat.length ? '<button class="btn btn-sm btn-ghost" id="chatClr" style="color:var(--red-6)">Limpar</button>' : ''}</div>
      <div class="chat-list" id="chatList"></div>
      <form class="chat-form" id="chatForm" autocomplete="off"><div class="mencao-lista" id="mencaoLista" hidden></div><input class="input" id="chatIn" maxlength="500" placeholder="Mensagem… (@nome marca alguém · /r 1d20+3 rola dado)" aria-label="Mensagem"><button class="btn btn-primary" aria-label="Enviar"><i class="ph-bold ph-paper-plane-right"></i></button></form>`;
    renderChatList(true);
    $('#chatForm').onsubmit = e => { e.preventDefault(); if (!mencaoEnter()) enviarMsg(); };
    ligarMencao();
    // Só foca no desktop: no celular abriria o teclado sozinho.
    if (matchMedia('(pointer: fine)').matches) $('#chatIn').focus();
    const clr = $('#chatClr'); if (clr) clr.onclick = async () => {
      if (!confirm('Apagar todas as mensagens do chat? As rolagens continuam.')) return;
      const { error } = await sb.from('mensagens').delete().eq('mesa_id', S.mesa.id);
      if (error) return toast(errMsg(error), 'warning');
      S.chat = []; paneChat();
    };
  }
  function msgHTML(m, cont) {
    const quem = S.perfis[m.user_id] || {}, gm = m.user_id === S.mesa.owner, meu = m.user_id === NV.user.id;
    // Fui marcado nesta mensagem? Só vale se foi outra pessoa que escreveu.
    const marcou = !meu && mencionaUsuario(m.texto, NV.user.id);
    return `<div class="msg ${meu ? 'mine' : ''} ${cont ? 'cont' : ''} ${marcou ? 'me-marcou' : ''}">
      ${cont ? '<span></span>' : avatar(quem)}
      <div style="min-width:0">${cont ? '' : `<div class="msg-h"><b title="${esc(quem.nome || '')}">${esc(m.nome || quem.nome || 'Hunter')}</b>${gm ? '<span class="gm">Narrador</span>' : ''}<time>${hora(m.created_at)}</time></div>`}
      <div class="msg-t">${pintarMencoes(esc(m.texto))}</div></div></div>`;
  }
  function renderChatList(forcar) {
    const el = $('#chatList'); if (!el) return;
    const perto = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    const itens = S.chat.map(m => ({ t: 'm', at: m.created_at, m }))
      .concat(S.rolagens.map(r => ({ t: 'r', at: r.created_at, m: r })))
      .sort((a, b) => new Date(a.at) - new Date(b.at)).slice(-200);
    let ant = null;
    el.innerHTML = itens.length ? itens.map(it => {
      if (it.t === 'r') { ant = null; return rolagemHTML(it.m); }
      // Mensagens seguidas da mesma pessoa em até 3 min ficam agrupadas.
      const cont = ant && ant.user_id === it.m.user_id && new Date(it.m.created_at) - new Date(ant.created_at) < 180000;
      ant = it.m; return msgHTML(it.m, cont);
    }).join('') : '<div class="chat-vazio">Ninguém falou nada ainda. Diga oi para a mesa!</div>';
    if (forcar || perto) el.scrollTop = el.scrollHeight;
  }
  function addMsg(n) {
    if (S.chat.some(x => x.id === n.id)) return false;
    S.chat.push(n); if (S.chat.length > 300) S.chat = S.chat.slice(-300);
    return true;
  }
  /* ---------- Autocompletar da menção ----------
     Abre ao digitar "@" e filtra conforme a pessoa escreve. Existe porque sem ele
     a menção viraria adivinhação: o jogador teria que acertar o nome de cor, com
     acento e tudo, e um erro de digitação não marcaria ninguém — em silêncio. */
  let mencaoSel = 0;
  function mencaoTermo(inp) {
    // Só o trecho DEPOIS do último "@" e até o cursor; e só se não houver espaço
    // no meio, senão "@joao falou com" continuaria com a lista aberta.
    const antes = inp.value.slice(0, inp.selectionStart);
    const m = antes.match(/@([\p{L}\p{N}_]*)$/u);
    return m ? m[1] : null;
  }
  function fecharMencao() { const l = $('#mencaoLista'); if (l) { l.hidden = true; l.innerHTML = ''; } mencaoSel = 0; }
  function abrirMencao() {
    const inp = $('#chatIn'), l = $('#mencaoLista'); if (!inp || !l) return;
    const termo = mencaoTermo(inp);
    if (termo === null) return fecharMencao();
    const sa = semAcento(termo);
    const nomes = alvosMencao()
      .filter(a => a.id !== NV.user.id)                 // marcar a si mesmo não serve
      .filter(a => !sa || semAcento(a.nome).indexOf(sa) === 0 || semAcento(a.primeiro).indexOf(sa) === 0)
      .slice(0, 6);
    if (!nomes.length) return fecharMencao();
    if (mencaoSel >= nomes.length) mencaoSel = 0;
    l.innerHTML = nomes.map((a, i) => `<button type="button" class="${i === mencaoSel ? 'on' : ''}" data-nome="${esc(a.primeiro)}">${avatar(S.perfis[a.id])}<span>${esc(a.nome)}</span></button>`).join('');
    l.hidden = false;
    Array.from(l.querySelectorAll('button')).forEach(b => { b.onclick = () => inserirMencao(b.dataset.nome); });
  }
  function inserirMencao(nome) {
    const inp = $('#chatIn'); if (!inp) return;
    const antes = inp.value.slice(0, inp.selectionStart), depois = inp.value.slice(inp.selectionStart);
    const novo = antes.replace(/@([\p{L}\p{N}_]*)$/u, '@' + nome + ' ');
    inp.value = novo + depois;
    inp.selectionStart = inp.selectionEnd = novo.length;
    fecharMencao(); inp.focus();
  }
  // Enter com a lista aberta escolhe o nome em vez de enviar a mensagem.
  function mencaoEnter() {
    const l = $('#mencaoLista'); if (!l || l.hidden) return false;
    const b = l.querySelector('button.on') || l.querySelector('button');
    if (!b) return false;
    inserirMencao(b.dataset.nome); return true;
  }
  function ligarMencao() {
    const inp = $('#chatIn'); if (!inp) return;
    inp.oninput = abrirMencao;
    inp.onblur = () => setTimeout(fecharMencao, 150);   // deixa o clique no nome acontecer
    inp.onkeydown = e => {
      const l = $('#mencaoLista'); if (!l || l.hidden) return;
      const n = l.querySelectorAll('button').length; if (!n) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); mencaoSel = (mencaoSel + 1) % n; abrirMencao(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); mencaoSel = (mencaoSel - 1 + n) % n; abrirMencao(); }
      else if (e.key === 'Escape') { e.preventDefault(); fecharMencao(); }
      else if (e.key === 'Tab') { e.preventDefault(); mencaoEnter(); }
    };
  }

  async function enviarMsg() {
    const inp = $('#chatIn'), txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    const cmd = txt.match(/^\/r(?:oll)?\s+(.+)$/i);
    if (cmd) return rolar(cmd[1]);
    const { data, error } = await sb.from('mensagens').insert({ mesa_id: S.mesa.id, user_id: NV.user.id, nome: meuNome(), texto: txt.slice(0, 500) }).select('*').single();
    if (error) { inp.value = txt; return toast(errMsg(error), 'warning'); }
    addMsg(data); renderChatList(true);
  }
  let chatCh = null;
  // Canal separado do resto da mesa: se o chat falhar, mover token e rolar dado continuam.
  function assinarChat(id) {
    if (chatCh) { sb.removeChannel(chatCh); chatCh = null; }
    if (!S.chatOk) return;
    chatCh = sb.channel('mesa-chat-' + id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mensagens', filter: `mesa_id=eq.${id}` }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') S.chat = S.chat.filter(x => x.id !== o.id);
        else if (addMsg(n) && n.user_id !== NV.user.id) {
          // A menção avisa SEMPRE, inclusive com a aba do chat aberta: é o ponto
          // dela. A mensagem comum só avisa quando o jogador está noutra aba, que
          // é como já era.
          const paraMim = mencionaUsuario(n.texto, NV.user.id);

            toast(`<b>${esc(n.nome || 'Hunter')}</b> marcou você:&nbsp;${esc(n.texto.length > 60 ? n.texto.slice(0, 60) + '…' : n.texto)}`, 'at');
          } else if (S.tab !== 'chat') {
            Avisos.msg();
            toast(`<b>${esc(n.nome || 'Hunter')}:</b>&nbsp;${esc(n.texto.length > 60 ? n.texto.slice(0, 60) + '…' : n.texto)}`, 'chat-circle-dots');
          }
        }
        if (S.tab === 'chat') renderChatList();
      })
      .subscribe();
  }

  /* ---------- Tempo real ---------- */
  function assinar(id) {
    if (channel) sb.removeChannel(channel);
    const f = `mesa_id=eq.${id}`;
    channel = sb.channel('mesa-' + id, { config: { broadcast: { self: false } } })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tokens', filter: f }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') { delete S.tokens[o.id]; if (S.sel === o.id) S.sel = null; if ($('#tokLayer')) renderTokens(); }
        else {
          // Sem a coluna no banco, a linha chega sem reacoes/principios: mantém o valor ao vivo.
          const velho = S.tokens[n.id]; if (velho) ['reacoes', 'principios'].forEach(k => { if (!(k in n) && k in velho) n[k] = velho[k]; });
          S.tokens[n.id] = n; if ($('#tokLayer')) atualizarToken(n); if (S.sel === n.id) renderTokPanel();
        }
        if (!$('#tokLayer')) renderOrdem();   // na cena não há mapa, mas a ordem continua no palco
        if (S.tab === 'tokens' || S.tab === 'ninja' || S.tab === 'grupo') renderSide();
        else if (S.tab === 'best') listaBest();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mesas', filter: `id=eq.${id}` }, ({ eventType, new: n }) => {
        if (eventType === 'DELETE') { toast('O narrador encerrou esta mesa', 'flag-checkered'); setTimeout(() => location.href = 'mesa.html', 1500); return; }
        const mudou = n.exibindo !== S.mesa.exibindo || n.cena_id !== S.mesa.cena_id;
        const vezMudou = (n.turno || {}).vez !== turno().vez;
        const somMudou = JSON.stringify(n.trilha || null) !== JSON.stringify(S.mesa.trilha || null);
        S.mesa = n; renderBar(); if (mudou && (!S.gm || !S.view)) renderStage();
        renderTokens(); if (vezMudou) avisoVez();
        if (somMudou) { aplicarTrilha(); if (S.tab === 'trilha') paneTrilha(); }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cenas', filter: f }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') S.cenas = S.cenas.filter(c => c.id !== o.id);
        else { const i = S.cenas.findIndex(c => c.id === n.id); if (i >= 0) S.cenas[i] = n; else S.cenas.push(n); }
        if (vistaAtual() === 'cena') renderStage();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mapas', filter: f }, ({ eventType, new: n }) => {
        S.mapa = eventType === 'DELETE' ? null : n; if (vistaAtual() === 'mapa') renderStage();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mesa_membros', filter: f }, async ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') { S.membros = S.membros.filter(x => !(x.user_id === o.user_id)); if (o.user_id === NV.user.id && !S.gm) { toast('Você saiu desta mesa', 'hand-waving'); setTimeout(() => location.href = 'mesa.html', 1200); return; } }
        else { const i = S.membros.findIndex(x => x.user_id === n.user_id); if (i >= 0) S.membros[i] = n; else { S.membros.push(n); await carregarPerfis(); toast(`${(S.perfis[n.user_id] || {}).nome || 'Alguém'} entrou na mesa`, 'confetti'); } }
        renderBar(); if (S.tab === 'grupo') renderSide();
      })
      .on('broadcast', { event: 'tok' }, ({ payload: p }) => {
        const t = S.tokens[p.id]; if (!t) return; Object.assign(t, p); if ($('#tokLayer')) atualizarToken(t); else renderOrdem(); if (S.sel === t.id) renderTokPanel();
      })
      .on('broadcast', { event: 'ping' }, ({ payload: p }) => mostrarPing(p.x, p.y, COR_PING_GM, 'Narrador'))
      .on('broadcast', { event: 'ruler' }, ({ payload: p }) => {
        if (p.pts) S.rulers[p.u] = { pts: p.pts, nome: (p.nome || '').split(' ')[0], t: Date.now() }; else delete S.rulers[p.u];
        desenharOverlay();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rolagens', filter: f }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') { S.rolagens = S.rolagens.filter(x => x.id !== o.id); }
        else if (podeVerRolagem(n) && !S.rolagens.some(x => x.id === n.id)) {
          S.rolagens.unshift(n);
          if (!S.rolAntigas && S.rolagens.length > 80) { S.rolagens = S.rolagens.slice(0, 80); S.rolFim = false; }
          mostrarRolagem(n);
        }
        if (S.tab === 'dados') paneDados(); else if (S.tab === 'chat') renderChatList();
      })
      .on('broadcast', { event: 'move' }, ({ payload: p }) => {
        const t = S.tokens[p.id]; if (!t || (drag && drag.id === p.id)) return;
        const el = $(`.tok[data-id="${p.id}"]`); if (el) { el.style.left = p.x * CELL + 'px'; el.style.top = p.y * CELL + 'px'; }
      })
      .subscribe(status => { if (status === 'CHANNEL_ERROR') toast('Conexão ao vivo instável. Recarregue se algo não atualizar.', 'wifi-medium'); });
  }

  /* ---------- Início ---------- */
  NV.ready.then(async () => {
    if (!NV.user) return lobby();
    const cod = qs.get('entrar');
    if (cod) {
      const { data, error } = await sb.rpc('entrar_mesa', { cod, uid: NV.user.id });
      if (error) { toast('Convite inválido ou expirado', 'warning'); history.replaceState(null, '', 'mesa.html'); return lobby(); }
      history.replaceState(null, '', 'mesa.html?m=' + data);
      return abrirMesa(data);
    }
    const m = qs.get('m');
    m ? abrirMesa(m) : lobby();
  });
  // Saiu do HxH5e (em outra aba): a mesa sai junto.
  NV.onAuth(u => { if (!u) location.href = NV.APP_URL; });
})();
</script>
</body>
</html>
