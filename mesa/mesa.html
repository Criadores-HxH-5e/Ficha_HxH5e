        <div class="vp ${S.tool === 'regua' ? 'ruler' : ''}" id="vp"><div class="world" id="world"><div class="area" id="area"><div class="gl"></div></div><svg class="ovl" id="ovl" width="1" height="1"></svg><div id="tokLayer"></div></div>
        <div class="zoombar"><button id="zIn" title="Aproximar (+ ou Cmd/Ctrl + scroll)" aria-label="Aproximar"><i class="ph-bold ph-plus"></i></button><button id="zOut" title="Afastar (−)" aria-label="Afastar"><i class="ph-bold ph-minus"></i></button><button id="zOne" title="Tamanho real (1)" style="font-size:12px">1:1</button><button id="zFit" title="Ver o mapa inteiro (0)" aria-label="Ver o mapa inteiro"><i class="ph ph-crosshair"></i></button></div></div>`;
      montarMapa();
    } else {
      st.innerHTML = html + `<div class="wait"><div><svg><use href="#spiral"/></svg><h2>${S.gm ? 'Nada ao vivo ainda' : 'Aguardando o narrador…'}</h2><p>${S.gm ? 'Escolha uma cena ou monte o battlemap e clique em "Exibir para os jogadores".' : 'Pegue seus dados. A missão já vai começar.'}</p></div></div>`;
    }
    $$('.viewsw button').forEach(b => b.onclick = () => { S.view = b.dataset.v; S.previewCena = null; renderStage(); });
    $$('#tools button').forEach(b => b.onclick = () => {
      if (b.dataset.tool === 'dados') { S.tab = 'dados'; renderSide(); $('#app').classList.add('side-open'); return; }
      setTool(b.dataset.tool);
    });
    renderDiceToast();
  }
  function setTool(t) {
    S.tool = t; $$('#tools button[data-tool]').forEach(x => x.classList.toggle('on', x.dataset.tool === t));
    const v = $('#vp'); if (v) v.classList.toggle('ruler', t === 'regua');
  }
  addEventListener('keyup', e => { if (e.code === 'Space') { espaco = false; const v = $('#vp'); if (v) v.classList.remove('grab'); } });
  addEventListener('keydown', e => {
    if (!document.body.classList.contains('in-mesa') || /input|textarea|select/i.test(e.target.tagName)) return;
    const v = $('#vp');
    if (v && (e.key === '+' || e.key === '=')) { e.preventDefault(); const r = v.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1.4); }
    if (v && (e.key === '-' || e.key === '_')) { e.preventDefault(); const r = v.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / 1.4); }
    if (v && e.key === '0') { e.preventDefault(); centralizar(); }
    if (v && e.key === '1') { e.preventDefault(); const r = v.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / cam.z); }
    if (v && e.code === 'Space' && !espaco) { e.preventDefault(); espaco = true; v.classList.add('grab'); }
    if (e.key === 'r' || e.key === 'R') setTool(S.tool === 'regua' ? 'mover' : 'regua');
    if (e.key === 'm' || e.key === 'M') setTool('mover');
    if (e.key === 'Escape' && rul) { rul = null; desenharOverlay(); enviarRegua(null); }
  });

  /* ---------- Battlemap ---------- */
  let vp, world, drag = null, pointers = new Map(), pinch = null;
  function aplicarCam() {
    if (!world) return;
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
    vp.style.setProperty('--g', CELL * cam.z + 'px');
    vp.style.setProperty('--gx', cam.x + 'px'); vp.style.setProperty('--gy', cam.y + 'px');
    clearTimeout(aplicarCam.t);
    aplicarCam.t = setTimeout(() => { try { localStorage.setItem('hxh-mesa-cam-' + S.mesa.id, JSON.stringify(cam)); } catch (e) {} }, 400);
  }
  function zoomEm(px, py, f) {
    const z = Math.max(0.2, Math.min(8, cam.z * f));
    const k = z / cam.z;
    cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.z = z; aplicarCam(); desenharOverlay();
  }
  function mapaVisivel() { return (S.gm && S.mapaPreview && vistaAtual() === 'mapa') ? S.mapaPreview : (S.mapa || { cols: 30, rows: 30, fundo_url: null, config: {} }); }
  function centralizar() {
    const m = mapaVisivel();
    const r = vp.getBoundingClientRect();
    const z = Math.max(0.25, Math.min(1.5, Math.min(r.width / (m.cols * CELL + 80), r.height / (m.rows * CELL + 80))));
    cam = { z, x: (r.width - m.cols * CELL * z) / 2, y: (r.height - m.rows * CELL * z) / 2 }; aplicarCam(); desenharOverlay();
  }
  function toWorld(cx, cy) { const r = vp.getBoundingClientRect(); return { x: (cx - r.left - cam.x) / cam.z, y: (cy - r.top - cam.y) / cam.z }; }

  function montarMapa() {
    vp = $('#vp'); world = $('#world');
    const m = mapaVisivel();
    const area = $('#area');
    area.style.width = m.cols * CELL + 'px'; area.style.height = m.rows * CELL + 'px';
    const gen = m.config && m.config.gen;
    area.classList.toggle('blank', !m.fundo_url && !gen);
    area.classList.toggle('gen', !!gen);
    area.querySelectorAll('svg').forEach(x => x.remove());
    const oldLeg = $('#mLegend'); if (oldLeg) oldLeg.remove();
    if (gen) {
      area.style.background = MapGen.fundo(gen.tipo);
      area.insertAdjacentHTML('afterbegin', MapGen.svg(gen, m.cols, m.rows));
      const leg = document.createElement('div'); leg.id = 'mLegend'; leg.className = 'mlegend';
      leg.innerHTML = MapGen.legenda(gen.tipo).map(l => `<span><i style="--c:${l.cor};${l.fundo ? `background:${l.fundo}` : ''}"></i>${l.nome}</span>`).join('');
      $('#stage').appendChild(leg);
    } else {
      area.style.background = '';
      area.style.backgroundImage = m.fundo_url ? `url("${m.fundo_url}")` : '';
    }
    aplicarCam();
    if (!localStorage.getItem('hxh-mesa-cam-' + S.mesa.id)) requestAnimationFrame(centralizar);
    renderTokens();
    $('#zIn').onclick = () => { const r = vp.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1.4); };
    $('#zOne').onclick = () => { const r = vp.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / cam.z); };
    $('#zOut').onclick = () => { const r = vp.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / 1.4); };
    $('#zFit').onclick = centralizar;
    vp.addEventListener('wheel', e => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const k = e.deltaMode === 1 ? 16 : 1;
      if (e.metaKey || e.ctrlKey) { const d = e.deltaY * k; zoomEm(e.clientX - r.left, e.clientY - r.top, Math.abs(d) >= 40 ? (d < 0 ? 1.2 : 1 / 1.2) : Math.exp(-d * 0.01)); }
      else { cam.x -= (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * k; cam.y -= (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * k; aplicarCam(); desenharOverlay(); }
    }, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    vp.addEventListener('mousedown', onRightDown, true);
    vp.addEventListener('contextmenu', e => e.preventDefault());
    desenharOverlay();
  }
  function podeMover(t) { return S.gm || t.owner === NV.user.id; }
  function barrasVisiveis(t) { return t.barras_publicas || S.gm || t.owner === NV.user.id; }
  function tokenHTML(t) {
    const sz = (t.tamanho || 1) * CELL;
    const vis = barrasVisiveis(t);
    const pct = (a, b) => Math.max(0, Math.min(100, b ? a / b * 100 : 0));
    const ini = (t.nome || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    return `<div class="tok ${t.tipo} ${podeMover(t) ? 'mine' : ''} ${S.sel === t.id ? 'sel' : ''}" data-id="${t.id}" style="left:${t.x * CELL}px;top:${t.y * CELL}px;width:${sz}px;height:${sz}px;--c:${esc(t.cor || '#1f5ae0')}">
      ${vis ? `<div class="bars ${t.barras_publicas ? '' : 'priv'}"><i class="hp"><b style="width:${pct(t.hp, t.hp_max)}%"></b></i><i class="au"><b style="width:${pct(t.aura, t.aura_max)}%"></b></i></div>` : ''}
      <div class="disc">${t.img_url ? `<img src="${esc(t.img_url)}" alt="" draggable="false">` : esc(ini)}</div>
      <div class="lbl">${esc(t.nome)}</div></div>`;
  }
  function renderTokens() {
    const L = $('#tokLayer'); if (!L) return;
    L.innerHTML = Object.values(S.tokens).sort((a, b) => (a.tipo === 'npc') - (b.tipo === 'npc')).map(tokenHTML).join('');
    renderTokPanel();
  }
  function atualizarToken(t) {
    const el = $(`.tok[data-id="${t.id}"]`);
    if (!el) return renderTokens();
    if (drag && drag.id === t.id) return;
    el.outerHTML = tokenHTML(t);
  }
  /* ---------- Régua e rotas quebradas ---------- */
  let rul = null, lastRul = 0;
  const centro = w => ({ x: Math.floor(w.x / CELL) + .5, y: Math.floor(w.y / CELL) + .5 });
  // Diagonais alternadas (Pathfinder): 1ª diagonal = 1 quadrado, 2ª = 2, 3ª = 1, 4ª = 2…
  // A contagem continua entre os trechos da rota. Reta = 1 quadrado. 1 quadrado = 1,5 m.
  function distQ(pts) {
    let q = 0, diag = 0;
    for (let i = 1; i < pts.length; i++) {
      const dx = Math.round(Math.abs(pts[i].x - pts[i - 1].x)), dy = Math.round(Math.abs(pts[i].y - pts[i - 1].y));
      const d = Math.min(dx, dy), reto = Math.max(dx, dy) - d;
      q += reto + d + (Math.floor((diag + d) / 2) - Math.floor(diag / 2));
      diag += d;
    }
    return q;
  }
  const txtDist = q => `${q} ${q === 1 ? 'quadrado' : 'quadrados'} · ${(q * 1.5).toLocaleString('pt-BR')} m`;
  function rotaSVG(pts, cor, nome) {
    if (!pts || pts.length < 2) return '';
    const P = pts.map(p => `${p.x * CELL},${p.y * CELL}`).join(' ');
    const fim = pts[pts.length - 1], k = 1 / cam.z;
    return `<polyline points="${P}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="${9 * k}" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${P}" fill="none" stroke="${cor}" stroke-width="${5 * k}" stroke-dasharray="${14 * k} ${9 * k}" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p, i) => `<circle cx="${p.x * CELL}" cy="${p.y * CELL}" r="${(i === 0 || i === pts.length - 1 ? 8 : 6) * k}" fill="${cor}" stroke="#1b1d2a" stroke-width="${2.5 * k}"/>`).join('')}
      ${nome ? `<text x="${fim.x * CELL + 14 * k}" y="${fim.y * CELL - 14 * k}" font-size="${14 * k}" font-family="Nunito, sans-serif" font-weight="800" fill="#fff" stroke="#1b1d2a" stroke-width="${4 * k}" paint-order="stroke">${esc(nome)} · ${txtDist(distQ(pts))}</text>` : ''}`;
  }
  function desenharOverlay() {
    const o = $('#ovl'); if (!o) return;
    let h = '';
    const agora = Date.now();
    Object.entries(S.rulers).forEach(([u, r]) => { if (agora - r.t > 4000) delete S.rulers[u]; else h += rotaSVG(r.pts, '#4d9dff', r.nome); });
    if (rul) h += rotaSVG(rul.pts.concat([rul.cur]), '#ffb24d');
    if (drag && drag.kind === 'tok' && drag.path && drag.moved && drag.can) h += rotaSVG(drag.path.concat([drag.cur]), '#ffb24d');
    o.innerHTML = h;
  }
  function enviarRegua(pts) {
    if (!channel) return;
    channel.send({ type: 'broadcast', event: 'ruler', payload: { u: NV.user.id, nome: (NV.perfil() || {}).nome || '', pts } });
  }
  function rotuloMedida(cx, cy, pts) {
    let me = $('#measure'); if (!me) { me = document.createElement('div'); me.id = 'measure'; me.className = 'measure'; vp.appendChild(me); }
    const r = vp.getBoundingClientRect();
    me.style.left = (cx - r.left) + 'px'; me.style.top = (cy - r.top) + 'px';
    const q = distQ(pts);
    me.innerHTML = `${txtDist(q)}${pts.length > 2 ? ` <small>· ${pts.length - 2} curva${pts.length > 3 ? 's' : ''}</small>` : ''}`;
  }
  let ultDireito = 0, botoesAnt = 0;
  function onRightDown(e) {
    if (e.button !== 2) return;
    e.preventDefault(); e.stopPropagation();
    if (performance.now() - ultDireito < 120) return;
    ultDireito = performance.now();
    if (rul) { rul.pts.push(rul.cur); desenharOverlay(); return; }
    if (drag && drag.kind === 'tok' && drag.can && drag.moved) { drag.path.push(drag.cur); desenharOverlay(); }
  }
  let lastBroadcast = 0;
  let espaco = false;
  function onDown(e) {
    if (e.button === 2) return;
    if (e.target.closest('.zoombar, .tools, .viewsw, .tokpanel')) return;
    // botão do meio ou espaço segurado = pan, em qualquer ferramenta
    if (e.button === 1 || espaco) {
      e.preventDefault(); try { vp.setPointerCapture(e.pointerId); } catch (err) {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false }; vp.classList.add('panning'); return;
    }
    try { vp.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; drag = null; return; }
    if (S.tool === 'regua' && e.pointerType !== 'touch' || S.tool === 'regua' && pointers.size === 1 && e.pointerType === 'touch') {
      const c = centro(toWorld(e.clientX, e.clientY)); rul = { pts: [c], cur: c }; desenharOverlay(); return;
    }
    const tokEl = e.target.closest('.tok');
    if (tokEl) {
      const t = S.tokens[tokEl.dataset.id];
      const w = toWorld(e.clientX, e.clientY);
      const tam = (t.tamanho || 1) / 2;
      drag = { kind: 'tok', id: t.id, el: tokEl, ox: w.x - t.x * CELL, oy: w.y - t.y * CELL, sx: e.clientX, sy: e.clientY, x0: t.x, y0: t.y, moved: false, can: podeMover(t), path: [{ x: t.x + tam, y: t.y + tam }], cur: { x: t.x + tam, y: t.y + tam } };
      return;
    }
    drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
    vp.classList.add('panning');
  }
  function onMove(e) {
    // botão direito apertado com o esquerdo segurado (eventos "chorded") = nova curva na rota
    if ((e.buttons & 2) && !(botoesAnt & 2) && (rul || drag)) onRightDown({ button: 2, preventDefault() {}, stopPropagation() {} });
    botoesAnt = e.buttons;
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()]; const r = vp.getBoundingClientRect();
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomEm((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, (pinch.z * d / pinch.d) / cam.z); return;
    }
    if (rul) {
      rul.cur = centro(toWorld(e.clientX, e.clientY)); desenharOverlay(); rotuloMedida(e.clientX, e.clientY, rul.pts.concat([rul.cur]));
      const now = performance.now(); if (now - lastRul > 90) { lastRul = now; enviarRegua(rul.pts.concat([rul.cur])); }
      return;
    }
    if (!drag) return;
    const dist = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if (dist > 4) drag.moved = true;
    if (drag.kind === 'pan') { cam.x = drag.cx + e.clientX - drag.sx; cam.y = drag.cy + e.clientY - drag.sy; aplicarCam(); return; }
    if (!drag.can || !drag.moved) return;
    const w = toWorld(e.clientX, e.clientY);
    const px = w.x - drag.ox, py = w.y - drag.oy;
    drag.el.classList.add('drag');
    drag.el.style.left = px + 'px'; drag.el.style.top = py + 'px';
    const tam = (S.tokens[drag.id].tamanho || 1) / 2;
    drag.cur = { x: Math.round(px / CELL) + tam, y: Math.round(py / CELL) + tam };
    desenharOverlay(); rotuloMedida(e.clientX, e.clientY, drag.path.concat([drag.cur]));
    const now = performance.now();
    if (channel && now - lastBroadcast > 70) { lastBroadcast = now; channel.send({ type: 'broadcast', event: 'move', payload: { id: drag.id, x: px / CELL, y: py / CELL } }); }
  }
  async function onUp(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    vp.classList.remove('panning');
    const m = $('#measure'); if (m) m.remove();
    if (rul) { rul = null; desenharOverlay(); enviarRegua(null); return; }
    const d = drag; drag = null; desenharOverlay();
    if (!d) return;
    if (d.kind === 'pan') { if (!d.moved && S.sel) { S.sel = null; renderTokens(); } return; }
    const t = S.tokens[d.id];
    if (!d.moved || !d.can) { S.sel = d.id; renderTokens(); if (!d.can && d.moved) toast('Esse token não é seu', 'hand'); return; }
    const w = toWorld(e.clientX, e.clientY);
    const nx = Math.round((w.x - d.ox) / CELL), ny = Math.round((w.y - d.oy) / CELL);
    t.x = nx; t.y = ny; S.sel = t.id;
    renderTokens();
    if (channel) channel.send({ type: 'broadcast', event: 'move', payload: { id: t.id, x: nx, y: ny } });
    const { error } = await sb.from('tokens').update({ x: nx, y: ny }).eq('id', t.id);
    if (error) { toast(errMsg(error), 'warning'); t.x = d.x0; t.y = d.y0; renderTokens(); }
  }

  /* painel do token selecionado */
  const FICHAS = {};
  async function carregaFicha(pid) {
    if (!pid || FICHAS[pid] !== undefined) return;
    FICHAS[pid] = null;
    const meu = S.meus.find(p => p.id === pid);
    if (meu) FICHAS[pid] = meu.dados || {};
    else { try { const f = await NV.obter(pid); FICHAS[pid] = f ? f.dados : false; } catch (e) { FICHAS[pid] = false; } }
    await null;
    if (S.sel && S.tokens[S.sel] && S.tokens[S.sel].personagem_id === pid) renderTokPanel();
  }
  const sinal = n => (n >= 0 ? '+' : '') + n;
  const ATR_COR = { FOR: '#f87171', DES: '#34d399', CON: '#fbbf24', INT: '#60a5fa', SAB: '#a78bfa', PRE: '#f472b6' };
  // Valores base da ficha: bônus de Hatsu e princípios ficam fora por enquanto.
  function atributosHTML(t) {
    if (t.tipo !== 'pj' || !t.personagem_id) return '';
    if (!(S.gm || t.owner === NV.user.id)) return '';
    const d = FICHAS[t.personagem_id];
    if (d === undefined) { carregaFicha(t.personagem_id); return '<div class="tp-atr carregando">Carregando atributos…</div>'; }
    if (d === null) return '<div class="tp-atr carregando">Carregando atributos…</div>';
    if (d === false) return '';
    const r = NV.resumo(d), cl = r.classe;
    const aba = S.tpAba === 'atk' ? 'atk' : 'atr';
    const pill = k => `<button class="tp-a" data-rola="${k}" style="--c:${ATR_COR[k]}" title="Rolar d20 ${sinal(r.attrs[k].mod)} (${k} ${r.attrs[k].valor})"><small>${k}</small><b>${sinal(r.attrs[k].mod)}</b></button>`;
    return `<div class="tp-atr">
      <div class="tp-sub">${cl ? `<span style="color:${cl.color}">${esc(cl.label)}</span> · ` : ''}Nível ${r.nivel} · Prof. +${r.pb}</div>
      <div class="tp-abas"><button data-tpaba="atr" class="${aba === 'atr' ? 'on' : ''}">Atributos</button><button data-tpaba="atk" class="${aba === 'atk' ? 'on' : ''}">Ataques</button></div>
      ${aba === 'atr' ? `<div class="tp-tres">${Object.keys(ATR_COR).map(pill).join('')}</div>` : ataquesHTML(d, r)}
      <div class="tp-def"><span>Iniciativa <b>${sinal(r.iniciativa)}</b></span><span class="tiny">Modo: ${DADO.modo}</span><a class="tp-ficha" href="${NV.APP_URL}" target="_blank" rel="noopener">Ficha <i class="ph-bold ph-arrow-square-out"></i></a></div>
    </div>`;
  }

  /* ---------- Ataques: armas e Hatsus da ficha ---------- */
  // Armas: mesma regra da seção de Ataques da ficha (sheet.js) — itens do inventário
  // que existem no ITEM_DB com dano, mais o Ataque Desarmado (1d6 com Artista Marcial/Monge).
  function armasDaFicha(d) {
    const db = typeof ITEM_DB !== 'undefined' ? ITEM_DB : null;
    const acha = nome => {
      if (!db) return null;
      const n = String(nome || '').toLowerCase();
      for (const cat in db.armas) { const f = db.armas[cat].find(i => i.nome.toLowerCase() === n || n.includes(i.nome.toLowerCase())); if (f) return f; }
      return null;
    };
    const armas = (d.inventory || []).map(it => {
      const x = acha(it.name);
      if (!x || !x.dano || x.dano === '-' || String(x.dano).startsWith('+')) return null;
      return { nome: it.name, dano: x.dano, tipo: x.tipo_dano || '' };
    }).filter(Boolean);
    const feat = typeof d.backgroundFeature === 'string' ? d.backgroundFeature : ((d.backgroundFeature || {}).nome || '');
    const marcial = ['Artista Marcial', 'Monge'].includes(String(feat).trim());
    return [{ nome: 'Ataque Desarmado' + (marcial ? ' (Marcial)' : ''), dano: marcial ? '1d6' : '1d4', tipo: 'Impacto' }, ...armas];
  }
  function ataquesHTML(d, r) {
    const armas = armasDaFicha(d), hatsus = d.hatsus || [];
    const atkStr = k => sinal(r.attrs[k].mod + r.pb);
    let h = `<div class="atks"><div class="atk-sec">Armas</div>` + armas.map((w, i) => `<div class="atk">
        <div class="atk-h"><b title="${esc(w.nome)}">${esc(w.nome)}</b><span class="dn">${esc(w.dano)}</span></div>
        ${w.tipo ? `<div class="atk-s">${esc(w.tipo)}</div>` : ''}
        <div class="atk-b"><button data-arma="${i}" data-arma-at="FOR" style="--c:${ATR_COR.FOR}">FOR ${atkStr('FOR')}</button><button data-arma="${i}" data-arma-at="DES" style="--c:${ATR_COR.DES}">DES ${atkStr('DES')}</button></div></div>`).join('');
    h += `<div class="atk-sec">Hatsus</div>`;
    h += hatsus.length ? hatsus.map((x, i) => {
      const m = x.mesaRolagem, nome = esc(x.nome || 'Hatsu ' + (i + 1));
      if (!m) return `<div class="atk off"><div class="atk-h"><b>${nome}</b></div><div class="atk-s">Abra este Hatsu uma vez na ficha do HxH5e para liberar a rolagem aqui.</div></div>`;
      if (!m.hasBaseDmg && !m.cd) return `<div class="atk off"><div class="atk-h"><b>${nome}</b></div><div class="atk-s">Sem dano nem CD para rolar.</div></div>`;
      const linha = [m.hasAttack ? `Ataque ${sinal((r.attrs[m.atkAttr] || { mod: 0 }).mod + prof(m.nivel) + (m.acertoBonus || 0))}${m.acertoVantagem ? ' (vantagem)' : ''}` : m.cd ? `CD ${m.cd} (TR de ${m.attr})` : '', m.aura ? `${m.aura} de Aura` : '', m.curaDice ? `Cura ${m.curaDice}` : ''].filter(Boolean).join(' · ');
      return `<div class="atk"><div class="atk-h"><b title="${nome}">${nome}</b>${m.hasBaseDmg ? `<span class="dn">${esc(m.dice || '')} + ${esc(m.attr)}</span>` : ''}</div>
        <div class="atk-s">${linha}${m.maximizado ? ' · dano maximizado' : m.critico ? ' · dano crítico' : ''}</div>
        <div class="atk-b"><button data-hatsu="${i}" style="--c:${(r.classe || {}).color || '#00ff9d'}"><i class="ph-bold ph-lightning"></i> Rolar</button></div></div>`;
    }).join('') : '<div class="atk-s">Nenhum Hatsu na ficha.</div>';
    return h + '</div>';
  }
  const prof = nivel => Math.max(2, Math.floor(((nivel || 0) - 1) / 4) + 2);
  // Dados de uma expressão "2d10", "1d8+2"… Maximizar entrega o valor máximo de cada dado
  // (Condição Hostil), igual ao maximizarExpr da ficha.
  function dadosExpr(expr, maximizar) {
    const det = []; let soma = 0;
    String(expr || '').replace(/\s+/g, '').split(/(?=[+-])/).forEach(t => {
      const s = t[0] === '-' ? -1 : 1, c = t.replace(/^[+-]/, ''), m = c.match(/^(\d*)d(\d+)$/);
      if (m) {
        const n = Math.max(1, +(m[1] || 1)), l = +m[2];
        const rr = Array.from({ length: Math.min(n, 60) }, () => maximizar ? l : 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * l));
        det.push({ d: l, s, r: rr }); soma += s * rr.reduce((a, b) => a + b, 0);
      } else if (/^\d+$/.test(c)) { det.push({ k: s * +c }); soma += s * +c; }
    });
    return { det, soma, dadosSoma: det.filter(x => x.d).reduce((a, x) => a + x.s * x.r.reduce((p, q) => p + q, 0), 0) };
  }
  async function rolarAtaque(mod, rotulo, nome, forcarVantagem) {
    const antes = DADO.modo;
    if (forcarVantagem && DADO.modo === 'Normal') DADO.modo = 'Vantagem';
    try { await rolarD20(mod, rotulo, nome); } finally { DADO.modo = antes; }
  }
  async function rolarDano(expr, mod, rotulo, nome, opts = {}) {
    const e = dadosExpr(expr, opts.maximizar);
    const extra = opts.extra || 0;
    // Vida ou Morte (crítico): dobra só os dados, não o atributo nem os fixos — igual à ficha.
    const total = (opts.critico ? e.dadosSoma * 2 + (e.soma - e.dadosSoma) : e.soma) + mod + extra;
    const det = e.det.slice(); if (mod + extra) det.push({ k: mod + extra });
    const formula = expr + (mod + extra ? sinal(mod + extra) : '') + (opts.maximizar ? ' · maximizado' : opts.critico ? ' · crítico (dados ×2)' : '');
    return gravarRolagem({ total, det, formula }, rotulo, nome);
  }
  async function rolarArma(t, w, at) {
    const r = NV.resumo(FICHAS[t.personagem_id] || {});
    await rolarAtaque(r.attrs[at].mod + r.pb, `Ataque · ${w.nome} (${at})`, t.nome);
    await rolarDano(w.dano, r.attrs[at].mod, `Dano · ${w.nome}${w.tipo ? ' · ' + w.tipo : ''}`, t.nome);
  }
  // Hatsu: usa o resumo gravado pela ficha (h.mesaRolagem, ver hatsu-detail.js).
  // REN não entra aqui: escalonar graus continua sendo feito na ficha.
  async function rolarHatsu(t, i) {
    const d = FICHAS[t.personagem_id] || {}, x = (d.hatsus || [])[i], m = x && x.mesaRolagem;
    if (!m) return;
    const r = NV.resumo(d), nome = x.nome || 'Hatsu';
    const modAt = k => (r.attrs[k] || { mod: 0 }).mod;
    if (m.hasAttack) await rolarAtaque(modAt(m.atkAttr) + prof(m.nivel) + (m.acertoBonus || 0), `Ataque · ${nome}`, t.nome, m.acertoVantagem);
    if (m.hasBaseDmg) {
      // Extras: dados ("+ 1d8") entram na mesma expressão; números fixos somam no fim.
      let expr = m.dice || '', fixo = 0;
      [...(m.dmgExtras || []), ...(m.sanExtras || [])].forEach(e => {
        const v = String(e.dado || '').trim();
        if (v === '(contínuo)') return;
        if (/^\+?\s*\d+d\d+$/.test(v)) expr += (expr ? '+' : '') + v.replace(/^\+?\s*/, '');
        else { const n = parseInt(v.replace(/\/\w+$/, '')); if (!isNaN(n)) fixo += n; }
      });
      await rolarDano(expr || '0', modAt(m.attr), `Dano · ${nome}${m.cd && !m.hasAttack ? ` · CD ${m.cd} (TR de ${m.attr})` : ''}`, t.nome, { maximizar: m.maximizado, critico: m.critico, extra: fixo });
    } else if (m.cd) {
      toast(esc(`${nome}: CD ${m.cd} (TR de ${m.attr})`), 'target');
    }
    if (m.curaDice) await rolarDano(m.curaDice, modAt(m.attr), `Cura · ${nome}`, t.nome, { maximizar: m.maximizado, critico: m.critico });
    // Custo de Aura sai do token (a ficha não muda, como o resto da mesa).
    if (m.aura && podeMover(t)) {
      const novo = Math.max(0, (t.aura || 0) - m.aura);
      Object.assign(t, { aura: novo }); atualizarToken(t); renderTokPanel();
      if (channel) channel.send({ type: 'broadcast', event: 'tok', payload: { id: t.id, aura: novo } });
      const { error } = await sb.from('tokens').update({ aura: novo }).eq('id', t.id);
      if (error) toast(errMsg(error), 'warning'); else toast(esc(`${nome}: −${m.aura} de Aura`), 'lightning');
    }
  }
  function renderTokPanel() {
    const old = $('#tokPanel'); if (old) old.remove();
    const t = S.sel && S.tokens[S.sel]; const st = $('.vp') && $('#stage');
    if (!t || !st) return;
    const pode = podeMover(t), vis = barrasVisiveis(t);
    const el = document.createElement('div'); el.className = 'tokpanel'; el.id = 'tokPanel';
    const res = (k, lbl, cor) => `<div class="res"><span style="color:${cor}">${lbl}</span>
      <div class="bar"><b style="width:${Math.max(0, Math.min(100, t[k + '_max'] ? t[k] / t[k + '_max'] * 100 : 0))}%;background:${cor}"></b></div>
      ${pode ? `<div class="ctl"><button data-k="${k}" data-d="-10">−10</button><button data-k="${k}" data-d="-5">−5</button><input data-k="${k}" value="${t[k]}" inputmode="numeric" aria-label="${lbl} atual"><button data-k="${k}" data-d="5">+5</button></div>` : `<b>${t[k]}/${t[k + '_max']}</b>`}</div>`;
    el.innerHTML = `<div class="h">${t.img_url ? `<img class="av" src="${esc(t.img_url)}" alt="">` : `<span class="av" style="background:${esc(t.cor)};color:#fff">${esc((t.nome || '?')[0])}</span>`}
      <div><b>${esc(t.nome)}</b><div class="tiny">${t.tipo === 'npc' ? 'NPC do narrador' : esc((S.perfis[t.owner] || {}).nome || 'Jogador')}</div></div>
      <button class="btn btn-icon btn-ghost x" id="tpX" aria-label="Fechar"><i class="ph-bold ph-x"></i></button></div>
      ${atributosHTML(t)}
      ${vis ? res('hp', 'PV', COR_PV) + res('aura', 'AURA', COR_AURA) + (pode ? `<div class="tiny" style="margin:-2px 0 8px">Máximo: ${t.hp_max} PV · ${t.aura_max} Aura${t.tipo === 'pj' ? ' · não altera a ficha' : ''}</div>` : '') : '<p class="hint">As barras deste token estão escondidas.</p>'}
      ${pode ? `<label class="chk"><input type="checkbox" id="tpPub" ${t.barras_publicas ? 'checked' : ''}> Barras visíveis para todos</label>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        ${S.gm ? `<select class="input" id="tpSz" style="height:34px;width:auto;font-size:13px;padding:0 30px 0 10px">${[1, 2, 3, 4].map(n => `<option value="${n}" ${t.tamanho === n ? 'selected' : ''}>${n}×${n}</option>`).join('')}</select>` : ''}
        <button class="btn btn-sm" id="tpAv"><i class="ph ph-image"></i> Avatar</button>
        ${t.owner === NV.user.id && (NV.perfil() || {}).avatar ? '<button class="btn btn-sm btn-ghost" id="tpG" title="Usar a foto da sua conta (Discord ou Google)">Usar minha foto</button>' : ''}
        <button class="btn btn-sm btn-ghost" id="tpDel" style="margin-left:auto;color:var(--red-6)">Remover</button></div>` : ''}`;
    st.appendChild(el);
    $('#tpX').onclick = () => { S.sel = null; renderTokens(); };
    $$('#tokPanel [data-tpaba]').forEach(b => b.onclick = () => {
      S.tpAba = b.dataset.tpaba; renderTokPanel();
      // Busca a ficha de novo: o jogador pode ter aberto um Hatsu na ficha agora há pouco.
      if (S.tpAba === 'atk' && t.personagem_id) NV.obter(t.personagem_id).then(f => {
        if (!f) return;
        FICHAS[t.personagem_id] = f.dados;
        const p = S.meus.find(x => x.id === t.personagem_id); if (p) p.dados = f.dados;
        if (S.sel === t.id && S.tpAba === 'atk') renderTokPanel();
      }).catch(() => {});
    });
    $$('#tokPanel [data-arma]').forEach(b => b.onclick = () => { const w = armasDaFicha(FICHAS[t.personagem_id] || {})[+b.dataset.arma]; if (w) rolarArma(t, w, b.dataset.armaAt); });
    $$('#tokPanel [data-hatsu]').forEach(b => b.onclick = () => rolarHatsu(t, +b.dataset.hatsu));
    $$('#tokPanel [data-rola]').forEach(b => b.onclick = () => { const r = NV.resumo(FICHAS[t.personagem_id] || {}); rolarD20(r.attrs[b.dataset.rola].mod, `Teste de ${b.dataset.rola}`, t.nome); });
    const salvar = async patch => { Object.assign(t, patch); atualizarToken(t); renderTokPanel(); if (channel) channel.send({ type: 'broadcast', event: 'tok', payload: Object.assign({ id: t.id }, patch) }); const { error } = await sb.from('tokens').update(patch).eq('id', t.id); if (error) toast(errMsg(error), 'warning'); };
    $$('#tokPanel .ctl button').forEach(b => b.onclick = () => { const k = b.dataset.k; salvar({ [k]: Math.max(0, Math.min(t[k + '_max'], t[k] + +b.dataset.d)) }); });
    $$('#tokPanel .ctl input').forEach(i => i.onchange = () => { const k = i.dataset.k; const v = parseInt(i.value, 10); if (!isNaN(v)) salvar({ [k]: Math.max(0, Math.min(t[k + '_max'], v)) }); });
    const pub = $('#tpPub'); if (pub) pub.onchange = () => salvar({ barras_publicas: pub.checked });
    const sz = $('#tpSz'); if (sz) sz.onchange = () => salvar({ tamanho: +sz.value });
    // Só o token muda: a foto da ficha no HxH5e continua a mesma.
    const trocaAvatar = async url => {
      await salvar({ img_url: url });
      toast('Avatar atualizado', 'image');
    };
    const av = $('#tpAv'); if (av) av.onclick = async () => { const f = await pickFile(); if (!f) return; toast('Enviando avatar…', 'hourglass'); try { await trocaAvatar(await NV.enviarToken(f)); } catch (err) { toast(errMsg(err), 'warning'); } };
    const gg = $('#tpG'); if (gg) gg.onclick = () => trocaAvatar(NV.perfil().avatar);
    const del = $('#tpDel'); if (del) del.onclick = async () => { if (!confirm(`Remover ${t.nome} do mapa?`)) return; const { error } = await sb.from('tokens').delete().eq('id', t.id); if (error) return toast(errMsg(error), 'warning'); delete S.tokens[t.id]; S.sel = null; renderTokens(); };
  }

  /* ---------- Painel lateral ---------- */
  function abas() {
    const dados = ['dados', '<i class="ph ph-dice-five"></i> Dados'];
    const chat = ['chat', `<i class="ph ph-chat-circle-dots"></i> Chat${S.naoLidas ? `<span class="badge">${S.naoLidas > 99 ? '99+' : S.naoLidas}</span>` : ''}`];
    return S.gm ? [['cenas', 'Cenas'], ['mapa', 'Mapa'], ['tokens', 'Tokens'], dados, chat, ['ninja', 'Personagem'], ['grupo', 'Grupo']]
      : [dados, chat, ['ninja', 'Meu personagem'], ['tokens', 'Tokens'], ['grupo', 'Grupo']];
  }
  function renderTabs() {
    $('#tabs').innerHTML = abas().map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('');
    $$('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderSide(); });
  }
  function renderSide() {
    if (!abas().some(t => t[0] === S.tab)) S.tab = abas()[0][0];
    if (S.tab === 'chat') S.naoLidas = 0;
    renderTabs();
    P().classList.toggle('pane-chat', S.tab === 'chat');
    ({ cenas: paneCenas, mapa: paneMapa, tokens: paneTokens, dados: paneDados, chat: paneChat, ninja: paneNinja, grupo: paneGrupo })[S.tab]();
  }
  const P = () => $('#pane');

  async function exibir(tipo, cenaId) {
    const patch = { exibindo: tipo }; if (cenaId !== undefined) patch.cena_id = cenaId;
    const { error } = await sb.from('mesas').update(patch).eq('id', S.mesa.id);
    if (error) return toast(errMsg(error), 'warning');
    Object.assign(S.mesa, patch); S.view = null; renderBar(); renderStage(); renderSide();
    toast(tipo === 'nada' ? 'Nada ao vivo' : 'Ao vivo para os jogadores', tipo === 'nada' ? 'pause' : 'broadcast');
  }

  function paneCenas() {
    P().innerHTML = `<h4>Nova cena</h4>
      <div class="field"><input class="input" id="cnT" maxlength="80" placeholder="Título (ex.: A ponte de Tazuna)"></div>
      <label class="upl" id="cnUp"><span id="cnPrev"><i class="ph ph-image"></i></span><span id="cnLbl">Escolher imagem</span></label>
      <div class="field" style="margin-top:12px"><textarea class="input" id="cnN" placeholder="Anotações do narrador (só você vê)"></textarea></div>
      <button class="btn btn-primary" id="cnAdd" style="width:100%">Adicionar cena</button>
      <div class="sep"></div>
      <h4>Cenas da mesa</h4>
      <div class="stack" id="cnList"></div>
      ${S.mesa.exibindo !== 'nada' ? `<button class="btn btn-sm" id="stopLive" style="margin-top:14px;width:100%"><i class="ph ph-pause"></i> Parar de exibir</button>` : ''}`;
    let img = null;
    $('#cnUp').onclick = async e => { e.preventDefault(); const f = await pickFile(); if (!f) return; $('#cnLbl').textContent = 'Enviando…'; try { img = await NV.enviarImagem(f); $('#cnPrev').innerHTML = `<img src="${esc(img)}" alt="">`; $('#cnLbl').textContent = 'Imagem pronta · trocar'; } catch (err) { toast(errMsg(err), 'warning'); $('#cnLbl').textContent = 'Escolher imagem'; } };
    $('#cnAdd').onclick = async () => {
      const titulo = $('#cnT').value.trim(), notas = $('#cnN').value.trim();
      if (!titulo && !img) return toast('Dê um título ou escolha uma imagem', 'pencil-simple');
      const { data, error } = await sb.from('cenas').insert({ mesa_id: S.mesa.id, titulo, notas, imagem_url: img }).select('*').single();
      if (error) return toast(errMsg(error), 'warning');
      if (!S.cenas.some(c => c.id === data.id)) S.cenas.push(data);
      paneCenas(); toast('Cena criada', 'film-slate');
    };
    const st = $('#stopLive'); if (st) st.onclick = () => exibir('nada');
    $('#cnList').innerHTML = S.cenas.length ? S.cenas.slice().reverse().map(c => {
      const ao = S.mesa.exibindo === 'cena' && S.mesa.cena_id === c.id;
      return `<div class="item ${ao ? 'on' : ''}">${c.imagem_url ? `<div class="thumb" style="background-image:url('${esc(c.imagem_url)}')"></div>` : ''}
        <b>${esc(c.titulo || 'Sem título')}</b>${ao ? ' <span class="live" style="margin-left:6px">Ao vivo</span>' : ''}
        <textarea class="input" data-notas="${c.id}" style="margin-top:8px;min-height:60px" placeholder="Anotações (só você vê)">${esc(c.notas)}</textarea>
        <div class="row"><button class="btn btn-sm btn-orange" data-show="${c.id}"><i class="ph ph-broadcast"></i> Exibir para os jogadores</button><button class="btn btn-sm btn-ghost" data-prev="${c.id}">Prévia</button><button class="btn btn-sm btn-ghost" data-del="${c.id}" style="color:var(--red-6)">Apagar</button></div></div>`;
    }).join('') : '<p class="hint">Nenhuma cena ainda.</p>';
    $$('[data-show]').forEach(b => b.onclick = () => exibir('cena', b.dataset.show));
    $$('[data-prev]').forEach(b => b.onclick = () => { S.view = 'cena'; S.previewCena = b.dataset.prev; renderStage(); });
    $$('[data-notas]').forEach(t => t.onchange = async () => { const { error } = await sb.from('cenas').update({ notas: t.value }).eq('id', t.dataset.notas); if (error) toast(errMsg(error), 'warning'); else { const c = S.cenas.find(x => x.id === t.dataset.notas); if (c) c.notas = t.value; toast('Anotação salva', 'note-pencil'); } });
    $$('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Apagar esta cena?')) return; const { error } = await sb.from('cenas').delete().eq('id', b.dataset.del); if (error) return toast(errMsg(error), 'warning'); S.cenas = S.cenas.filter(c => c.id !== b.dataset.del); paneCenas(); });
  }

  /* ---------- Mapa: painel lateral + pop-up de criação ---------- */
  const IMG = { aberto: false };
  function paneMapa() {
    const m = S.mapaPreview || S.mapa || null;
    const gen = m && m.config && m.config.gen;
    const tipo = gen && MapGen.TIPOS.find(t => t.id === MapGen.normaliza(gen).tipo);
    const ops = [10, 15, 20, 25, 30, 35, 40, 50, 60, 80, 100];
    P().innerHTML = `<h4>Battlemap</h4>
      <p class="hint" style="margin:0 0 12px">Cada quadrado tem 1,5 m. Um mapa por vez: salvar um novo substitui o atual (os tokens continuam).</p>
      <div class="item" style="display:flex;align-items:center;gap:10px">
        <span class="av" style="width:40px;height:40px;border-radius:12px"><i class="ph ph-${tipo ? tipo.ico : m && m.fundo_url ? 'image' : 'map-trifold'}" style="font-size:20px"></i></span>
        <div style="flex:1;min-width:0"><b>${tipo ? esc(tipo.nome) : m && m.fundo_url ? 'Imagem própria' : 'Sem mapa ainda'}</b><div class="tiny">${m ? `${m.cols} × ${m.rows} quadrados` : 'Crie um mapa ou envie uma imagem'}</div></div>
      </div>
      <button class="btn btn-primary" id="mpCriar" style="width:100%;margin-top:12px"><i class="ph ph-sparkle"></i> ${gen ? 'Editar ou criar mapa' : 'Criar mapa'}</button>
      <button class="btn btn-ghost btn-sm" id="mpImgT" style="width:100%;margin-top:8px"><i class="ph ph-image"></i> Usar uma imagem minha</button>
      <div id="mpImg" ${IMG.aberto ? '' : 'hidden'}>
        <div class="sel2" style="margin-top:10px"><div class="field"><label class="tiny">Colunas</label><select class="input" id="mpC">${ops.map(n => `<option ${(m ? m.cols : 30) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="field"><label class="tiny">Linhas</label><select class="input" id="mpR">${ops.map(n => `<option ${(m ? m.rows : 30) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
        <label class="upl" id="mpUp"><span id="mpPrev"><i class="ph ph-map-trifold"></i></span><span id="mpLbl">Escolher imagem do mapa</span></label>
        <p class="hint">A imagem estica para cobrir o grid inteiro. Ajuste colunas e linhas para bater com o desenho.</p>
      </div>
      <div class="sep"></div>
      <button class="btn btn-orange" id="mpLive" style="width:100%" ${m ? '' : 'disabled'}><i class="ph ph-broadcast"></i> Exibir battlemap para os jogadores</button>
      ${S.mesa.exibindo !== 'nada' ? `<button class="btn btn-sm" id="stopLive" style="margin-top:10px;width:100%"><i class="ph ph-pause"></i> Parar de exibir</button>` : ''}`;
    $('#mpCriar').onclick = () => abrirCriador(gen ? Object.assign({ cols: m.cols, rows: m.rows }, gen) : null);
    $('#mpImgT').onclick = () => { IMG.aberto = !IMG.aberto; paneMapa(); };
    const up = $('#mpUp');
    if (up) up.onclick = async e => {
      e.preventDefault(); const f = await pickFile(); if (!f) return; $('#mpLbl').textContent = 'Enviando…';
      try { const url = await NV.enviarImagem(f, 4096); await salvarMapa({ cols: +$('#mpC').value, rows: +$('#mpR').value, fundo_url: url, config: {} }); IMG.aberto = false; toast('Mapa salvo', 'map-trifold'); paneMapa(); } catch (err) { toast(errMsg(err), 'warning'); $('#mpLbl').textContent = 'Escolher imagem do mapa'; }
    };
    $('#mpLive').onclick = () => exibir('mapa');
    const st = $('#stopLive'); if (st) st.onclick = () => exibir('nada');
  }
  async function salvarMapa(row) {
    const { data, error } = await sb.from('mapas').upsert(Object.assign({ mesa_id: S.mesa.id }, row)).select('*').single();
    if (error) { toast(errMsg(error), 'warning'); return false; }
    S.mapa = data; S.mapaPreview = null; S.view = 'mapa';
    renderStage(); setTimeout(() => vp && centralizar(), 50);
    return true;
  }

  // Pop-up: 1) urbano/natureza 2) tipo 3) planta (quando houver) 4) quanto de cada elemento 5) tamanho
  const TAMANHOS = [10, 15, 20, 25, 30, 35, 40, 50, 60];
  function abrirCriador(base) {
    const E = Object.assign({ tipo: 'floresta', cols: 30, rows: 20, seed: MapGen.novaSemente() }, base || {});
    const nz = MapGen.normaliza(E);
    E.tipo = nz.tipo; E.mix = nz.mix; E.layout = nz.layout;
    E.grupo = (MapGen.TIPOS.find(t => t.id === E.tipo) || {}).grupo || 'Natureza';
    const ov = document.createElement('div'); ov.className = 'mm-ov'; ov.id = 'mapModal';
    ov.innerHTML = `<div class="mm" role="dialog" aria-modal="true" aria-labelledby="mmT">
      <header class="mm-h"><div><div class="tiny" style="font-weight:800;letter-spacing:.12em;color:var(--orange-7)">NOVO BATTLEMAP</div><h3 id="mmT">Criar mapa</h3></div><button class="btn btn-icon btn-ghost" id="mmX" aria-label="Fechar"><i class="ph-bold ph-x"></i></button></header>
      <div class="mm-b"><div class="mm-l" id="mmL"></div><div class="mm-r"><div class="mm-prev" id="mmPrev"></div><div class="mm-leg" id="mmLeg"></div>
        <div class="mm-acts"><button class="btn btn-sm" id="mmSeed"><i class="ph ph-dice-five"></i> Outra variação</button><span class="tiny" id="mmTam"></span></div></div></div>
      <footer class="mm-f"><button class="btn btn-ghost" id="mmCanc">Cancelar</button><span style="flex:1"></span><button class="btn" id="mmSalvar">Salvar mapa</button><button class="btn btn-orange" id="mmVivo"><i class="ph ph-broadcast"></i> Salvar e exibir</button></footer>
    </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('on'));
    const fechar = () => { ov.classList.remove('on'); setTimeout(() => ov.remove(), 200); removeEventListener('keydown', esc_); removeEventListener('resize', ajusta); };
    const esc_ = e => { if (e.key === 'Escape') fechar(); };
    addEventListener('keydown', esc_);
    ov.addEventListener('mousedown', e => { if (e.target === ov) fechar(); });
    $('#mmX', ov).onclick = $('#mmCanc', ov).onclick = fechar;

    const tipoInfo = () => MapGen.TIPOS.find(t => t.id === E.tipo);
    const plantas = () => Blocos.PLANTAS.filter(p => p.grupo === E.tipo);
    const trocaTipo = id => {
      E.tipo = id; E.mix = Object.assign({}, MapGen.PADRAO[id]);
      if (tipoInfo().planta) { E.layout = plantas()[0].id; Object.assign(E, MapGen.tamanhoPlanta(E.layout)); } else E.layout = null;
      E.seed = MapGen.novaSemente();
    };
    const slider = (k, v) => {
      const el = MapGen.ELEMENTOS[k];
      return `<div class="sl"><div class="sl-l"><b>${el.nome}</b><small>${el.desc}</small></div>
        <div class="sl-t"><div class="sl-n">${[0, 20, 40, 60, 80, 100].map(n => `<span>${n}</span>`).join('')}</div>
        <input type="range" min="0" max="100" step="20" value="${v}" data-k="${k}" aria-label="${el.nome}" style="--p:${v}%"></div></div>`;
    };
    function esquerda() {
      const t = tipoInfo(), vert = MapGen.VERTICAL[E.tipo] || [];
      const chaves = Object.keys(MapGen.PADRAO[E.tipo]).filter(k => !vert.includes(k));
      let h = `<div class="mm-step"><span>1</span>Ambiente</div>
        <div class="modesw">${['Urbano', 'Natureza'].map(g => `<button data-g="${g}" class="${E.grupo === g ? 'on' : ''}"><i class="ph ph-${g === 'Urbano' ? 'buildings' : 'tree-evergreen'}"></i> ${g}</button>`).join('')}</div>
        <div class="mm-step"><span>2</span>Tipo de mapa</div>
        <div class="mm-chips">${MapGen.TIPOS.filter(x => x.grupo === E.grupo).map(x => `<button data-t="${x.id}" class="${E.tipo === x.id ? 'on' : ''}" title="${esc(x.desc)}"><i class="ph ph-${x.ico}"></i>${x.nome}</button>`).join('')}</div>
        <p class="hint" style="margin-top:6px">${esc(t.desc)}</p>`;
      let n = 3;
      if (t.planta) {
        h += `<div class="mm-step"><span>${n++}</span>Planta</div><div class="mm-plantas">${plantas().map(p => `<button data-l="${p.id}" class="${E.layout === p.id ? 'on' : ''}"><div class="mini">${MapGen.miniPlanta(p.id)}</div><b>${esc(p.nome)}</b><small>${p.porte} · ${p.w * 1.5} × ${p.h * 1.5} m</small></button>`).join('')}</div>`;
      }
      if (vert.length) {
        h += `<div class="mm-step"><span>${n++}</span>O que tem na água</div><div class="mm-vert">${vert.map(k => { const on = E.mix[k] > 0, el = MapGen.ELEMENTOS[k]; return `<div class="vt ${on ? 'on' : ''}"><label class="chk"><input type="checkbox" data-v="${k}" ${on ? 'checked' : ''}><span><b>${el.nome}</b><small>${el.desc}</small></span></label>${on ? slider(k, E.mix[k]) : ''}</div>`; }).join('')}</div>`;
      }
      h += `<div class="mm-step"><span>${n++}</span>Quanto de cada elemento</div><p class="hint" style="margin:-4px 0 10px">0% tira o elemento do mapa.</p>${chaves.map(k => slider(k, E.mix[k])).join('')}`;
      h += `<div class="mm-step"><span>${n++}</span>Tamanho</div>${t.planta ? `<p class="hint">Ajustado à planta: ${E.cols} × ${E.rows} quadrados (casa + jardim em volta).</p>` : `<div class="sel2"><div class="field"><label class="tiny">Colunas</label><select class="input" id="mmC">${TAMANHOS.map(v => `<option ${E.cols === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div class="field"><label class="tiny">Linhas</label><select class="input" id="mmR">${TAMANHOS.map(v => `<option ${E.rows === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>`}`;
      $('#mmL', ov).innerHTML = h;
      $$('[data-g]', ov).forEach(b => b.onclick = () => { if (E.grupo === b.dataset.g) return; E.grupo = b.dataset.g; trocaTipo(MapGen.TIPOS.find(x => x.grupo === E.grupo).id); esquerda(); previa(); });
      $$('[data-t]', ov).forEach(b => b.onclick = () => { trocaTipo(b.dataset.t); esquerda(); previa(); });
      $$('[data-l]', ov).forEach(b => b.onclick = () => { E.layout = b.dataset.l; Object.assign(E, MapGen.tamanhoPlanta(E.layout)); $$('[data-l]', ov).forEach(x => x.classList.toggle('on', x === b)); esquerda(); previa(); });
      $$('#mmL input[type=range]', ov).forEach(i => i.oninput = () => { i.style.setProperty('--p', i.value + '%'); E.mix[i.dataset.k] = +i.value; previaDepois(); });
      $$('[data-v]', ov).forEach(c => c.onchange = () => { E.mix[c.dataset.v] = c.checked ? 40 : 0; esquerda(); previa(); });
      const mc = $('#mmC', ov), mr = $('#mmR', ov);
      if (mc) mc.onchange = () => { E.cols = +mc.value; previa(); };
      if (mr) mr.onchange = () => { E.rows = +mr.value; previa(); };
    }
    let tPrev = null;
    const previaDepois = () => { clearTimeout(tPrev); tPrev = setTimeout(previa, 110); };
    function ajusta() {
      const box = $('#mmPrev', ov); if (!box) return;
      const w = box.clientWidth, k = w / (E.cols * CELL), inner = box.firstElementChild;
      box.style.height = Math.min(E.rows * CELL * k, innerHeight * .62) + 'px';
      if (inner) { const kk = Math.min(k, box.clientHeight / (E.rows * CELL)); inner.style.transform = `translate(${(w - E.cols * CELL * kk) / 2}px, 0) scale(${kk})`; }
    }
    function previa() {
      const gen = { tipo: E.tipo, seed: E.seed, mix: E.mix, layout: E.layout };
      const svg = MapGen.svg(gen, E.cols, E.rows);
      $('#mmPrev', ov).innerHTML = `<div class="mm-cv" style="width:${E.cols * CELL}px;height:${E.rows * CELL}px;background:${MapGen.fundo(E.tipo)}">${svg}<div class="mm-grid"></div></div>`;
      $('#mmLeg', ov).innerHTML = MapGen.legenda(E.tipo).map(l => `<span><i style="--c:${l.cor};${l.fundo ? `background:${l.fundo}` : ''}"></i>${l.nome}</span>`).join('');
      $('#mmTam', ov).textContent = `${E.cols} × ${E.rows} quadrados · ${f1m(E.cols * 1.5)} × ${f1m(E.rows * 1.5)} m`;
      ajusta();
    }
    const f1m = v => v.toLocaleString('pt-BR');
    addEventListener('resize', ajusta);
    $('#mmSeed', ov).onclick = () => { E.seed = MapGen.novaSemente(); previa(); };
    const salvar = async vivo => {
      if (S.mapa && !confirm('Substituir o battlemap atual?')) return;
      const ok = await salvarMapa({ cols: E.cols, rows: E.rows, fundo_url: null, config: { gen: { tipo: E.tipo, seed: E.seed, mix: E.mix, layout: E.layout } } });
      if (!ok) return;
      fechar(); paneMapa();
      if (vivo) exibir('mapa'); else toast('Battlemap salvo', 'map-trifold');
    };
    $('#mmSalvar', ov).onclick = () => salvar(false);
    $('#mmVivo', ov).onclick = () => salvar(true);
    esquerda(); previa();
  }

  function centroLivre() {
    const m = S.mapa || { cols: 30, rows: 30 };
    const ocup = new Set(Object.values(S.tokens).map(t => `${Math.round(t.x)},${Math.round(t.y)}`));
    const cx = Math.floor(m.cols / 2), cy = Math.floor(m.rows / 2);
    for (let r = 0; r < 12; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const k = `${cx + dx},${cy + dy}`; if (!ocup.has(k)) return { x: cx + dx, y: cy + dy }; }
    return { x: cx, y: cy };
  }

  function paneTokens() {
    const lista = Object.values(S.tokens);
    P().innerHTML = (S.gm ? `<h4>Novo inimigo ou NPC</h4>
      <div class="field"><input class="input" id="npN" maxlength="40" placeholder="Nome (ex.: Formiga Quimera)"></div>
      <div class="sel2"><div class="field"><label class="tiny">PV</label><input class="input" id="npH" type="number" min="1" step="1" value="30"></div>
      <div class="field"><label class="tiny">Aura</label><input class="input" id="npC" type="number" min="0" step="10" value="100"></div></div>
      <div class="sel2"><div class="field"><label class="tiny">Cor</label><input class="input" id="npK" type="color" value="#ff0055" style="padding:4px"></div>
      <div class="field"><label class="tiny">Tamanho</label><select class="input" id="npS"><option value="1">1×1 (pessoa)</option><option value="2">2×2 (grande)</option><option value="3">3×3 (enorme)</option><option value="4">4×4 (gigante)</option></select></div></div>
      <label class="upl" id="npUp"><span id="npPrev"><i class="ph ph-user"></i></span><span id="npLbl">Imagem do token (opcional)</span></label>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="npPub"> Barras visíveis para os jogadores</label>
      <button class="btn btn-primary" id="npAdd" style="width:100%;margin-top:12px">Colocar no mapa</button>
      <div class="sep"></div>` : '') + `<h4>Tokens no mapa</h4><div class="stack">${lista.length ? lista.map(t => `<div class="item" style="display:flex;align-items:center;gap:10px;cursor:pointer" data-sel="${t.id}">
        ${t.img_url ? `<img class="av" src="${esc(t.img_url)}" alt="">` : `<span class="av" style="background:${esc(t.cor)};color:#fff">${esc((t.nome || '?')[0])}</span>`}
        <div style="flex:1;min-width:0"><b>${esc(t.nome)}</b><div class="tiny">${t.tipo === 'npc' ? 'NPC' : 'Jogador'}${barrasVisiveis(t) ? ` · ${t.hp}/${t.hp_max} PV · ${t.aura}/${t.aura_max} Aura` : ''}</div></div></div>`).join('') : '<p class="hint">Nenhum token ainda.</p>'}</div>`;
    let img = null;
    const up = $('#npUp');
    if (up) up.onclick = async e => { e.preventDefault(); const f = await pickFile(); if (!f) return; $('#npLbl').textContent = 'Enviando…'; try { img = await NV.enviarToken(f); $('#npPrev').innerHTML = `<img src="${esc(img)}" alt="" style="width:36px;height:36px;border-radius:50%">`; $('#npLbl').textContent = 'Imagem pronta'; } catch (err) { toast(errMsg(err), 'warning'); } };
    const add = $('#npAdd');
    if (add) add.onclick = async () => {
      // PV do 5e não anda de 5 em 5 como o HP do Shinobi: valor exato.
      const hp = Math.max(1, Math.round(+$('#npH').value || 30)), aura = Math.max(0, Math.round(+$('#npC').value || 0));
      const pos = centroLivre();
      const row = { mesa_id: S.mesa.id, tipo: 'npc', owner: NV.user.id, nome: $('#npN').value.trim() || 'Inimigo', img_url: img, cor: $('#npK').value, tamanho: +$('#npS').value, hp, hp_max: hp, aura, aura_max: aura, barras_publicas: $('#npPub').checked, x: pos.x, y: pos.y };
      const { data, error } = await sb.from('tokens').insert(row).select('*').single();
      if (error) return toast(errMsg(error), 'warning');
      S.tokens[data.id] = data; S.sel = data.id; if (vistaAtual() === 'mapa') renderTokens(); paneTokens(); toast(`${data.nome} entrou no mapa`, 'sword');
    };
    $$('[data-sel]').forEach(el => el.onclick = () => { S.sel = el.dataset.sel; if (S.gm && vistaAtual() !== 'mapa') { S.view = 'mapa'; renderStage(); } else renderTokens(); });
  }

  /* ---------- Dados (estilo Roll20) ---------- */
  const DADO = { qtd: 1, mod: 0, secreta: false, modo: 'Normal' };
  const d20 = () => 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * 20);
  // Mesmos modos do getRollResult da ficha: Vantagem/Desvantagem ficam com o maior/menor;
  // Ênfase fica com o dado mais longe de 10,5 (o resultado mais extremo).
  function d20Modo(modo) {
    const a = d20();
    if (modo === 'Normal') return { v: a, x: [] };
    const b = d20();
    const fica = modo === 'Vantagem' ? Math.max(a, b) : modo === 'Desvantagem' ? Math.min(a, b) : (Math.abs(a - 10.5) > Math.abs(b - 10.5) ? a : b);
    return { v: fica, x: [fica === a ? b : a] };
  }
  function parseRolagem(txt) {
    const f = String(txt || '').toLowerCase().replace(/\s+/g, '').replace(/^\+/, '');
    if (!f || !/^[0-9d+\-]+$/.test(f)) throw new Error('Use o formato 1d20+4, 2d6, 3d6-1…');
    const termos = f.match(/[+\-]?[^+\-]+/g);
    let total = 0, nd = 0; const det = [];
    termos.forEach(t => {
      const sinal = t[0] === '-' ? -1 : 1, corpo = t.replace(/^[+\-]/, '');
      const m = corpo.match(/^(\d*)d(\d+)$/);
      if (m) {
        const n = Math.max(1, +(m[1] || 1)), lados = +m[2];
        if (lados < 2 || lados > 1000) throw new Error('Dado de 2 a 1000 lados');
        nd += n; if (nd > 60) throw new Error('No máximo 60 dados por rolagem');
        const r = Array.from({ length: n }, () => 1 + Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * lados));
        const soma = r.reduce((a, b) => a + b, 0) * sinal; total += soma; det.push({ d: lados, s: sinal, r });
      } else if (/^\d+$/.test(corpo)) { total += sinal * +corpo; det.push({ k: sinal * +corpo }); }
      else throw new Error('Não entendi "' + t + '"');
    });
    if (!nd) throw new Error('Inclua pelo menos um dado, ex.: 1d20');
    return { total, det, formula: f };
  }
  function meuNome() {
    const tok = Object.values(S.tokens).find(t => t.tipo === 'pj' && t.owner === NV.user.id);
    return tok ? tok.nome : ((NV.perfil() || {}).nome || 'Hunter').split(' ')[0];
  }
  async function gravarRolagem(r, rotulo, nome) {
    const row = { mesa_id: S.mesa.id, user_id: NV.user.id, nome: nome || meuNome(), rotulo: rotulo || '', formula: r.formula, total: r.total, detalhe: r.det, secreta: DADO.secreta };
    const { data, error } = await sb.from('rolagens').insert(row).select('*').single();
    if (error) return toast(errMsg(error), 'warning');
    if (!S.rolagens.some(x => x.id === data.id)) { S.rolagens.unshift(data); mostrarRolagem(data); }
    if (S.tab === 'dados') paneDados(); else if (S.tab === 'chat') renderChatList(true);
  }
  async function rolar(formula, rotulo, nome) {
    let r; try { r = parseRolagem(formula); } catch (e) { return toast(e.message, 'dice-five'); }
    return gravarRolagem(r, rotulo, nome);
  }
  // Teste de d20 + modificador respeitando o modo escolhido na aba Dados.
  // O dado descartado vai em "x" e aparece riscado no histórico.
  function rolarD20(mod, rotulo, nome) {
    const m = DADO.modo, d = d20Modo(m);
    const det = [{ d: 20, s: 1, r: [d.v], x: d.x }];
    if (mod) det.push({ k: mod });
    const formula = (m === 'Normal' ? '1d20' : '2d20') + (mod ? sinal(mod) : '') + (m === 'Normal' ? '' : ' · ' + m.toLowerCase());
    return gravarRolagem({ total: d.v + mod, det, formula }, rotulo, nome);
  }
  function critico(r) {
    const d20 = (r.detalhe || []).filter(x => x.d === 20);
    if (d20.length !== 1 || d20[0].r.length !== 1) return '';
    return d20[0].r[0] === 20 ? 'crit' : d20[0].r[0] === 1 ? 'fail' : '';
  }
  function detalheHTML(r) {
    return (r.detalhe || []).map((x, i) => x.k != null ? `<span class="dk">${x.k > 0 && i ? '+' : ''}${x.k}</span>` : `${i || x.s < 0 ? `<span class="dk">${x.s < 0 ? '−' : '+'}</span>` : ''}<span class="dg">${x.r.map(v => `<i class="${x.d === 20 && v === 20 ? 'max' : x.d === 20 && v === 1 ? 'min' : v === x.d ? 'max' : ''}">${v}</i>`).join('')}${(x.x || []).map(v => `<i class="x" title="Descartado">${v}</i>`).join('')}</span>`).join('');
  }
  function rolagemHTML(r) {
    const c = critico(r), quem = S.perfis[r.user_id] || {};
    return `<div class="roll ${c}"><div class="roll-h">${avatar(quem)}<div style="min-width:0;flex:1"><b>${esc(r.nome)}</b>${r.rotulo ? ` <span class="tiny">· ${esc(r.rotulo)}</span>` : ''}<div class="tiny">${esc(r.formula)}${r.secreta ? ' · <i class="ph ph-lock"></i> secreta' : ''}</div></div><span class="roll-t">${r.total}</span></div>
      <div class="roll-d">${detalheHTML(r)}${c === 'crit' ? '<span class="tag" style="margin-left:auto;color:#2f7a33">20 natural!</span>' : c === 'fail' ? '<span class="tag" style="margin-left:auto;color:var(--red-6)">1 natural</span>' : ''}</div></div>`;
  }
  function paneDados() {

    P().innerHTML = `<div class="dice">

      ${rs ? `<div class="sep"></div><h4>Testes de ${esc(p.nome)}</h4><div class="quick">
        ${Object.keys(ATR_COR).map(k => `<button class="btn btn-sm" data-at="${k}" title="${k} ${rs.attrs[k].valor}">${k} ${sinal(rs.attrs[k].mod)}</button>`).join('')}

        <div class="tiny" style="margin:10px 0 6px">Resistência (TR)</div><div class="quick">
        ${Object.keys(ATR_COR).map(k => `<button class="btn btn-sm ${rs.attrs[k].tr ? '' : 'btn-ghost'}" data-tr="${k}" title="${rs.attrs[k].tr ? 'Proficiente' : 'Sem proficiência'}">TR ${k} ${sinal(rs.attrs[k].save)}</button>`).join('')}</div>
        <p class="hint">Valores base da ficha (sem bônus de Hatsu ou princípios).</p>` : ''}

      <div style="display:flex;align-items:center;justify-content:space-between"><h4 style="margin:0">Histórico da mesa</h4>${S.gm && S.rolagens.length ? '<button class="btn btn-sm btn-ghost" id="dclr">Limpar</button>' : ''}</div>
      <div class="rolls">${S.rolagens.length ? S.rolagens.map(rolagemHTML).join('') : '<p class="hint">Ninguém rolou ainda. Que tal um d20?</p>'}</div>`;
    const fm = d => `${DADO.qtd}d${d}${DADO.mod ? (DADO.mod > 0 ? '+' : '') + DADO.mod : ''}`;
    $$('.die').forEach(b => b.onclick = () => { b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); rolar(fm(b.dataset.d)); });
    $$('[data-q]').forEach(b => b.onclick = () => { DADO.qtd = Math.max(1, Math.min(20, DADO.qtd + +b.dataset.q)); paneDados(); });
    $$('[data-m]').forEach(b => b.onclick = () => { DADO.mod = Math.max(-20, Math.min(30, DADO.mod + +b.dataset.m)); paneDados(); });
    $('#dgo').onclick = () => rolar($('#dfx').value);
    $('#dfx').onkeydown = e => { if (e.key === 'Enter') rolar(e.target.value); };
    $('#dsec').onchange = e => { DADO.secreta = e.target.checked; };
    $$('[data-modo]').forEach(b => b.onclick = () => { DADO.modo = b.dataset.modo; paneDados(); });
    $$('[data-at]').forEach(b => b.onclick = () => rolarD20(rs.attrs[b.dataset.at].mod, `Teste de ${b.dataset.at}`));
    $$('[data-tr]').forEach(b => b.onclick = () => rolarD20(rs.attrs[b.dataset.tr].save, `TR de ${b.dataset.tr}`));
    $$('[data-ini]').forEach(b => b.onclick = () => rolarD20(rs.iniciativa, 'Iniciativa'));
    const clr = $('#dclr'); if (clr) clr.onclick = async () => { if (!confirm('Apagar o histórico de rolagens da mesa?')) return; const { error } = await sb.from('rolagens').delete().eq('mesa_id', S.mesa.id); if (error) return toast(errMsg(error), 'warning'); S.rolagens = []; paneDados(); };
  }
  let diceTimer = null, ultimaRolagem = null;
  function mostrarRolagem(r) { ultimaRolagem = { r, t: Date.now() }; renderDiceToast(); }
  /* Dado em vetor: cai girando, levanta fumaça (estilo anime) e para no número */
  const DADO_COR = { 4: ['#43a047', '#2e7d32'], 6: ['#4fb6c9', '#2f8fa3'], 8: ['#7e3fe0', '#5b2bb0'], 10: ['#d94a9a', '#a8326f'], 12: ['#d64545', '#a52e2e'], 20: ['#8b5cf6', '#6d28d9'], 100: ['#5b6bd6', '#3d49a8'] };
  function dadoSVG(lados, valor) {
    const [c1, c2] = DADO_COR[lados] || ['#8c8c8c', '#5f5f5f'];
    const txt = (y, size = 34) => `<text x="50" y="${y}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="${size}" fill="#fff" stroke="rgba(0,0,0,.18)" stroke-width="2" paint-order="stroke" class="dnum">${valor}</text>`;

    switch (+lados) {

      case 6: forma = `<rect x="10" y="10" width="80" height="80" rx="12" fill="${c1}"/><rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="${c2}" stroke-width="4"/>${txt(62)}`; break;
      case 8: forma = `<polygon points="50,4 94,50 50,96 6,50" fill="${c1}"/><polygon points="6,50 94,50 50,96" fill="${c2}" opacity=".45"/>${txt(60, 30)}`; break;
      case 10: case 100: forma = `<polygon points="50,4 94,40 50,96 6,40" fill="${c1}"/><polygon points="6,40 50,58 94,40 50,96" fill="${c2}" opacity=".45"/>${txt(58, lados == 100 ? 24 : 30)}`; break;
      case 12: forma = `<polygon points="50,4 93,35 77,90 23,90 7,35" fill="${c1}"/><polygon points="50,24 72,40 64,68 36,68 28,40" fill="${c2}" opacity=".4"/>${txt(60, 28)}`; break;
      case 20: forma = `<polygon points="50,3 93,27 93,73 50,97 7,73 7,27" fill="${c1}"/><polygon points="50,3 93,27 7,27" fill="#fff" opacity=".12"/><polygon points="7,73 50,97 93,73" fill="${c2}" opacity=".55"/><polygon points="50,24 78,70 22,70" fill="#fff" opacity=".18"/><path d="M7 27 22 70M93 27 78 70M50 3 50 24M22 70 7 73M78 70 93 73M22 70 50 97 78 70" stroke="${c2}" stroke-width="1.5" opacity=".5" fill="none"/>${txt(62, 28)}`; break;

  }
  function fumaca() { // nuvem de anime: círculos com contorno único

    return `<svg viewBox="0 0 100 100" class="smoke"><g stroke="#1b1d2a" stroke-width="7">${P.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g><g fill="#f4f1ea">${P.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g><g fill="#fff">${P.slice(0, 4).map(([x, y, r]) => `<circle cx="${x - r * .3}" cy="${y - r * .3}" r="${r * .35}"/>`).join('')}</g></svg>`;

  function renderDiceToast() {

    const old = $('#diceToast'); if (old) old.remove();
    const r = ultimaRolagem.r, c = critico(r);
    const dados = []; let mod = 0;
    (r.detalhe || []).forEach(x => { if (x.k != null) mod += x.k; else x.r.forEach(v => dados.push({ d: x.d, v, neg: x.s < 0 })); });

  /* ---------- Chat ---------- */

  function renderChatList(forcar) {
    const el = $('#chatList'); if (!el) return;
    const perto = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    const itens = S.chat.map(m => ({ t: 'm', at: m.created_at, m }))
      .concat(S.rolagens.map(r => ({ t: 'r', at: r.created_at, m: r })))
      .sort((a, b) => new Date(a.at) - new Date(b.at)).slice(-200);
    let ant = null;
    el.innerHTML = itens.length ? itens.map(it => {
      if (it.t === 'r') { ant = null; return rolagemHTML(it.m); }
      // Mensagens seguidas da mesma pessoa em até 3 min ficam agrupadas.
      const cont = ant && ant.user_id === it.m.user_id && new Date(it.m.created_at) - new Date(ant.created_at) < 180000;
      ant = it.m; return msgHTML(it.m, cont);
    }).join('') : '<div class="chat-vazio">Ninguém falou nada ainda. Diga oi para a mesa!</div>';
    if (forcar || perto) el.scrollTop = el.scrollHeight;
  }
  function addMsg(n) {
    if (S.chat.some(x => x.id === n.id)) return false;
    S.chat.push(n); if (S.chat.length > 300) S.chat = S.chat.slice(-300);
    return true;
  }
  async function enviarMsg() {
    const inp = $('#chatIn'), txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    const cmd = txt.match(/^\/r(?:oll)?\s+(.+)$/i);
    if (cmd) return rolar(cmd[1]);
    const { data, error } = await sb.from('mensagens').insert({ mesa_id: S.mesa.id, user_id: NV.user.id, nome: meuNome(), texto: txt.slice(0, 500) }).select('*').single();
    if (error) { inp.value = txt; return toast(errMsg(error), 'warning'); }
    addMsg(data); renderChatList(true);
  }
  let chatCh = null;
  // Canal separado do resto da mesa: se o chat falhar, mover token e rolar dado continuam.
  function assinarChat(id) {
    if (chatCh) { sb.removeChannel(chatCh); chatCh = null; }
    if (!S.chatOk) return;
    chatCh = sb.channel('mesa-chat-' + id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mensagens', filter: `mesa_id=eq.${id}` }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') S.chat = S.chat.filter(x => x.id !== o.id);
        else if (addMsg(n) && n.user_id !== NV.user.id && S.tab !== 'chat') {
          S.naoLidas++; renderTabs();
          toast(`<b>${esc(n.nome || 'Hunter')}:</b>&nbsp;${esc(n.texto.length > 60 ? n.texto.slice(0, 60) + '…' : n.texto)}`, 'chat-circle-dots');
        }
        if (S.tab === 'chat') renderChatList();
      })
      .subscribe();
  }

  function paneGrupo() {
    const link = location.origin + location.pathname.replace(/[^/]*$/, '') + 'mesa.html?entrar=' + S.mesa.codigo;
    const ids = [S.mesa.owner, ...S.membros.map(x => x.user_id).filter(u => u !== S.mesa.owner)];
    P().innerHTML = `<h4>Convite</h4>
      <div class="item"><div class="tiny">Código</div><b style="font-size:24px;letter-spacing:.15em">${S.mesa.codigo}</b>
      <div class="row"><button class="btn btn-sm btn-primary" id="cpLink">Copiar link do convite</button></div></div>
      <div class="sep"></div><h4>Na mesa</h4>
      <div class="stack">${ids.map(u => {
        const p = S.perfis[u] || {}, mb = S.membros.find(x => x.user_id === u), tok = Object.values(S.tokens).find(t => t.tipo === 'pj' && t.owner === u);
        return `<div class="item" style="display:flex;align-items:center;gap:10px">${avatar(p)}<div style="flex:1;min-width:0"><b>${esc(p.nome || 'Jogador')}</b><div class="tiny">${u === S.mesa.owner ? 'Narrador' : tok ? esc(tok.nome) : 'Sem personagem ainda'}</div></div>
          ${S.gm && u !== S.mesa.owner && mb ? `<button class="btn btn-sm btn-ghost" data-kick="${u}" style="color:var(--red-6)">Remover</button>` : ''}</div>`;
      }).join('')}</div>
      <div class="sep"></div>
      ${S.gm ? `<h4>Mesa</h4><div class="field"><input class="input" id="mNome" maxlength="60" value="${esc(S.mesa.nome)}"></div><div class="row" style="display:flex;gap:8px"><button class="btn btn-sm" id="mRen">Renomear</button><button class="btn btn-sm btn-ghost" id="mDel" style="color:var(--red-6);margin-left:auto">Apagar mesa</button></div>`
        : `<button class="btn btn-sm btn-ghost" id="mSair" style="color:var(--red-6)">Sair da mesa</button>`}`;
    $('#cpLink').onclick = () => navigator.clipboard.writeText(link).then(() => toast('Link copiado', 'link'));
    $$('[data-kick]').forEach(b => b.onclick = async () => { if (!confirm('Remover este jogador da mesa?')) return; await sb.from('tokens').delete().eq('mesa_id', S.mesa.id).eq('owner', b.dataset.kick); const { error } = await sb.from('mesa_membros').delete().eq('mesa_id', S.mesa.id).eq('user_id', b.dataset.kick); if (error) return toast(errMsg(error), 'warning'); S.membros = S.membros.filter(x => x.user_id !== b.dataset.kick); paneGrupo(); renderBar(); });
    const ren = $('#mRen'); if (ren) ren.onclick = async () => { const nome = $('#mNome').value.trim() || S.mesa.nome; const { error } = await sb.from('mesas').update({ nome }).eq('id', S.mesa.id); if (error) return toast(errMsg(error), 'warning'); S.mesa.nome = nome; renderBar(); toast('Mesa renomeada', 'pencil-simple'); };
    const del = $('#mDel'); if (del) del.onclick = async () => { if (!confirm(`Apagar a mesa "${S.mesa.nome}" com cenas, mapa e tokens? Não dá para desfazer.`)) return; const { error } = await sb.from('mesas').delete().eq('id', S.mesa.id); if (error) return toast(errMsg(error), 'warning'); location.href = 'mesa.html'; };
    const sair = $('#mSair'); if (sair) sair.onclick = async () => { if (!confirm('Sair desta mesa?')) return; await sb.from('tokens').delete().eq('mesa_id', S.mesa.id).eq('owner', NV.user.id); await sb.from('mesa_membros').delete().eq('mesa_id', S.mesa.id).eq('user_id', NV.user.id); location.href = 'mesa.html'; };
  }

  /* ---------- Tempo real ---------- */
  function assinar(id) {
    if (channel) sb.removeChannel(channel);
    const f = `mesa_id=eq.${id}`;
    channel = sb.channel('mesa-' + id, { config: { broadcast: { self: false } } })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tokens', filter: f }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') { delete S.tokens[o.id]; if (S.sel === o.id) S.sel = null; if ($('#tokLayer')) renderTokens(); }
        else { S.tokens[n.id] = n; if ($('#tokLayer')) atualizarToken(n); if (S.sel === n.id) renderTokPanel(); }
        if (S.tab === 'tokens' || S.tab === 'ninja' || S.tab === 'grupo') renderSide();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mesas', filter: `id=eq.${id}` }, ({ eventType, new: n }) => {
        if (eventType === 'DELETE') { toast('O narrador encerrou esta mesa', 'flag-checkered'); setTimeout(() => location.href = 'mesa.html', 1500); return; }
        const mudou = n.exibindo !== S.mesa.exibindo || n.cena_id !== S.mesa.cena_id;
        S.mesa = n; renderBar(); if (mudou && (!S.gm || !S.view)) renderStage();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cenas', filter: f }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') S.cenas = S.cenas.filter(c => c.id !== o.id);
        else { const i = S.cenas.findIndex(c => c.id === n.id); if (i >= 0) S.cenas[i] = n; else S.cenas.push(n); }
        if (vistaAtual() === 'cena') renderStage();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mapas', filter: f }, ({ eventType, new: n }) => {
        S.mapa = eventType === 'DELETE' ? null : n; if (vistaAtual() === 'mapa') renderStage();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'mesa_membros', filter: f }, async ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') { S.membros = S.membros.filter(x => !(x.user_id === o.user_id)); if (o.user_id === NV.user.id && !S.gm) { toast('Você saiu desta mesa', 'hand-waving'); setTimeout(() => location.href = 'mesa.html', 1200); return; } }
        else { const i = S.membros.findIndex(x => x.user_id === n.user_id); if (i >= 0) S.membros[i] = n; else { S.membros.push(n); await carregarPerfis(); toast(`${(S.perfis[n.user_id] || {}).nome || 'Alguém'} entrou na mesa`, 'confetti'); } }
        renderBar(); if (S.tab === 'grupo') renderSide();
      })
      .on('broadcast', { event: 'tok' }, ({ payload: p }) => {
        const t = S.tokens[p.id]; if (!t) return; Object.assign(t, p); if ($('#tokLayer')) atualizarToken(t); if (S.sel === t.id) renderTokPanel();
      })
      .on('broadcast', { event: 'ruler' }, ({ payload: p }) => {
        if (p.pts) S.rulers[p.u] = { pts: p.pts, nome: (p.nome || '').split(' ')[0], t: Date.now() }; else delete S.rulers[p.u];
        desenharOverlay();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rolagens', filter: f }, ({ eventType, new: n, old: o }) => {
        if (eventType === 'DELETE') { S.rolagens = S.rolagens.filter(x => x.id !== o.id); }
        else if (podeVerRolagem(n) && !S.rolagens.some(x => x.id === n.id)) { S.rolagens.unshift(n); S.rolagens = S.rolagens.slice(0, 80); mostrarRolagem(n); }
        if (S.tab === 'dados') paneDados(); else if (S.tab === 'chat') renderChatList();
      })
      .on('broadcast', { event: 'move' }, ({ payload: p }) => {
        const t = S.tokens[p.id]; if (!t || (drag && drag.id === p.id)) return;
        const el = $(`.tok[data-id="${p.id}"]`); if (el) { el.style.left = p.x * CELL + 'px'; el.style.top = p.y * CELL + 'px'; }
      })
      .subscribe(status => { if (status === 'CHANNEL_ERROR') toast('Conexão ao vivo instável. Recarregue se algo não atualizar.', 'wifi-medium'); });
  }

  /* ---------- Início ---------- */
  NV.ready.then(async () => {
    if (!NV.user) return lobby();
    const cod = qs.get('entrar');
    if (cod) {
      const { data, error } = await sb.rpc('entrar_mesa', { cod, uid: NV.user.id });
      if (error) { toast('Convite inválido ou expirado', 'warning'); history.replaceState(null, '', 'mesa.html'); return lobby(); }
      history.replaceState(null, '', 'mesa.html?m=' + data);
      return abrirMesa(data);
    }
    const m = qs.get('m');
    m ? abrirMesa(m) : lobby();
  });
  // Saiu do HxH5e (em outra aba): a mesa sai junto.
  NV.onAuth(u => { if (!u) location.href = NV.APP_URL; });
})();
</script>
</body>
