</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- Hexágono do diagrama de Nen (as 6 categorias) no lugar do espiral do Shinobi; o id foi mantido -->
  <symbol id="spiral" viewBox="0 0 100 100"><polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><polygon points="50,28 69,39 69,61 50,72 31,61 31,39" fill="currentColor" opacity=".35"/></symbol>
  <!-- Aura de Nen nos tokens: ruído animado deslocando o contorno.
       TEN = camada irregular mais justa e calma; REN = camada maior, "fervendo". -->
  <filter id="auraTen" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7"><animate attributeName="baseFrequency" values="0.04;0.055;0.04" dur="4.2s" repeatCount="indefinite"/></feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.3"/>
  </filter>
  <filter id="auraRen" x="-40%" y="-40%" width="180%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"><animate attributeName="baseFrequency" values="0.03;0.05;0.035;0.03" dur="3.2s" repeatCount="indefinite"/></feTurbulence>
    <feDisplacementMap in="SourceGraphic" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.6"/>
  </filter>
</defs></svg>
<div id="root"></div>
<input type="file" id="fileIn" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<div class="toasts" id="toasts" role="status"></div>

<!-- config.js do HxH5e: ADMIN_USERS e as cores das categorias de Nen (SYSTEM_DB.classes) -->
<script src="../js/data/config.js"></script>
<script src="../js/data/nen-affinity.js"></script>
<!-- Bestiário do HxH5e (window.BESTIARY_DATA): a aba Bestiário do narrador -->
<script src="../js/data/bestiary-data.js"></script>
<script src="assets/nuvem-hxh.js"></script>
<script src="assets/blocos.js"></script>
<script src="assets/mapgen.js"></script>
<script>
(() => {
  const NV = window.Nuvem, sb = NV.sb;
  const COR_PV = '#f87171', COR_AURA = '#00b8d4';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const CELL = 64;
  const root = $('#root');
  /* ---------- Avisos sonoros ----------
     Sintetizados na hora com WebAudio: nenhum arquivo, nenhuma requisição e nada
     para subir junto — combina com o resto da mesa, que é um arquivo só.
     Também não usa a API de Notificação do navegador: nada de pedir permissão,
     como foi pedido. O aviso é o som mais o toast que a mesa já mostra. */
  const Avisos = {
    ctx: null,
    get ligado() { return localStorage.getItem('nv_mesa_som') !== '0'; },
    set ligado(v) { localStorage.setItem('nv_mesa_som', v ? '1' : '0'); },
    // O contexto só nasce depois do primeiro clique: navegador nenhum deixa tocar
    // som antes de o usuário interagir com a página.
    ac() {
      if (!this.ligado) return null;
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      if (!this.ctx) this.ctx = new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    // Um bipe curto. tipo 'triangle' soa mais macio que 'sine' em caixinha de celular.
    nota(f, t0, dur, vol, tipo) {
      const c = this.ac(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = tipo || 'triangle'; o.frequency.setValueAtTime(f, c.currentTime + t0);
      g.gain.setValueAtTime(0.0001, c.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
      o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.02);
    },
    // Dado: estalos secos e agudos em sequência, como o d20 batendo na mesa.
    dado() {
      const c = this.ac(); if (!c) return;
      [0, 0.055, 0.1, 0.14, 0.21].forEach((t0, i) => {
        const o = c.createOscillator(), g = c.createGain(), f = 1400 - i * 150 + Math.random() * 260;
        o.type = 'square'; o.frequency.setValueAtTime(f, c.currentTime + t0);
        g.gain.setValueAtTime(0.06 - i * 0.008, c.currentTime + t0);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + 0.05);
        o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + 0.06);
      });
    },
    // Mensagem: duas notas subindo, discreto.
    msg() { this.nota(660, 0, 0.1, 0.05); this.nota(880, 0.08, 0.14, 0.05); },
    // Menção: três notas, mais alto — é para ser notado.
    mencao() { this.nota(784, 0, 0.1, 0.09); this.nota(988, 0.09, 0.1, 0.09); this.nota(1319, 0.18, 0.2, 0.09); },
  };
  function montarBotaoSom() {
    const b = $('#somAviso'); if (!b) return;
    const pinta = () => { b.innerHTML = `<i class="ph-bold ph-speaker-${Avisos.ligado ? 'high' : 'slash'}"></i>`;
      b.title = Avisos.ligado ? 'Sons de aviso ligados' : 'Sons de aviso desligados'; };
    pinta();
    b.onclick = () => { Avisos.ligado = !Avisos.ligado; pinta(); if (Avisos.ligado) Avisos.msg(); };
  }

  /* ---------- Menções ----------
     Sem acento e sem maiúscula dos dois lados: "@joao" acha "João". */
  const semAcento = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  // Quem está na mesa, com o primeiro nome e o nome inteiro — os dois servem de alvo.
  function alvosMencao() {
    const ids = [S.mesa.owner, ...S.membros.map(x => x.user_id)];
    const vistos = {}, out = [];
    ids.forEach(u => {
      if (!u || vistos[u]) return; vistos[u] = 1;
      const p = S.perfis[u] || {}; const nome = (p.nome || '').trim(); if (!nome) return;
      out.push({ id: u, nome, primeiro: nome.split(/\s+/)[0] });
    });
    return out;
  }
  // A mensagem me marcou? Compara com o meu primeiro nome e com o inteiro.
  function mencionaUsuario(texto, userId) {
    const p = S.perfis[userId] || {}; const nome = (p.nome || '').trim(); if (!nome) return false;
    const alvos = [semAcento(nome), semAcento(nome.split(/\s+/)[0])];
    const achados = String(texto || '').match(/@([\p{L}\p{N}_]+)/gu) || [];
    return achados.some(a => alvos.indexOf(semAcento(a.slice(1))) >= 0);
  }
  // Pinta os @nome. O meu fica em laranja; os outros, em azul.
  function pintarMencoes(textoEscapado) {
    const meu = S.perfis[NV.user.id] || {};
    const meus = [semAcento(meu.nome), semAcento(String(meu.nome || '').split(/\s+/)[0])];
    const nomes = alvosMencao();
    return textoEscapado.replace(/@([\p{L}\p{N}_]+)/gu, (todo, n) => {
      const sa = semAcento(n);
      const existe = nomes.some(a => semAcento(a.nome) === sa || semAcento(a.primeiro) === sa);
      if (!existe) return todo;
      return `<span class="mencao${meus.indexOf(sa) >= 0 ? ' eu' : ''}">@${n}</span>`;
    });
  }

  function toast(msg, e = 'spiral') {
    const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `${/^[a-z-]+$/.test(e) ? `<i class="ph-fill ph-${e}" style="font-size:18px"></i>` : `<span>${e}</span>`}${msg}`;
    $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2800);
  }
  const errMsg = e => (e && (e.message || e.error_description)) || String(e);
  function pickFile() {
    return new Promise(res => { const f = $('#fileIn'); f.value = ''; f.onchange = () => res(f.files[0] || null); f.click(); });
  }
  function avatar(p, cls = 'av') {
    if (p && p.avatar_url) return `<img class="${cls}" src="${esc(p.avatar_url)}" alt="" referrerpolicy="no-referrer" title="${esc(p.nome || '')}">`;
    return `<span class="${cls}" title="${esc(p && p.nome || '')}">${esc(((p && p.nome) || '?')[0])}</span>`;
  }
  const qs = new URLSearchParams(location.search);

  /* =================== LOBBY =================== */
  async function lobby() {
    document.body.classList.remove('in-mesa');
    const me = NV.perfil();
    root.innerHTML = `<div class="lobby">
      <header class="topbar">
        <a class="brand" href="${NV.APP_URL}"><span class="brand-mark"><svg><use href="#spiral"/></svg></span>HxH5e · Mesa</a>
        <div class="right"><a class="btn btn-ghost btn-sm" href="${NV.APP_URL}"><i class="ph-bold ph-arrow-left"></i> Voltar para o HxH5e</a><div id="userMenu"></div></div>
      </header>
      <div class="lob-head"><div class="kicker">Mesa virtual</div><h1>Mesas</h1><p>O mestre cria a mesa e manda o convite; os jogadores entram com o código. Quem cria a mesa é o narrador dela.</p></div>
      <div id="lobBody"></div>
    </div>`;
    NV.montarMenu($('#userMenu'));
    if (!NV.user) {
      $('#lobBody').innerHTML = `<div class="gate"><h2>Entre para jogar</h2><p>A mesa usa a mesma conta do HxH5e (Discord ou Google). Entre por lá e volte para cá.</p><a class="gbtn" href="${NV.APP_URL}">Ir para o HxH5e</a></div>`;
      return;
    }
    // Criar mesa é só para mestre e admin; jogador entra por código ou convite.
    $('#lobBody').innerHTML = `
      <div class="lob-actions" ${NV.podeNarrar ? '' : 'style="grid-template-columns:1fr"'}>
        ${NV.podeNarrar ? `<div class="lob-card gm"><h3>Criar mesa</h3><p>Você vira o narrador: escolhe cenas, monta o battlemap e controla os inimigos.</p>
          <div class="row"><input class="input" id="nmMesa" maxlength="60" placeholder="Ex.: Exame Hunter"><button class="btn btn-orange" id="mkMesa">Criar</button></div></div>` : ''}
        <div class="lob-card"><h3>Entrar com código</h3><p>O mestre te passa um código de 6 letras (ou o link do convite).</p>
          <div class="row"><input class="input" id="cdMesa" maxlength="6" placeholder="Ex.: 7F3A9C" style="text-transform:uppercase;letter-spacing:.15em"><button class="btn btn-primary" id="inMesa">Entrar</button></div></div>
      </div>
      <h3 style="margin-bottom:12px">Suas mesas</h3>
      <div class="mesas" id="mesas"><div class="item">Carregando…</div></div>`;
    const mk = $('#mkMesa');
    if (mk) mk.onclick = async () => {
      const nome = $('#nmMesa').value.trim() || 'Nova mesa';
      const { data, error } = await sb.from('mesas').insert({ nome, owner: NV.user.id }).select('id').single();
      if (error) return toast(errMsg(error), 'warning');
      location.href = 'mesa.html?m=' + data.id;
    };
    const entrar = async cod => {
      const { data, error } = await sb.rpc('entrar_mesa', { cod, uid: NV.user.id });
      if (error) return toast(/encontrada/.test(error.message) ? 'Código não encontrado' : errMsg(error), 'warning');
      location.href = 'mesa.html?m=' + data;
    };
    $('#inMesa').onclick = () => entrar($('#cdMesa').value);
    $('#cdMesa').onkeydown = e => { if (e.key === 'Enter') entrar(e.target.value); };
    // Sem RLS por usuário, o filtro "minhas mesas" é explícito: as que eu narro + as que eu entrei.
    const mb = await sb.from('mesa_membros').select('mesa_id').eq('user_id', NV.user.id);
    const ids = (mb.data || []).map(x => x.mesa_id);
    let q = sb.from('mesas').select('id, nome, codigo, owner, exibindo, created_at').order('created_at', { ascending: false });
    q = ids.length ? q.or(`owner.eq.${NV.user.id},id.in.(${ids.join(',')})`) : q.eq('owner', NV.user.id);
    const { data, error } = await q;
    if (error) { $('#mesas').innerHTML = `<div class="item">Erro: ${esc(errMsg(error))}</div>`; return; }
    $('#mesas').innerHTML = data.length ? data.map(m => `<a class="mcard" href="mesa.html?m=${m.id}"><i class="ph ph-hexagon k"></i><h3>${esc(m.nome)}</h3>
      <div class="tags"><span class="tag">${m.owner === NV.user.id ? '<i class="ph ph-crown-simple"></i> Narrador' : '<i class="ph ph-user"></i> Jogador'}</span><span class="tag">Código ${m.codigo}</span>${m.exibindo !== 'nada' ? `<span class="tag" style="color:var(--red-6)"><i class="ph-fill ph-broadcast"></i> Ao vivo</span>` : ''}</div></a>`).join('')
      : `<div class="item">Nenhuma mesa ainda. ${NV.podeNarrar ? 'Crie uma ou entre com um código.' : 'Peça o código ao seu mestre.'}</div>`;
  }

  /* =================== MESA =================== */
  const S = { mesa: null, gm: false, membros: [], perfis: {}, cenas: [], mapa: null, tokens: {}, meus: [], view: null, sel: null, painel: null, tab: null, rolagens: [], tool: 'mover', rulers: {}, chat: [], chatOk: false, naoLidas: 0 };
  let cam = { x: 40, y: 40, z: 1 };
  // Janela do token: posição e se está diminuída ficam neste navegador.
  try { const tp = JSON.parse(localStorage.getItem('hxh-mesa-tp') || 'null'); if (tp) { S.tpPos = tp.pos || null; S.tpMin = !!tp.min; S.tpTam = tp.tam || null; S.tpAntes = tp.antes || null; } } catch (e) {}
  let channel = null;

  async function abrirMesa(id) {
    if (!NV.user) return lobby();
    document.body.classList.add('in-mesa');
    root.innerHTML = `<div class="wait" style="position:fixed"><div><svg><use href="#spiral"/></svg><h2>Abrindo a mesa…</h2></div></div>`;
    const [m, mb, cs, mp, tk, rl, ch] = await Promise.all([
      sb.from('mesas').select('*').eq('id', id).maybeSingle(),
      sb.from('mesa_membros').select('*').eq('mesa_id', id),
      sb.from('cenas').select('*').eq('mesa_id', id).order('created_at'),
      sb.from('mapas').select('*').eq('mesa_id', id).maybeSingle(),
      sb.from('tokens').select('*').eq('mesa_id', id),
      sb.from('rolagens').select('*').eq('mesa_id', id).order('created_at', { ascending: false }).limit(50),
      sb.from('mensagens').select('*').eq('mesa_id', id).order('created_at', { ascending: false }).limit(150),
    ]);
    // Se a tabela de chat não existir, a mesa funciona normalmente, só sem chat.
    S.chatOk = !ch.error; S.chat = (ch.data || []).reverse(); S.naoLidas = 0;
    if (m.error || !m.data) { toast('Mesa não encontrada ou sem acesso', 'warning'); history.replaceState(null, '', 'mesa.html'); return lobby(); }
    S.mesa = m.data; S.gm = m.data.owner === NV.user.id;
    S.membros = mb.data || []; S.cenas = cs.data || []; S.mapa = mp.data || null;
    S.tokens = {}; (tk.data || []).forEach(t => S.tokens[t.id] = t);
    S.rolagens = (rl.data || []).filter(podeVerRolagem); S.rolFim = (rl.data || []).length < 50; S.rolAntigas = false;
    S.tab = S.tab || (S.gm ? 'cenas' : 'ninja');
    try { const c = JSON.parse(localStorage.getItem('hxh-mesa-cam-' + id) || 'null'); if (c) cam = c; } catch (e) {}
    await carregarPerfis();
    try { S.meus = await NV.listar(); } catch (e) { S.meus = []; }
    montarMesa();
    assinar(id);
    assinarChat(id);
  }
  async function carregarPerfis() {
    const ids = [...new Set([S.mesa.owner, ...S.membros.map(x => x.user_id)])];
    (await NV.perfis(ids)).forEach(p => S.perfis[p.id] = p);
  }
  // Rolagem secreta: só quem rolou e o narrador veem. É só na tela — com a chave
  // pública, o banco não esconde nada (mesmo nível do resto do app).
  function podeVerRolagem(r) { return !r.secreta || S.gm || r.user_id === NV.user.id; }

  function montarMesa() {
    root.innerHTML = `<div class="app" id="app">
      <header class="mbar">
        <a class="btn btn-sm btn-ghost sair" href="mesa.html" title="Sair desta mesa e voltar à lista de mesas (de lá você volta para o HxH5e)"><i class="ph-bold ph-arrow-left"></i><span class="hide-sm">Mesas</span></a>
        <a class="brand-mark" href="mesa.html" title="Voltar às mesas"><svg><use href="#spiral"/></svg></a>
        <span class="title" id="mTitle"></span>
        <span class="role ${S.gm ? '' : 'pl'}">${S.gm ? 'Narrador' : 'Jogador'}</span>
        <span id="liveTag"></span>
        <div class="som ${SOM.min ? 'min' : ''}" id="som" hidden><div class="som-v"><div id="somYT"></div><div class="som-ov" id="somOv"></div></div><div class="som-bar" id="somBar"></div><div class="som-vol" id="somVol"></div></div>
        <div class="right">
          <div class="faces" id="faces"></div>
          <span class="code hide-sm" id="codeBtn" title="Copiar link do convite">CONVITE · ${S.mesa.codigo}</span>
          <button class="btn btn-sm btn-icon btn-ghost" id="somAviso" title="Sons de aviso"></button>
          <button class="btn btn-sm btn-icon btn-ghost" id="sideWide"></button>
          <button class="btn btn-sm side-toggle" id="sideBtn">Painel</button>
        </div>
      </header>
      <section class="stage" id="stage"></section>
      <aside class="side" id="side"><div class="side-grip" id="sideGrip" title="Arraste para mudar a largura · duplo clique volta ao padrão"></div><nav class="tabs" id="tabs"></nav><div class="pane" id="pane"></div></aside>
    </div>`;
    $('#codeBtn').onclick = () => { navigator.clipboard.writeText(location.origin + location.pathname.replace(/[^/]*$/, '') + 'mesa.html?entrar=' + S.mesa.codigo).then(() => toast('Link do convite copiado', 'link')); };
    // Celular: gaveta de baixo (side-open). Desktop: coluna da direita (side-off).
    // O 860px é o mesmo breakpoint do CSS logo acima.
    $('#sideBtn').onclick = () => {
      const app = $('#app');
      app.classList.toggle(matchMedia('(max-width: 860px)').matches ? 'side-open' : 'side-off');
    };
    montarLargura();
    renderBar(); renderStage(); renderSide();
    aplicarTrilha();
  }

  /* ---------- Largura da barra lateral ---------- */
  // Arrastar a borda esquerda redimensiona; o botão no topo alterna entre o
  // padrão e "expandida" (metade da tela). A largura fica salva neste navegador.
  const SIDE_PADRAO = 360, SIDE_KEY = 'hxh-mesa-side-w';
  const sideMax = () => Math.max(SIDE_PADRAO, Math.min(innerWidth - 320, innerWidth * 0.75));
  const sideLarga = () => Math.round(Math.max(SIDE_PADRAO + 160, innerWidth * 0.5));
  let sideW = SIDE_PADRAO;
  try { sideW = +localStorage.getItem(SIDE_KEY) || SIDE_PADRAO; } catch (e) {}
  function aplicarLargura(w, salvar) {
    sideW = Math.round(Math.max(300, Math.min(sideMax(), w)));
    const app = $('#app'); if (!app) return;
    app.style.setProperty('--side-w', sideW + 'px');
    const b = $('#sideWide');
    if (b) {
      const larga = sideW > SIDE_PADRAO + 40;
      b.innerHTML = `<i class="ph-bold ph-${larga ? 'arrows-in-line-horizontal' : 'arrows-out-line-horizontal'}"></i>`;
      b.title = larga ? 'Voltar o painel ao tamanho normal' : 'Expandir o painel lateral';
    }
    if (salvar) { try { localStorage.setItem(SIDE_KEY, sideW); } catch (e) {} }
    // o palco mudou de largura: a régua/rotas usam coordenadas da tela
    if (typeof desenharOverlay === 'function') desenharOverlay();
  }
  function montarLargura() {
    aplicarLargura(sideW);
    $('#sideWide').onclick = () => aplicarLargura(sideW > SIDE_PADRAO + 40 ? SIDE_PADRAO : sideLarga(), true);
    montarBotaoSom();
    const g = $('#sideGrip');
    g.ondblclick = () => aplicarLargura(SIDE_PADRAO, true);
    g.onpointerdown = e => {
      e.preventDefault(); g.setPointerCapture(e.pointerId); document.body.classList.add('resizing');
      g.onpointermove = ev => aplicarLargura(innerWidth - ev.clientX);
      g.onpointerup = g.onpointercancel = () => { g.onpointermove = null; document.body.classList.remove('resizing'); aplicarLargura(sideW, true); };
    };
  }
  addEventListener('resize', () => { if ($('#app')) aplicarLargura(sideW); });
  function renderBar() {
    $('#mTitle').textContent = S.mesa.nome;
    $('#liveTag').innerHTML = S.mesa.exibindo === 'nada' ? '' : `<span class="live">Ao vivo: ${S.mesa.exibindo === 'cena' ? 'cena' : 'battlemap'}</span>`;
    const ids = [S.mesa.owner, ...S.membros.map(x => x.user_id).filter(u => u !== S.mesa.owner)];
    $('#faces').innerHTML = ids.slice(0, 8).map(u => avatar(S.perfis[u])).join('');
  }

  /* ---------- Palco ---------- */
  function vistaAtual() { return S.gm && S.view ? S.view : S.mesa.exibindo; }
  function renderStage() {
    const st = $('#stage'); if (!st) return;
    const v = vistaAtual();
    let html = '';
    if (S.gm) html += `<div class="viewsw">${['cena', 'mapa'].map(k => `<button data-v="${k}" class="${v === k ? 'on' : ''}">${k === 'cena' ? 'Cena' : 'Battlemap'}</button>`).join('')}${v !== S.mesa.exibindo || (v === 'mapa' && S.mapaPreview) ? '<span class="prev">PRÉVIA · SÓ VOCÊ VÊ</span>' : ''}</div>`;
    if (v === 'cena') {
      const c = S.cenas.find(x => x.id === (S.gm && S.view === 'cena' && S.previewCena ? S.previewCena : S.mesa.cena_id));
      html += c ? `<div class="scene">${c.imagem_url ? `<img src="${esc(c.imagem_url)}" alt="${esc(c.titulo)}">` : ''}${c.titulo ? `<div class="cap">${esc(c.titulo)}</div>` : ''}</div>`
        : `<div class="wait"><div><svg><use href="#spiral"/></svg><h2>Nenhuma cena escolhida</h2><p>${S.gm ? 'Crie uma cena no painel ao lado.' : 'O narrador ainda vai mostrar algo.'}</p></div></div>`;
      st.innerHTML = html;
    } else if (v === 'mapa') {
      st.innerHTML = html + `<div class="tools" id="tools"><button data-tool="mover" class="${S.tool === 'mover' ? 'on' : ''}" title="Mover (M)"><i class="ph ph-hand"></i> Mover</button><button data-tool="regua" class="${S.tool === 'regua' ? 'on' : ''}" title="Régua (R) · segure o esquerdo e clique com o direito para quebrar a rota"><i class="ph ph-ruler"></i> Régua</button><button data-tool="dados" title="Dados"><i class="ph ph-dice-five"></i> Dados</button></div>
        <div class="vp ${S.tool === 'regua' ? 'ruler' : ''}" id="vp"><div class="world" id="world"><div class="area" id="area"><div class="gl"></div></div><svg class="ovl" id="ovl" width="1" height="1"></svg><div id="tokLayer"></div></div>
        <div class="zoombar"><button id="zIn" title="Aproximar (+ ou Cmd/Ctrl + scroll)" aria-label="Aproximar"><i class="ph-bold ph-plus"></i></button><button id="zOut" title="Afastar (−)" aria-label="Afastar"><i class="ph-bold ph-minus"></i></button><button id="zOne" title="Tamanho real (1)" style="font-size:12px">1:1</button><button id="zFit" title="Ver o mapa inteiro (0)" aria-label="Ver o mapa inteiro"><i class="ph ph-crosshair"></i></button></div></div>`;
      montarMapa();
    } else {
      st.innerHTML = html + `<div class="wait"><div><svg><use href="#spiral"/></svg><h2>${S.gm ? 'Nada ao vivo ainda' : 'Aguardando o narrador…'}</h2><p>${S.gm ? 'Escolha uma cena ou monte o battlemap e clique em "Exibir para os jogadores".' : 'Pegue seus dados. A missão já vai começar.'}</p></div></div>`;
    }
    $$('.viewsw button').forEach(b => b.onclick = () => { S.view = b.dataset.v; S.previewCena = null; renderStage(); });
    $$('#tools button').forEach(b => b.onclick = () => {
      if (b.dataset.tool === 'dados') { S.tab = 'dados'; renderSide(); $('#app').classList.add('side-open'); return; }
      setTool(b.dataset.tool);
    });
    renderDiceToast();
    renderOrdem();
  }
  function setTool(t) {
    S.tool = t; $$('#tools button[data-tool]').forEach(x => x.classList.toggle('on', x.dataset.tool === t));
    const v = $('#vp'); if (v) v.classList.toggle('ruler', t === 'regua');
  }
  addEventListener('keyup', e => { if (e.code === 'Space') { espaco = false; const v = $('#vp'); if (v) v.classList.remove('grab'); } });
  addEventListener('keydown', e => {
    if (!document.body.classList.contains('in-mesa') || /input|textarea|select/i.test(e.target.tagName)) return;
    const v = $('#vp');
    if (v && (e.key === '+' || e.key === '=')) { e.preventDefault(); const r = v.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1.4); }
    if (v && (e.key === '-' || e.key === '_')) { e.preventDefault(); const r = v.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / 1.4); }
    if (v && e.key === '0') { e.preventDefault(); centralizar(); }
    if (v && e.key === '1') { e.preventDefault(); const r = v.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / cam.z); }
    if (v && e.code === 'Space' && !espaco) { e.preventDefault(); espaco = true; v.classList.add('grab'); }
    if (e.key === 'r' || e.key === 'R') setTool(S.tool === 'regua' ? 'mover' : 'regua');
    if (e.key === 'm' || e.key === 'M') setTool('mover');
    if (e.key === 'Escape' && rul) { rul = null; desenharOverlay(); enviarRegua(null); }
  });

  /* ---------- Battlemap ---------- */
  let vp, world, drag = null, pointers = new Map(), pinch = null;
  function aplicarCam() {
    if (!world) return;
    world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
    world.style.setProperty('--z', cam.z);
    // O grid é desenhado no .vp, que vive em coordenadas de TELA — por isso tudo
    // aqui é multiplicado pelo zoom. `escala` e o deslocamento existem para casar
    // o grid do app com o grid já desenhado numa imagem enviada: o mestre empurra
    // e estica até as linhas coincidirem, em vez de ter que recortar a imagem.
    const G = gridCfg();
    const cel = CELL * cam.z * (G.escala || 1);
    vp.style.setProperty('--g', cel + 'px');
    vp.style.setProperty('--gx', (cam.x + (G.dx || 0) * cam.z) + 'px');
    vp.style.setProperty('--gy', (cam.y + (G.dy || 0) * cam.z) + 'px');
    vp.style.setProperty('--gw', (G.forca || 1) + 'px');
    vp.style.setProperty('--ga', String(Math.min(0.6, 0.05 * (G.forca || 1))));
    vp.classList.toggle('sem-grid', G.on === false);
    aplicarGridArea(G);
    clearTimeout(aplicarCam.t);
    aplicarCam.t = setTimeout(() => { try { localStorage.setItem('hxh-mesa-cam-' + S.mesa.id, JSON.stringify(cam)); } catch (e) {} }, 400);
  }
  function zoomEm(px, py, f) {
    const z = Math.max(0.2, Math.min(8, cam.z * f));
    const k = z / cam.z;
    cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.z = z; aplicarCam(); desenharOverlay();
  }
  /* Configuração do grid, guardada em mapas.config.grid — coluna JSONB que já
     existia e já carregava o config.gen do gerador de mapas. Nenhuma mudança de
     banco foi necessária para isto.
     { on: true, forca: 1, dx: 0, dy: 0, escala: 1 } */
  // `cor`: 'auto' deixa como sempre foi (preto sobre imagem, branco em mapa
  // branco), 'claro' força branco e 'escuro' força preto. Existe porque o traço
  // preto padrão desaparece num battlemap escuro — era parte do motivo de o grid
  // parecer que não estava respondendo.
  const GRID_PADRAO = { on: true, forca: 1, dx: 0, dy: 0, escala: 1, cor: 'auto' };
  const GRID_CORES = { claro: 'rgba(255,255,255,.55)', escuro: 'rgba(0,0,0,.45)' };
  function gridCfg() {
    const m = (S.gm && S.mapaPreview) || S.mapa;
    return Object.assign({}, GRID_PADRAO, (m && m.config && m.config.grid) || {});
  }

  /* O grid DE CIMA do mapa (.gl, dentro da .area). Fica em coordenadas de MUNDO,
     então o zoom não entra na conta — o #world já está escalado. É por isso que
     o mesmo dx/dy serve aos dois: no .vp ele é multiplicado pelo zoom, aqui não. */
  function aplicarGridArea(G) {
    const gl = document.querySelector('#area .gl'), area = $('#area');
    if (!gl || !area) return;
    const g = G || gridCfg();
    area.classList.toggle('sem-grid', g.on === false);
    gl.style.setProperty('--gl-s', (CELL * (g.escala || 1)) + 'px');
    gl.style.setProperty('--gl-x', (g.dx || 0) + 'px');
    gl.style.setProperty('--gl-y', (g.dy || 0) + 'px');
    gl.style.setProperty('--gl-w', (g.forca || 1) + 'px');
    // 'auto' não mexe na cor: deixa o CSS decidir pelo tipo de mapa, como antes.
    if (g.cor && GRID_CORES[g.cor]) gl.style.setProperty('--gl-c', GRID_CORES[g.cor]);
    else gl.style.removeProperty('--gl-c');
  }

  function mapaVisivel() { return (S.gm && S.mapaPreview && vistaAtual() === 'mapa') ? S.mapaPreview : (S.mapa || { cols: 30, rows: 30, fundo_url: null, config: {} }); }
  function centralizar() {
    const m = mapaVisivel();
    const r = vp.getBoundingClientRect();
    const z = Math.max(0.25, Math.min(1.5, Math.min(r.width / (m.cols * CELL + 80), r.height / (m.rows * CELL + 80))));
    cam = { z, x: (r.width - m.cols * CELL * z) / 2, y: (r.height - m.rows * CELL * z) / 2 }; aplicarCam(); desenharOverlay();
  }
  function toWorld(cx, cy) { const r = vp.getBoundingClientRect(); return { x: (cx - r.left - cam.x) / cam.z, y: (cy - r.top - cam.y) / cam.z }; }

  function montarMapa() {
    vp = $('#vp'); world = $('#world');
    const m = mapaVisivel();
    const area = $('#area');
    area.style.width = m.cols * CELL + 'px'; area.style.height = m.rows * CELL + 'px';
    const gen = m.config && m.config.gen;
    area.classList.toggle('blank', !m.fundo_url && !gen);
    area.classList.toggle('gen', !!gen);
    area.querySelectorAll('svg').forEach(x => x.remove());
    const oldLeg = $('#mLegend'); if (oldLeg) oldLeg.remove();
    if (gen) {
      area.style.background = MapGen.fundo(gen.tipo);
      area.insertAdjacentHTML('afterbegin', MapGen.svg(gen, m.cols, m.rows));
      const leg = document.createElement('div'); leg.id = 'mLegend'; leg.className = 'mlegend';
      leg.innerHTML = MapGen.legenda(gen.tipo).map(l => `<span><i style="--c:${l.cor};${l.fundo ? `background:${l.fundo}` : ''}"></i>${l.nome}</span>`).join('');
      $('#stage').appendChild(leg);
    } else {
      area.style.background = '';
      area.style.backgroundImage = m.fundo_url ? `url("${m.fundo_url}")` : '';
    }
    aplicarCam();
    if (!localStorage.getItem('hxh-mesa-cam-' + S.mesa.id)) requestAnimationFrame(centralizar);
    renderTokens();
    $('#zIn').onclick = () => { const r = vp.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1.4); };
    $('#zOne').onclick = () => { const r = vp.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / cam.z); };
    $('#zOut').onclick = () => { const r = vp.getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, 1 / 1.4); };
    $('#zFit').onclick = centralizar;
    vp.addEventListener('wheel', e => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      const k = e.deltaMode === 1 ? 16 : 1;
      if (e.metaKey || e.ctrlKey) { const d = e.deltaY * k; zoomEm(e.clientX - r.left, e.clientY - r.top, Math.abs(d) >= 40 ? (d < 0 ? 1.2 : 1 / 1.2) : Math.exp(-d * 0.01)); }
      else { cam.x -= (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * k; cam.y -= (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * k; aplicarCam(); desenharOverlay(); }
    }, { passive: false });
    vp.addEventListener('pointerdown', onDown);
    // Sem isso o navegador seleciona os tokens ao arrastar o mapa e passa a arrastar a seleção como imagem.
    vp.addEventListener('dragstart', e => e.preventDefault());
    vp.addEventListener('dblclick', onPing);
    vp.addEventListener('pointermove', onMove);
    vp.addEventListener('pointerup', onUp);
    vp.addEventListener('pointercancel', onUp);
    vp.addEventListener('mousedown', onRightDown, true);
    vp.addEventListener('contextmenu', e => e.preventDefault());
    // Delegado: o botão é recriado a cada atualização do token.
    vp.addEventListener('click', e => { const b = e.target.closest('.tok-abrir'); if (b) { e.stopPropagation(); abrirPainel(b.dataset.abrir); } });
    desenharOverlay();
  }
  /* ---------- Ping (duplo clique no mapa) ----------
     Uma "gota na água" onde se clicou. A do jogador só ele vê; a do narrador vai
     para todos pelo canal da mesa (só quando ele está olhando o mapa ao vivo). */
  const COR_PING_GM = '#ffb24d';
  let ultimoPing = 0;
  function mostrarPing(x, y, cor, nome) {
    const w = $('#world'); if (!w) return;
    const z = Math.max(.2, cam.z), sz = 150 / z;   // ~150 px na tela em qualquer zoom
    const el = document.createElement('div'); el.className = 'ping';
    el.style.cssText = `left:${x * CELL}px;top:${y * CELL}px;--c:${cor};--s:${sz}px;--fs:${11 / z}px`;
    el.innerHTML = [0, 1, 2].map(i => `<i style="--i:${i}"></i>`).join('') + '<b></b>' + (nome ? `<span>${esc(nome)}</span>` : '');
    w.appendChild(el); setTimeout(() => el.remove(), 2200);
  }
  function onPing(e) {
    if (S.tool === 'regua' || e.target.closest('.tok, .zoombar, .tools, .viewsw, .tokpanel, .tok-abrir, .ordem')) return;
    const p = toWorld(e.clientX, e.clientY), x = p.x / CELL, y = p.y / CELL;
    const meu = Object.values(S.tokens).find(t => t.tipo === 'pj' && t.owner === NV.user.id);
    mostrarPing(x, y, S.gm ? COR_PING_GM : (meu && meu.cor) || '#00ff9d', S.gm ? 'Narrador' : '');
    if (S.gm && channel && S.mesa.exibindo === 'mapa' && !S.mapaPreview && Date.now() - ultimoPing > 300) {
      ultimoPing = Date.now();
      channel.send({ type: 'broadcast', event: 'ping', payload: { x, y } });
    }
  }
  function podeMover(t) { return S.gm || t.owner === NV.user.id; }
  function barrasVisiveis(t) { return t.barras_publicas || S.gm || t.owner === NV.user.id; }
  /* Largura e altura do token, em quadrados.
     `tamanho` sempre foi um número só — o token era obrigatoriamente quadrado, e o
     seletor ia só até 4. Agora `tamanho` é a LARGURA e `tam_y` é a altura; quando
     `tam_y` não existe (todo token criado até hoje) ele vale o mesmo que a largura,
     e nada muda para quem já tinha token no mapa. */
  const tamX = t => Math.max(1, parseInt((t || {}).tamanho) || 1);
  const tamY = t => Math.max(1, parseInt((t || {}).tam_y) || tamX(t));
  const TOK_TAM_MAX = 12;

  function tokenHTML(t) {
    const lg = tamX(t) * CELL, al = tamY(t) * CELL;
    const vis = barrasVisiveis(t);
    const pct = (a, b) => Math.max(0, Math.min(100, b ? a / b * 100 : 0));
    const ini = (t.nome || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    if (vis && t.tipo === 'pj' && t.personagem_id && FICHAS[t.personagem_id] === undefined) carregaFicha(t.personagem_id);   // para o selo de Reações
    const nenAt = (t.principios || {}).ativos || {};
    return `<div class="tok ${t.tipo} ${tamX(t) !== tamY(t) ? 'retang' : ''} ${nenAt.zetsu ? 'zetsu' : ''} ${podeMover(t) ? 'mine' : ''} ${S.sel === t.id ? 'sel' : ''} ${turno().vez === t.id ? 'vez' : ''}" data-id="${t.id}" style="left:${t.x * CELL}px;top:${t.y * CELL}px;width:${lg}px;height:${al}px;--c:${esc(t.cor || '#1f5ae0')};--ac:${esc(corAura(t))}">
      ${vis ? `<div class="bars ${t.barras_publicas ? '' : 'priv'}"><i class="hp"><b style="width:${pct(t.hp, t.hp_max)}%"></b></i>${t.aura_max > 0 ? `<i class="au"><b style="width:${pct(t.aura, t.aura_max)}%"></b></i>` : ''}</div>` : ''}
      ${auraHTML(t)}
      <div class="disc">${t.img_url ? `<img src="${esc(t.img_url)}" alt="" draggable="false">` : esc(ini)}</div>
      <div class="lbl">${esc(t.nome)}</div>
      ${vis && reacAtual(t) != null ? `<span class="tok-reac ${reacAtual(t) < 1 ? 'zero' : ''}" title="Reações">${reacAtual(t)}</span>` : ''}
      ${S.sel === t.id && S.painel !== t.id ? `<button class="tok-abrir" data-abrir="${t.id}"><i class="ph-bold ph-identification-card"></i> Abrir ficha</button>` : ''}</div>`;
  }
  function renderTokens() {
    renderOrdem();
    const L = $('#tokLayer'); if (!L) return;
    L.innerHTML = Object.values(S.tokens).sort((a, b) => (a.tipo === 'npc') - (b.tipo === 'npc')).map(tokenHTML).join('');
    renderTokPanel();
  }
  function atualizarToken(t) {
    const el = $(`.tok[data-id="${t.id}"]`);
    if (!el) return renderTokens();
    renderOrdem();
    if (drag && drag.id === t.id) return;
    el.outerHTML = tokenHTML(t);
  }

  /* ---------- Ordem de iniciativa ----------
     O valor rolado fica em tokens.iniciativa (uma linha por token, então dois jogadores
     rolando juntos não se atropelam) e de quem é a vez fica em mesas.turno = { rodada, vez }.
     As duas tabelas já chegam ao vivo pelo canal da mesa. */
  const temIni = () => !!(S.mesa && 'turno' in S.mesa);
  const turno = () => (S.mesa && S.mesa.turno) || {};
  function ordem() {
    return Object.values(S.tokens).filter(t => t.iniciativa != null)
      .sort((a, b) => b.iniciativa - a.iniciativa || (a.tipo === 'npc') - (b.tipo === 'npc') || String(a.nome).localeCompare(String(b.nome)));
  }
  // Bônus de iniciativa: criatura do Bestiário usa DES; personagem usa a ficha; NPC avulso, 0.
  async function bonusIni(t) {
    const bm = bestDe(t); if (bm) return bestMod(bm.des);
    if (t.tipo === 'pj' && t.personagem_id) {
      if (FICHAS[t.personagem_id] === undefined || FICHAS[t.personagem_id] === null) await carregaFicha(t.personagem_id);
      const d = FICHAS[t.personagem_id];
      return d ? NV.resumo(d).iniciativa : 0;
    }
    return 0;
  }
  async function salvarIni(t, v) {
    t.iniciativa = v; atualizarToken(t);
    if (channel) channel.send({ type: 'broadcast', event: 'tok', payload: { id: t.id, iniciativa: v } });
    const { error } = await sb.from('tokens').update({ iniciativa: v }).eq('id', t.id);
    if (error) toast(esc(errMsg(error)), 'warning');
  }
  async function rolarIniciativa(t) {
    if (!temIni()) return rolarD20(await bonusIni(t), 'Iniciativa', t.nome);
    const r = await rolarD20(await bonusIni(t), 'Iniciativa', t.nome);
    if (r) await salvarIni(t, r.total);
  }
  function avisoVez() {
    const t = S.tokens[turno().vez]; if (!t) return;
    if (t.owner === NV.user.id && !S.gm) toast('<b>É a sua vez!</b>', 'sword');
    else toast(esc(`Vez de ${t.nome}`), 'sword');
  }
  async function salvarTurno(novo) {
    const ant = S.mesa.turno;
    S.mesa.turno = novo; renderTokens(); if (novo.vez && novo.vez !== (ant || {}).vez) avisoVez();
    const { error } = await sb.from('mesas').update({ turno: novo }).eq('id', S.mesa.id);
    if (error) { S.mesa.turno = ant; renderTokens(); toast(esc(errMsg(error)), 'warning'); }
  }
  function passarTurno(dir) {
    const L = ordem(); if (!L.length) return;
    const tu = turno(); let i = L.findIndex(t => t.id === tu.vez), rodada = tu.rodada || 1;
    if (i < 0) i = 0;   // a vez era de alguém que saiu da ordem: recomeça do topo
    else {
      i += dir;
      if (i >= L.length) { i = 0; rodada++; }
      if (i < 0) { i = L.length - 1; rodada = Math.max(1, rodada - 1); }
    }
    salvarTurno({ rodada, vez: L[i].id });
  }
  async function encerrarCombate() {
    if (!confirm('Encerrar o combate? A ordem de iniciativa é apagada.')) return;
    const { error } = await sb.from('tokens').update({ iniciativa: null }).eq('mesa_id', S.mesa.id).not('iniciativa', 'is', null);
    if (error) return toast(esc(errMsg(error)), 'warning');
    Object.values(S.tokens).forEach(t => { t.iniciativa = null; });
    S.ordemMin = null;
    await salvarTurno({});
  }
  function renderOrdem() {
    const old = $('#ordem'); if (old) old.remove();
    const st = $('#stage'); if (!st || !temIni()) return;
    const L = ordem(), tu = turno();
    const fora = Object.values(S.tokens).filter(t => t.iniciativa == null);
    const rolaveis = fora.filter(podeMover);   // narrador: todos; jogador: os próprios tokens
    const vezTok = S.tokens[tu.vez], minhaVez = vezTok && vezTok.owner === NV.user.id && !S.gm;
    // Fechado por padrão enquanto ninguém rolou; quem minimiza escolhe o estado.
    const min = S.ordemMin != null ? S.ordemMin : !L.length;
    const ava = t => t.img_url ? `<img class="oa" src="${esc(t.img_url)}" alt="">` : `<span class="oa" style="background:${esc(t.cor || '#374151')}">${esc((t.nome || '?')[0])}</span>`;
    const el = document.createElement('div'); el.className = 'ordem'; el.id = 'ordem';
    el.innerHTML = `<div class="ordem-h"><b><i class="ph-bold ph-sword"></i> Iniciativa</b>${tu.vez ? `<span class="rod">Rodada ${tu.rodada || 1}</span>` : L.length ? `<span class="rod">${L.length}</span>` : ''}
        <button class="min" id="ordMin" title="${min ? 'Abrir' : 'Minimizar'}" aria-label="${min ? 'Abrir' : 'Minimizar'} a ordem de iniciativa"><i class="ph-bold ph-caret-${min ? 'down' : 'up'}"></i></button></div>
      ${min ? '' : `${L.length ? `<ol class="ordem-l">${L.map(t => `<li class="${t.id === tu.vez ? 'vez' : ''}" data-osel="${t.id}">
          <span class="ov" ${S.gm ? `data-oval="${t.id}" title="Duplo clique para mudar o valor"` : ''}>${t.iniciativa}</span>${ava(t)}<span class="on" title="${esc(t.nome)}">${esc(t.nome)}</span>
          ${S.gm ? `<button data-orm="${t.id}" title="Tirar da ordem" aria-label="Tirar ${esc(t.nome)} da ordem">×</button>` : ''}</li>`).join('')}</ol>`
        : '<p class="ordem-vazio">Ninguém rolou iniciativa ainda.</p>'}
      ${rolaveis.length ? `<div class="ordem-fora"><span>Rolar:</span>${rolaveis.map(t => `<button data-oroll="${t.id}" title="Rolar a iniciativa de ${esc(t.nome)}">${esc(t.nome)}</button>`).join('')}</div>` : ''}

    const nen = nenEstado(t), z = nen.z || {}, patch = {};
    const ganho = Math.round((t.aura_max || 0) * (z.auraPct || 0) / 100);
    if (ganho > 0) patch.aura = Math.min(t.aura_max || 0, (t.aura || 0) + ganho);
    const ra = reacAtual(t); if (z.reacoes > 0 && ra != null) patch.reacoes = ra + z.reacoes;
    delete nen.ativos.zetsu; delete nen.rod.zetsu; nen.z = null;
    patch.principios = nen;
    await salvarTok(t, patch);
    toast(esc(`${t.nome}: ZETSU concluído · +${ganho} Aura${z.reacoes ? ` · +${z.reacoes} Reação` : ''}${z.furtividade ? ` · +${z.furtividade} Furtividade nesta rodada` : ''}`), 'eye-closed');
  }
  function nenHTML(t, pode) {
    const lista = nenLista(t), nen = nenEstado(t), ra = reacAtual(t);
    if (!lista.length) return '<p class="hint">Este personagem ainda não tem princípios de Nen dominados na ficha.</p>';
    const cor = ((NV.resumo(FICHAS[t.personagem_id] || {}).classe) || {}).color || '#00ff9d';
    const nome = k => k === 'inp' ? 'IN' : k.toUpperCase();
    const ligados = Object.keys(nen.ativos).map(k => nome(k) + (k === 'gyo' && nen.gyo ? ` (${GYO_ALVO[nen.gyo]})` : ''));
    const ca = corAura(t);
    const corHTML = pode ? `<div class="nen-cor"><span>COR DA AURA</span>${CORES_AURA.map(c => `<button data-auracor="${c}" class="${c === ca ? 'on' : ''}" style="--sw:${c}" title="${c}" aria-label="Aura ${c}"></button>`).join('')}<input type="color" id="nenCor" value="${ca}" title="Outra cor" aria-label="Escolher outra cor"></div>` : '';
    return `${corHTML}${ligados.length ? `<div class="nen-on"><i class="ph-fill ph-sparkle"></i><span>Ativo: ${esc(ligados.join(', '))}</span>${pode ? '<button data-nenoff="">Desligar tudo</button>' : ''}</div>` : ''}
      <div class="nen-l" style="--c:${cor}">${lista.map(p => {
        const on = !!nen.ativos[p.k];
        const min = p.k === 'gyo' ? 10 : p.custo, falta = (t.aura || 0) < min || (p.reac && ra != null && ra < p.reac);
        const info = on ? (p.k === 'zetsu' ? 'carregando' : 'ativo') : [p.k === 'gyo' ? '10–30 Aura' : p.custo ? `${p.custo} Aura` : 'sem custo', p.reac ? `${p.reac} Reações` : ''].filter(Boolean).join(' · ');
        return `<div class="nen-c ${on ? 'on' : ''}"><i class="ph-bold ph-${p.ic}"></i>
          <div class="nen-n"><b>${p.n}</b><em>${esc(on && p.k === 'gyo' && nen.gyo ? (nen.gyo === 'olhos' ? 'olhos: vê aura' : `+${p.gyo} ${nen.gyo}`) : p.ef)}</em><small>${esc(p.desc)}${p.k !== 'zetsu' && p.rod ? ` · dura ${p.rod} rodada${p.rod > 1 ? 's' : ''}` : ''}</small></div>
          <div class="nen-a"><span>${info}</span>${pode ? (on ? `${p.k === 'zetsu' ? '<button data-zetsu="1" title="Devolve a Aura e as Reações e desliga">Concluir</button>' : ''}<button data-nenoff="${p.k}">Desligar</button>` : `<button data-nen="${p.k}" ${falta ? 'disabled' : ''}>Ativar</button>`) : ''}</div></div>`;
      }).join('')}</div>
      <p class="hint">Mesmos princípios e custos da ficha. Gasta a Aura${lista.some(p => p.reac) ? ' e as Reações' : ''} do token; a ficha não muda. O princípio fica ativo até você clicar em Desligar.</p>`;
  }
  function abrirPainel(id) { if (!S.tokens[id]) return; S.sel = id; S.painel = id; if (S.tpMin) { S.tpMin = false; salvarTP(); } renderTokens(); }
  // Pode ver atributos/ataques: criatura do Bestiário (só narrador) ou ficha do jogador (dono e narrador).
  function temFicha(t) {
    if (bestDe(t)) return S.gm;
    return t.tipo === 'pj' && !!t.personagem_id && (S.gm || t.owner === NV.user.id) && FICHAS[t.personagem_id] !== false;
  }
  function abasPainel(t, pode) {
    const fic = temFicha(t);
    return [fic && ['atr', 'Atributos', 'chart-bar'], fic && ['atk', 'Ataques', 'sword'], fic && !bestDe(t) && nenLista(t).length && ['nen', 'Nen', 'sparkle'], barrasVisiveis(t) && reacMax(t) != null && ['reac', 'Reações', 'shield-chevron'], pode && ['cfg', 'Ajustes', 'gear-six']].filter(Boolean);
  }
  const salvarTP = () => { try { localStorage.setItem('hxh-mesa-tp', JSON.stringify({ pos: S.tpPos, min: S.tpMin, tam: S.tpTam, antes: S.tpAntes })); } catch (e) {} };
  function renderTokPanel() {
    const old = $('#tokPanel'), rolou = old && $('.tp-body', old) ? $('.tp-body', old).scrollTop : 0;
    if (old) old.remove();
    const t = S.sel && S.painel === S.sel && S.tokens[S.sel]; const st = $('.vp') && $('#stage');
    if (!t || !st) return;
    const pode = podeMover(t), vis = barrasVisiveis(t), min = !!S.tpMin;
    const abas = abasPainel(t, pode);
    if (!abas.some(a => a[0] === S.tpAba)) S.tpAba = abas.length ? abas[0][0] : null;
    const el = document.createElement('div'); el.className = 'tokpanel' + (min ? ' min' : ''); el.id = 'tokPanel';
    const res = (k, lbl, cor) => `<div class="res"><span style="color:${cor}">${lbl}</span>
      <div class="bar"><b style="width:${Math.max(0, Math.min(100, t[k + '_max'] ? t[k] / t[k + '_max'] * 100 : 0))}%;background:${cor}"></b></div>
      ${pode ? `<div class="ctl"><button data-k="${k}" data-d="-10">−10</button><button data-k="${k}" data-d="-5">−5</button><input data-k="${k}" value="${t[k]}" inputmode="numeric" aria-label="${lbl} atual"><button data-k="${k}" data-d="5">+5</button></div>` : `<b>${t[k]}/${t[k + '_max']}</b>`}</div>`;
    const ra = reacAtual(t), rm = reacMax(t);
    const mini = vis ? `<div class="tp-mini"><span><small style="color:${COR_PV}">PV</small>${t.hp}/${t.hp_max}</span>${t.aura_max > 0 ? `<span><small style="color:${COR_AURA}">AURA</small>${t.aura}/${t.aura_max}</span>` : ''}${rm != null ? `<span><small style="color:#f59e0b">REAÇÕES</small>${ra}/${rm}</span>` : ''}${Object.keys((t.principios || {}).ativos || {}).length ? `<span><small style="color:#16a34a">NEN</small>${Object.keys(t.principios.ativos).map(k => k === 'inp' ? 'IN' : k.toUpperCase()).join(' ')}</span>` : ''}</div>` : '';
    const ATKR = { contra: 'Contra-ataque', ado: 'Ataque de Oportunidade' };
    const conteudo = {
      atr: () => atributosHTML(t),
      atk: () => (S.atkReacao ? `<div class="tp-ban"><i class="ph-fill ph-shield-chevron" style="color:#f59e0b"></i> Próximo ataque: ${ATKR[S.atkReacao]} (gasta 1 Reação)<button id="tpBanX">Cancelar</button></div>` : '') + atributosHTML(t),
      reac: () => reacoesHTML(t, pode),
      nen: () => nenHTML(t, pode),
      cfg: () => `<label class="chk"><input type="checkbox" id="tpPub" ${t.barras_publicas ? 'checked' : ''}> Barras visíveis para todos</label>
        <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
        ${S.gm ? `<span style="display:inline-flex;align-items:center;gap:4px">
          <select class="input" id="tpSz" title="Largura em quadrados" style="height:34px;width:auto;font-size:13px;padding:0 26px 0 10px">${Array.from({ length: TOK_TAM_MAX }, (_, i) => i + 1).map(n => `<option value="${n}" ${tamX(t) === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <span class="tiny" style="opacity:.7">×</span>
          <select class="input" id="tpSzY" title="Altura em quadrados" style="height:34px;width:auto;font-size:13px;padding:0 26px 0 10px">${Array.from({ length: TOK_TAM_MAX }, (_, i) => i + 1).map(n => `<option value="${n}" ${tamY(t) === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
        </span>` : ''}
        <button class="btn btn-sm" id="tpAv"><i class="ph ph-image"></i> Avatar</button>
        ${t.owner === NV.user.id && (NV.perfil() || {}).avatar ? '<button class="btn btn-sm btn-ghost" id="tpG" title="Usar a foto da sua conta (Discord ou Google)">Usar minha foto</button>' : ''}</div>
        <div class="sep"></div><button class="btn btn-sm btn-ghost" id="tpDel" style="color:var(--red-6)"><i class="ph ph-trash"></i> Remover do mapa</button>`,
    };
    el.innerHTML = `<div class="tp-h" id="tpH">${t.img_url ? `<img class="av" src="${esc(t.img_url)}" alt="" draggable="false">` : `<span class="av" style="background:${esc(t.cor)};color:#fff">${esc((t.nome || '?')[0])}</span>`}
      <div class="tp-n"><b title="${esc(t.nome)}">${esc(t.nome)}</b><div class="tiny">${t.tipo === 'npc' ? 'NPC do narrador' : esc((S.perfis[t.owner] || {}).nome || 'Jogador')}</div></div>
      ${min ? '' : `<button class="tp-ic" id="tpBig" title="${S.tpAntes ? 'Voltar ao tamanho anterior' : 'Expandir a ficha'}" aria-label="${S.tpAntes ? 'Voltar ao tamanho anterior' : 'Expandir a ficha'}"><i class="ph-bold ph-corners-${S.tpAntes ? 'in' : 'out'}"></i></button>`}
      <button class="tp-ic" id="tpMin" title="${min ? 'Abrir a ficha' : 'Diminuir'}" aria-label="${min ? 'Abrir a ficha' : 'Diminuir'}"><i class="ph-bold ph-${min ? 'arrows-out-simple' : 'minus'}"></i></button>
      <button class="tp-ic" id="tpX" title="Fechar" aria-label="Fechar"><i class="ph-bold ph-x"></i></button></div>
      ${min ? mini : `<div class="tp-body">
        ${vis ? res('hp', 'PV', COR_PV) + (t.aura_max > 0 ? res('aura', 'AURA', COR_AURA) : '') + (pode ? `<div class="tiny" style="margin:-2px 0 10px">Máximo: ${t.hp_max} PV${t.aura_max > 0 ? ` · ${t.aura_max} Aura` : ''}${t.tipo === 'pj' ? ' · não altera a ficha' : ''}</div>` : '') : '<p class="hint" style="margin:0 0 10px">As barras deste token estão escondidas.</p>'}
        ${abas.length > 1 ? `<div class="tp-abas">${abas.map(([k, l, ic]) => `<button data-tpaba="${k}" class="${S.tpAba === k ? 'on' : ''}"><i class="ph-bold ph-${ic}"></i>${l}</button>`).join('')}</div>` : ''}
        ${S.tpAba ? conteudo[S.tpAba]() : ''}</div><div class="tp-rs" id="tpRs" title="Arraste para mudar o tamanho"></div>`}`;
    st.appendChild(el);
    // Posição escolhida arrastando o topo (só com mouse; no celular a janela fica embaixo).
    const fino = matchMedia('(pointer: fine)').matches;
    const posiciona = (x, y) => {
      const sw = st.clientWidth, sh = st.clientHeight;
      x = Math.max(0, Math.min(sw - el.offsetWidth, x)); y = Math.max(0, Math.min(sh - 50, y));
      el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.maxHeight = Math.max(160, sh - y - 12) + 'px';
      return { x, y };
    };
    // Tamanho escolhido no canto (ou pelo botão de expandir); diminuída, a janela usa o tamanho fixo.
    const dimensiona = (w, h) => {
      const x = el.offsetLeft, y = el.offsetTop;
      w = Math.max(300, Math.min(st.clientWidth - x - 8, w)); h = Math.max(220, Math.min(st.clientHeight - y - 8, h));
      el.style.width = w + 'px'; el.style.height = h + 'px';
      return { w, h };
    };
    if (fino && S.tpPos) S.tpPos = posiciona(S.tpPos.x, S.tpPos.y);
    if (fino && !min && S.tpTam) dimensiona(S.tpTam.w, S.tpTam.h);
    const body = $('.tp-body', el); if (body) body.scrollTop = rolou;
    const h = $('#tpH');
    h.onpointerdown = e => {
      if (!fino || e.button !== 0 || e.target.closest('button')) return;
      e.preventDefault(); h.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect(), sr = st.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
      h.onpointermove = ev => { S.tpPos = posiciona(ev.clientX - sr.left - dx, ev.clientY - sr.top - dy); };
      h.onpointerup = h.onpointercancel = () => { h.onpointermove = null; salvarTP(); };
    };
    h.ondblclick = e => { if (!e.target.closest('button')) { S.tpMin = !S.tpMin; salvarTP(); renderTokPanel(); } };

      else { S.tpAntes = { pos: S.tpPos || null, tam: S.tpTam || null }; S.tpPos = { x: 12, y: 12 }; S.tpTam = { w: Math.min(820, st.clientWidth - 24), h: st.clientHeight - 24 }; }

    const banX = $('#tpBanX'); if (banX) banX.onclick = () => { S.atkReacao = null; renderTokPanel(); };
    $$('#tokPanel [data-nen]').forEach(b => b.onclick = () => { const p = nenLista(t).find(x => x.k === b.dataset.nen); if (p) ativarPrincipio(t, p); });
    $$('#tokPanel [data-nenoff]').forEach(b => b.onclick = () => desligarPrincipio(t, b.dataset.nenoff));
    $$('#tokPanel [data-auracor]').forEach(b => b.onclick = () => salvarCorAura(t, b.dataset.auracor));
    const nc = $('#nenCor'); if (nc) nc.onchange = () => salvarCorAura(t, nc.value);
    const zt = $('#tokPanel [data-zetsu]'); if (zt) zt.onclick = () => concluirZetsu(t);
    $$('#tokPanel [data-rx]').forEach(b => b.onclick = () => { const x = REACOES.find(r => r.k === b.dataset.rx); if (x) usarReacao(t, x); });
    $$('#tokPanel [data-tpaba]').forEach(b => b.onclick = () => {

      // Busca a ficha de novo: o jogador pode ter aberto um Hatsu na ficha agora há pouco.
      if (S.tpAba === 'atk' && t.personagem_id && !bestDe(t)) NV.obter(t.personagem_id).then(f => {
        if (!f) return;
        FICHAS[t.personagem_id] = f.dados;
        const p = S.meus.find(x => x.id === t.personagem_id); if (p) p.dados = f.dados;

    $$('#tokPanel [data-arma]').forEach(b => b.onclick = () => { const w = armasDaFicha(FICHAS[t.personagem_id] || {})[+b.dataset.arma]; if (w) rolarArma(t, w, b.dataset.armaAt); });

    $$('#tokPanel [data-bacao]').forEach(b => b.onclick = () => { const m = bestDe(t), a = m && bestAcoes(m)[+b.dataset.bacao]; if (a) rolarAcaoBest(t, a); });
    $$('#tokPanel [data-rola]').forEach(b => b.onclick = () => { const r = NV.resumo(FICHAS[t.personagem_id] || {}); rolarD20(r.attrs[b.dataset.rola].mod, `Teste de ${b.dataset.rola}`, t.nome); });

      const k = b.dataset.reac, max = reacMax(t), atual = reacAtual(t);

  /* ---------- Painel lateral ---------- */
  function abas() {
    const dados = ['dados', '<i class="ph ph-dice-five"></i> Dados'];
    const chat = ['chat', `<i class="ph ph-chat-circle-dots"></i> Chat${S.naoLidas ? `<span class="badge">${S.naoLidas > 99 ? '99+' : S.naoLidas}</span>` : ''}`];
    return S.gm ? [['cenas', 'Cenas'], ['mapa', 'Mapa'], ['tokens', 'Tokens'], ['best', '<i class="ph ph-paw-print"></i> Bestiário'], ['trilha', '<i class="ph ph-music-notes"></i> Trilha'], dados, chat, ['ninja', 'Personagem'], ['grupo', 'Grupo']]
      : [dados, chat, ['ninja', 'Meu personagem'], ['tokens', 'Tokens'], ['grupo', 'Grupo']];
  }
  function renderTabs() {
    $('#tabs').innerHTML = abas().map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('');
    $$('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderSide(); });
  }
  function renderSide() {
    if (!abas().some(t => t[0] === S.tab)) S.tab = abas()[0][0];
    if (S.tab === 'chat') S.naoLidas = 0;
    renderTabs();
    P().classList.toggle('pane-chat', S.tab === 'chat');
    ({ cenas: paneCenas, mapa: paneMapa, tokens: paneTokens, best: paneBest, trilha: paneTrilha, dados: paneDados, chat: paneChat, ninja: paneNinja, grupo: paneGrupo })[S.tab]();
  }
  const P = () => $('#pane');

  async function exibir(tipo, cenaId) {
    const patch = { exibindo: tipo }; if (cenaId !== undefined) patch.cena_id = cenaId;
    const { error } = await sb.from('mesas').update(patch).eq('id', S.mesa.id);
    if (error) return toast(errMsg(error), 'warning');
    Object.assign(S.mesa, patch); S.view = null; renderBar(); renderStage(); renderSide();
    toast(tipo === 'nada' ? 'Nada ao vivo' : 'Ao vivo para os jogadores', tipo === 'nada' ? 'pause' : 'broadcast');
  }

  function paneCenas() {
    P().innerHTML = `<h4>Nova cena</h4>
      <div class="field"><input class="input" id="cnT" maxlength="80" placeholder="Título (ex.: A ponte de Tazuna)"></div>
      <label class="upl" id="cnUp"><span id="cnPrev"><i class="ph ph-image"></i></span><span id="cnLbl">Escolher imagem</span></label>
      <div class="field" style="margin-top:12px"><textarea class="input" id="cnN" placeholder="Anotações do narrador (só você vê)"></textarea></div>
      <button class="btn btn-primary" id="cnAdd" style="width:100%">Adicionar cena</button>
      <div class="sep"></div>
      <h4>Cenas da mesa</h4>
      <div class="stack" id="cnList"></div>
      ${S.mesa.exibindo !== 'nada' ? `<button class="btn btn-sm" id="stopLive" style="margin-top:14px;width:100%"><i class="ph ph-pause"></i> Parar de exibir</button>` : ''}`;
    let img = null;
    $('#cnUp').onclick = async e => { e.preventDefault(); const f = await pickFile(); if (!f) return; $('#cnLbl').textContent = 'Enviando…'; try { img = await NV.enviarImagem(f); $('#cnPrev').innerHTML = `<img src="${esc(img)}" alt="">`; $('#cnLbl').textContent = 'Imagem pronta · trocar'; } catch (err) { toast(errMsg(err), 'warning'); $('#cnLbl').textContent = 'Escolher imagem'; } };
    $('#cnAdd').onclick = async () => {
      const titulo = $('#cnT').value.trim(), notas = $('#cnN').value.trim();
      if (!titulo && !img) return toast('Dê um título ou escolha uma imagem', 'pencil-simple');
      const { data, error } = await sb.from('cenas').insert({ mesa_id: S.mesa.id, titulo, notas, imagem_url: img }).select('*').single();
      if (error) return toast(errMsg(error), 'warning');

    $$('[data-notas]').forEach(t => t.onchange = async () => { const { error } = await sb.from('cenas').update({ notas: t.value }).eq('id', t.dataset.notas); if (error) toast(errMsg(error), 'warning'); else { const c = S.cenas.find(x => x.id === t.dataset.notas); if (c) c.notas = t.value; toast('Anotação salva', 'note-pencil'); } });

  /* ---------- Mapa: painel lateral + pop-up de criação ---------- */

    const G = gridCfg();
    P().innerHTML = `<h4>Battlemap</h4>

      <div class="item" style="display:flex;align-items:center;gap:10px">
        <span class="av" style="width:40px;height:40px;border-radius:12px"><i class="ph ph-${tipo ? tipo.ico : m && m.fundo_url ? 'image' : 'map-trifold'}" style="font-size:20px"></i></span>
        <div style="flex:1;min-width:0"><b>${tipo ? esc(tipo.nome) : m && m.fundo_url ? 'Imagem própria' : 'Sem mapa ainda'}</b><div class="tiny">${m ? `${m.cols} × ${m.rows} quadrados` : 'Crie um mapa ou envie uma imagem'}</div></div>
      </div>
      <button class="btn btn-primary" id="mpCriar" style="width:100%;margin-top:12px"><i class="ph ph-sparkle"></i> ${gen ? 'Editar ou criar mapa' : 'Criar mapa'}</button>
      <button class="btn btn-ghost btn-sm" id="mpImgT" style="width:100%;margin-top:8px"><i class="ph ph-image"></i> Usar uma imagem minha</button>
      <div id="mpImg" ${IMG.aberto ? '' : 'hidden'}>
        <div class="sel2" style="margin-top:10px"><div class="field"><label class="tiny">Colunas</label><select class="input" id="mpC">${ops.map(n => `<option ${(m ? m.cols : 30) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="field"><label class="tiny">Linhas</label><select class="input" id="mpR">${ops.map(n => `<option ${(m ? m.rows : 30) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
        <label class="upl" id="mpUp"><span id="mpPrev"><i class="ph ph-map-trifold"></i></span><span id="mpLbl">Escolher imagem do mapa</span></label>
        <p class="hint">A imagem estica para cobrir o grid inteiro. Ajuste colunas e linhas para bater com o desenho.</p>
      </div>
      <div class="sep"></div>
      ${m ? `

      <div class="sel2"><div class="field"><label class="tiny">Colunas</label><select class="input" id="mpC2">${ops.map(n => `<option ${m.cols === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label class="tiny">Linhas</label><select class="input" id="mpR2">${ops.map(n => `<option ${m.rows === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <button class="btn btn-sm" id="mpProp" style="width:100%;margin-top:8px"><i class="ph ph-frame-corners"></i> Aplicar proporção</button>

      <div class="sep"></div>
      <h4>Grid</h4>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm ${G.on === false ? '' : 'btn-primary'}" id="gdOn"><i class="ph ph-grid-nine"></i> ${G.on === false ? 'Ligar' : 'Ligado'}</button>
        ${[['Fino', 1], ['Médio', 2], ['Grosso', 3]].map(([lbl, v]) => `<button class="btn btn-sm ${(G.forca || 1) === v ? 'btn-primary' : ''}" data-gw="${v}">${lbl}</button>`).join('')}
      </div>
      <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap">
        ${[['Automático', 'auto'], ['Claro', 'claro'], ['Escuro', 'escuro']].map(([lbl, v]) => `<button class="btn btn-sm ${(G.cor || 'auto') === v ? 'btn-primary' : ''}" data-gc="${v}">${lbl}</button>`).join('')}
      </div>

      <p class="hint" style="margin:10px 0 6px">Alinhar com a imagem: empurre e estique até as linhas caírem em cima do grid desenhado no mapa.</p>
      <div class="sel2"><div class="field"><label class="tiny">Deslocar ↔</label><input class="input" id="gdX" type="number" step="1" value="${G.dx || 0}"></div>
      <div class="field"><label class="tiny">Deslocar ↕</label><input class="input" id="gdY" type="number" step="1" value="${G.dy || 0}"></div></div>
      <div class="field" style="margin-top:8px"><label class="tiny">Tamanho do quadrado — ${Math.round((G.escala || 1) * 100)}%</label>

      ` : ''}
      <div class="sep"></div>
      <button class="btn btn-orange" id="mpLive" style="width:100%" ${m ? '' : 'disabled'}><i class="ph ph-broadcast"></i> Exibir battlemap para os jogadores</button>
      ${S.mesa.exibindo !== 'nada' ? `<button class="btn btn-sm" id="stopLive" style="margin-top:10px;width:100%"><i class="ph ph-pause"></i> Parar de exibir</button>` : ''}`;

    // ── Grid ───────────────────────────────────────────────────────────────
    // Grava só o pedaço `grid` do config, preservando o `gen` do gerador de mapas.
    const salvarGrid = async patch => {
      const cfg = Object.assign({}, m.config || {});
      cfg.grid = Object.assign({}, GRID_PADRAO, cfg.grid || {}, patch);

    const gOn = $('#gdOn'); if (gOn) gOn.onclick = () => salvarGrid({ on: G.on === false });
    $$('#pane [data-gw]').forEach(b => b.onclick = () => salvarGrid({ forca: +b.dataset.gw }));
    $$('#pane [data-gc]').forEach(b => b.onclick = () => salvarGrid({ cor: b.dataset.gc }));

        if (S.mapaPreview) S.mapaPreview.config = cfg;

    const gz = $('#gdZero'); if (gz) gz.onclick = () => salvarGrid(Object.assign({}, GRID_PADRAO));

    $('#mpLive').onclick = () => exibir('mapa');
    const st = $('#stopLive'); if (st) st.onclick = () => exibir('nada');
  }
  async function salvarMapa(row) {
    const { data, error } = await sb.from('mapas').upsert(Object.assign({ mesa_id: S.mesa.id }, row)).select('*').single();
    if (error) { toast(errMsg(error), 'warning'); return false; }
    S.mapa = data; S.mapaPreview = null; S.view = 'mapa';
    renderStage(); setTimeout(() => vp && centralizar(), 50);

  }

  // Pop-up: 1) urbano/natureza 2) tipo 3) planta (quando houver) 4) quanto de cada elemento 5) tamanho
  const TAMANHOS = [10, 15, 20, 25, 30, 35, 40, 50, 60];
  function abrirCriador(base) {
    const E = Object.assign({ tipo: 'floresta', cols: 30, rows: 20, seed: MapGen.novaSemente() }, base || {});
    const nz = MapGen.normaliza(E);
    E.tipo = nz.tipo; E.mix = nz.mix; E.layout = nz.layout;
    E.grupo = (MapGen.TIPOS.find(t => t.id === E.tipo) || {}).grupo || 'Natureza';
    const ov = document.createElement('div'); ov.className = 'mm-ov'; ov.id = 'mapModal';
    ov.innerHTML = `<div class="mm" role="dialog" aria-modal="true" aria-labelledby="mmT">
      <header class="mm-h"><div><div class="tiny" style="font-weight:800;letter-spacing:.12em;color:var(--orange-7)">NOVO BATTLEMAP</div><h3 id="mmT">Criar mapa</h3></div><button class="btn btn-icon btn-ghost" id="mmX" aria-label="Fechar"><i class="ph-bold ph-x"></i></button></header>
      <div class="mm-b"><div class="mm-l" id="mmL"></div><div class="mm-r"><div class="mm-prev" id="mmPrev"></div><div class="mm-leg" id="mmLeg"></div>
        <div class="mm-acts"><button class="btn btn-sm" id="mmSeed"><i class="ph ph-dice-five"></i> Outra variação</button><span class="tiny" id="mmTam"></span></div></div></div>
      <footer class="mm-f"><button class="btn btn-ghost" id="mmCanc">Cancelar</button><span style="flex:1"></span><button class="btn" id="mmSalvar">Salvar mapa</button><button class="btn btn-orange" id="mmVivo"><i class="ph ph-broadcast"></i> Salvar e exibir</button></footer>
    </div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(() => ov.classList.add('on'));
    const fechar = () => { ov.classList.remove('on'); setTimeout(() => ov.remove(), 200); removeEventListener('keydown', esc_); removeEventListener('resize', ajusta); };
    const esc_ = e => { if (e.key === 'Escape') fechar(); };
    addEventListener('keydown', esc_);
    ov.addEventListener('mousedown', e => { if (e.target === ov) fechar(); });
    $('#mmX', ov).onclick = $('#mmCanc', ov).onclick = fechar;

    const tipoInfo = () => MapGen.TIPOS.find(t => t.id === E.tipo);
    const plantas = () => Blocos.PLANTAS.filter(p => p.grupo === E.tipo);
    const trocaTipo = id => {
      E.tipo = id; E.mix = Object.assign({}, MapGen.PADRAO[id]);
      if (tipoInfo().planta) { E.layout = plantas()[0].id; Object.assign(E, MapGen.tamanhoPlanta(E.layout)); } else E.layout = null;
      E.seed = MapGen.novaSemente();
    };
    const slider = (k, v) => {
      const el = MapGen.ELEMENTOS[k];
      return `<div class="sl"><div class="sl-l"><b>${el.nome}</b><small>${el.desc}</small></div>
        <div class="sl-t"><div class="sl-n">${[0, 20, 40, 60, 80, 100].map(n => `<span>${n}</span>`).join('')}</div>
        <input type="range" min="0" max="100" step="20" value="${v}" data-k="${k}" aria-label="${el.nome}" style="--p:${v}%"></div></div>`;
    };
    function esquerda() {
      const t = tipoInfo(), vert = MapGen.VERTICAL[E.tipo] || [];
      const chaves = Object.keys(MapGen.PADRAO[E.tipo]).filter(k => !vert.includes(k));
      let h = `<div class="mm-step"><span>1</span>Ambiente</div>
        <div class="modesw">${['Urbano', 'Natureza'].map(g => `<button data-g="${g}" class="${E.grupo === g ? 'on' : ''}"><i class="ph ph-${g === 'Urbano' ? 'buildings' : 'tree-evergreen'}"></i> ${g}</button>`).join('')}</div>
        <div class="mm-step"><span>2</span>Tipo de mapa</div>
        <div class="mm-chips">${MapGen.TIPOS.filter(x => x.grupo === E.grupo).map(x => `<button data-t="${x.id}" class="${E.tipo === x.id ? 'on' : ''}" title="${esc(x.desc)}"><i class="ph ph-${x.ico}"></i>${x.nome}</button>`).join('')}</div>
        <p class="hint" style="margin-top:6px">${esc(t.desc)}</p>`;
      let n = 3;
      if (t.planta) {
        h += `<div class="mm-step"><span>${n++}</span>Planta</div><div class="mm-plantas">${plantas().map(p => `<button data-l="${p.id}" class="${E.layout === p.id ? 'on' : ''}"><div class="mini">${MapGen.miniPlanta(p.id)}</div><b>${esc(p.nome)}</b><small>${p.porte} · ${p.w * 1.5} × ${p.h * 1.5} m</small></button>`).join('')}</div>`;
      }
      if (vert.length) {
        h += `<div class="mm-step"><span>${n++}</span>O que tem na água</div><div class="mm-vert">${vert.map(k => { const on = E.mix[k] > 0, el = MapGen.ELEMENTOS[k]; return `<div class="vt ${on ? 'on' : ''}"><label class="chk"><input type="checkbox" data-v="${k}" ${on ? 'checked' : ''}><span><b>${el.nome}</b><small>${el.desc}</small></span></label>${on ? slider(k, E.mix[k]) : ''}</div>`; }).join('')}</div>`;
      }
      h += `<div class="mm-step"><span>${n++}</span>Quanto de cada elemento</div><p class="hint" style="margin:-4px 0 10px">0% tira o elemento do mapa.</p>${chaves.map(k => slider(k, E.mix[k])).join('')}`;
      h += `<div class="mm-step"><span>${n++}</span>Tamanho</div>${t.planta ? `<p class="hint">Ajustado à planta: ${E.cols} × ${E.rows} quadrados (casa + jardim em volta).</p>` : `<div class="sel2"><div class="field"><label class="tiny">Colunas</label><select class="input" id="mmC">${TAMANHOS.map(v => `<option ${E.cols === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div class="field"><label class="tiny">Linhas</label><select class="input" id="mmR">${TAMANHOS.map(v => `<option ${E.rows === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>`}`;
      $('#mmL', ov).innerHTML = h;
      $$('[data-g]', ov).forEach(b => b.onclick = () => { if (E.grupo === b.dataset.g) return; E.grupo = b.dataset.g; trocaTipo(MapGen.TIPOS.find(x => x.grupo === E.grupo).id); esquerda(); previa(); });
      $$('[data-t]', ov).forEach(b => b.onclick = () => { trocaTipo(b.dataset.t); esquerda(); previa(); });
      $$('[data-l]', ov).forEach(b => b.onclick = () => { E.layout = b.dataset.l; Object.assign(E, MapGen.tamanhoPlanta(E.layout)); $$('[data-l]', ov).forEach(x => x.classList.toggle('on', x === b)); esquerda(); previa(); });
      $$('#mmL input[type=range]', ov).forEach(i => i.oninput = () => { i.style.setProperty('--p', i.value + '%'); E.mix[i.dataset.k] = +i.value; previaDepois(); });
      $$('[data-v]', ov).forEach(c => c.onchange = () => { E.mix[c.dataset.v] = c.checked ? 40 : 0; esquerda(); previa(); });
      const mc = $('#mmC', ov), mr = $('#mmR', ov);
      if (mc) mc.onchange = () => { E.cols = +mc.value; previa(); };
      if (mr) mr.onchange = () => { E.rows = +mr.value; previa(); };
    }
    let tPrev = null;
    const previaDepois = () => { clearTimeout(tPrev); tPrev = setTimeout(previa, 110); };
    function ajusta() {
      const box = $('#mmPrev', ov); if (!box) return;
      const w = box.clientWidth, k = w / (E.cols * CELL), inner = box.firstElementChild;
      box.style.height = Math.min(E.rows * CELL * k, innerHeight * .62) + 'px';
      if (inner) { const kk = Math.min(k, box.clientHeight / (E.rows * CELL)); inner.style.transform = `translate(${(w - E.cols * CELL * kk) / 2}px, 0) scale(${kk})`; }
    }
    function previa() {
      const gen = { tipo: E.tipo, seed: E.seed, mix: E.mix, layout: E.layout };
      const svg = MapGen.svg(gen, E.cols, E.rows);
      $('#mmPrev', ov).innerHTML = `<div class="mm-cv" style="width:${E.cols * CELL}px;height:${E.rows * CELL}px;background:${MapGen.fundo(E.tipo)}">${svg}<div class="mm-grid"></div></div>`;
      $('#mmLeg', ov).innerHTML = MapGen.legenda(E.tipo).map(l => `<span><i style="--c:${l.cor};${l.fundo ? `background:${l.fundo}` : ''}"></i>${l.nome}</span>`).join('');
      $('#mmTam', ov).textContent = `${E.cols} × ${E.rows} quadrados · ${f1m(E.cols * 1.5)} × ${f1m(E.rows * 1.5)} m`;
      ajusta();
    }
    const f1m = v => v.toLocaleString('pt-BR');
    addEventListener('resize', ajusta);
    $('#mmSeed', ov).onclick = () => { E.seed = MapGen.novaSemente(); previa(); };
    const salvar = async vivo => {
      if (S.mapa && !confirm('Substituir o battlemap atual?')) return;
      const ok = await salvarMapa({ cols: E.cols, rows: E.rows, fundo_url: null, config: { gen: { tipo: E.tipo, seed: E.seed, mix: E.mix, layout: E.layout } } });
      if (!ok) return;
      fechar(); paneMapa();
      if (vivo) exibir('mapa'); else toast('Battlemap salvo', 'map-trifold');
    };
    $('#mmSalvar', ov).onclick = () => salvar(false);
    $('#mmVivo', ov).onclick = () => salvar(true);
    esquerda(); previa();
  }

  // Procura, a partir do centro, um lugar onde caiba um token de "tam"×"tam" sem
  // encostar em nenhum outro (cada token ocupa todos os quadrados do seu tamanho).
  function centroLivre(tam = 1) {
    const m = S.mapa || { cols: 30, rows: 30 };
    const ocup = new Set();
    Object.values(S.tokens).forEach(t => { const n = t.tamanho || 1, x0 = Math.round(t.x), y0 = Math.round(t.y); for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) ocup.add(`${x0 + a},${y0 + b}`); });
    const cabe = (x, y) => { for (let a = 0; a < tam; a++) for (let b = 0; b < tam; b++) if (ocup.has(`${x + a},${y + b}`)) return false; return true; };
    const cx = Math.floor(m.cols / 2), cy = Math.floor(m.rows / 2);
    for (let r = 0; r < 16; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (cabe(cx + dx, cy + dy)) return { x: cx + dx, y: cy + dy };
    return { x: cx, y: cy };
  }

  /* ---------- Trilha sonora (YouTube) ----------
     Fica em mesas.trilha = { lista: [{ id, t }], atual: { id, tocando, pos, em, loop } }.
     Só o narrador escreve. "pos" é a posição (s) no instante "em" (ms); cada aparelho
     calcula onde a música deve estar e se ajusta, então todos ouvem a mesma parte.
     Volume e mudo são de cada pessoa (ficam no navegador). */
  const temTrilha = () => !!(S.mesa && 'trilha' in S.mesa);
  const trilha = () => (S.mesa && S.mesa.trilha) || {};
  // Aceita watch?v=, youtu.be/, shorts/, embed/, live/, music.youtube.com e o id puro.
  function ytId(txt) {
    const s = String(txt || '').trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtu\.be\/|[?&]v=|\/(?:embed|shorts|live|v)\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  const SOM = { yt: null, pronto: false, id: null, bloqueado: false, erro: null, vol: 50, mudo: false, min: false };
  try { const v = JSON.parse(localStorage.getItem('hxh-mesa-som') || 'null'); if (v) Object.assign(SOM, { vol: v.vol == null ? 50 : v.vol, mudo: !!v.mudo, min: !!v.min }); } catch (e) {}
  const salvarSomLocal = () => { try { localStorage.setItem('hxh-mesa-som', JSON.stringify({ vol: SOM.vol, mudo: SOM.mudo, min: SOM.min })); } catch (e) {} };
  // Posição em que a faixa deve estar agora. Com "repetir", dá a volta na duração.
  function posAgora(a) {
    if (!a) return 0;
    let p = (a.pos || 0) + (a.tocando ? Math.max(0, (Date.now() - (a.em || Date.now())) / 1000) : 0);
    const d = SOM.pronto && SOM.yt.getDuration ? SOM.yt.getDuration() : 0;
    if (d > 1 && p >= d) p = a.loop ? p % d : d - 0.5;
    return p;
  }
  let ytApi = null;
  function carregarYT() {
    if (!ytApi) ytApi = new Promise(res => {
      if (window.YT && YT.Player) return res();
      const ant = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (ant) ant(); res(); };
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    });
    return ytApi;
  }
  function tituloFaixa(id) {
    const f = (trilha().lista || []).find(x => x.id === id);
    if (f && f.t) return f.t;
    try { return (SOM.pronto && SOM.yt.getVideoData().title) || 'Trilha'; } catch (e) { return 'Trilha'; }
  }
  async function aplicarTrilha() {
    const box = $('#som'); if (!box) return;
    const a = trilha().atual;
    if (!temTrilha() || !a || !a.id) {
      box.hidden = true;
      if (SOM.pronto) SOM.yt.stopVideo();
      SOM.id = null; SOM.bloqueado = false; SOM.erro = null;
      return;
    }
    box.hidden = false; renderSom();
    if (SOM.criando && !SOM.pronto) return;   // o onReady aplica o estado mais recente
    await carregarYT();
    if (!SOM.yt) {
      SOM.criando = true; SOM.id = a.id;
      SOM.yt = new YT.Player('somYT', {
        width: '100%', height: '100%', videoId: a.id,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1, rel: 0, iv_load_policy: 3, start: Math.floor(posAgora(a)) },
        events: { onReady: () => { SOM.pronto = true; aplicarVolume(); sincronizar(true); }, onStateChange: estadoYT, onError: erroYT },
      });
      return;
    }
    if (SOM.pronto) sincronizar();
  }
  function sincronizar(forcar) {
    const a = trilha().atual; if (!a || !SOM.pronto) return;
    if (SOM.id !== a.id) {
      SOM.id = a.id; SOM.erro = null;
      if (a.tocando) SOM.yt.loadVideoById({ videoId: a.id, startSeconds: posAgora(a) }); else SOM.yt.cueVideoById({ videoId: a.id, startSeconds: posAgora(a) });
      if (a.tocando) vigiarBloqueio();
      return renderSom();
    }
    const p = posAgora(a), cur = SOM.yt.getCurrentTime ? SOM.yt.getCurrentTime() : 0;
    if (forcar || Math.abs(cur - p) > 3) SOM.yt.seekTo(p, true);   // tolera 3 s de diferença entre aparelhos
    if (a.tocando) { SOM.yt.playVideo(); vigiarBloqueio(); } else SOM.yt.pauseVideo();
    renderSom();
  }
  // O navegador pode barrar som antes de a pessoa interagir com a página.
  // Se não começou a tocar em 2 s, mostra o botão "Tocar" (um toque libera).
  let vigia = null;
  function vigiarBloqueio() {
    clearTimeout(vigia);
    vigia = setTimeout(() => {
      const a = trilha().atual; if (!a || !a.tocando || !SOM.pronto) return;
      const st = SOM.yt.getPlayerState();
      SOM.bloqueado = st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING && !SOM.erro;
      renderSom();
    }, 2000);
  }
  function estadoYT(e) {
    const a = trilha().atual || {};
    if (e.data === YT.PlayerState.PLAYING) { if (SOM.bloqueado) { SOM.bloqueado = false; } renderSom(); }
    if (e.data === YT.PlayerState.ENDED) {
      if (a.loop) { SOM.yt.seekTo(0, true); SOM.yt.playVideo(); }
      else if (S.gm) proximaFaixa(true);   // só o narrador avança a playlist
    }
  }
  function erroYT(e) {
    SOM.erro = e.data === 101 || e.data === 150 ? 'O dono deste vídeo não deixa tocar fora do YouTube.' : e.data === 100 ? 'Vídeo removido ou privado.' : 'Não deu para tocar este vídeo.';
    SOM.bloqueado = false; renderSom();
  }
  function aplicarVolume() {
    if (!SOM.pronto) return;
