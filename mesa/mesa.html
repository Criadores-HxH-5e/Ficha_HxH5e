<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HxH5e · Mesa</title>
<meta name="description" content="Mesa virtual do HxH5e: cenas, battlemap ao vivo e tokens com PV e Aura.">
<link rel="stylesheet" href="assets/hxh-mesa.css">
<style>
  html, body { height: 100%; }
  body.in-mesa { overflow: hidden; }
  .toasts { position: fixed; z-index: 300; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: var(--r-pill); background: #1b1d2a; color: #fff; font-weight: 700; font-size: 14px; box-shadow: var(--sh-3); animation: rise .4s var(--ease-spring) both; }

  /* ---------- Lobby ---------- */
  .lobby { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }
  .topbar { display: flex; align-items: center; gap: 14px; height: 72px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 18px/1 var(--f-display); color: var(--text); }
  .brand:hover { color: var(--text); }
  .brand-mark { width: 36px; height: 36px; border-radius: 12px; background: var(--grad-orange); display: grid; place-items: center; box-shadow: var(--sh-orange); flex: none; }
  .brand-mark svg { width: 24px; height: 24px; color: #fff; animation: spin 14s linear infinite; }
  .topbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .me { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border); font-weight: 800; font-size: 13px; }
  .av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--bg-2); display: inline-grid; place-items: center; font: 700 13px/1 var(--f-display); color: var(--text-2); flex: none; }
  .lob-head { margin: 24px 0 24px; }
  .lob-head .kicker { font: 700 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--orange-7); }
  .lob-head h1 { font-size: clamp(32px, 4.4vw, 46px); margin-top: 8px; }
  .lob-head p { color: var(--text-2); font-size: 17px; margin: 10px 0 0; max-width: 620px; }
  .lob-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  .lob-card { padding: 22px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh-1); }
  .lob-card h3 { font-size: 20px; margin-bottom: 4px; }
  .lob-card p { color: var(--text-2); font-size: 14px; margin: 0 0 14px; }
  .lob-card .row { display: flex; gap: 8px; }
  .lob-card .row .input { height: 46px; }
  .lob-card.gm { background: linear-gradient(135deg, var(--orange-1), var(--surface)); border-color: var(--orange-2); }
  @media (max-width: 760px) { .lob-actions { grid-template-columns: 1fr; } }
  .mesas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .mcard { display: block; padding: 20px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border); color: var(--text); transition: transform var(--t-med) var(--ease-out), box-shadow var(--t-med); position: relative; overflow: hidden; }
  .mcard:hover { transform: translateY(-3px); box-shadow: var(--sh-3); color: var(--text); }
  .mcard .k { position: absolute; right: -6px; bottom: -26px; font-size: 96px; opacity: .07; }
  .mcard h3 { font-size: 20px; }
  .mcard .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .gate { padding: 40px; border-radius: var(--r-xl); background: var(--grad-hero); color: #fff; text-align: center; }
  .gate h2 { color: #fff; }
  .gate p { color: rgba(255,255,255,.92); }
  .gbtn { display: inline-flex; align-items: center; gap: 12px; height: 50px; padding: 0 22px; border-radius: var(--r-pill); background: #fff; color: #1f1f1f; border: 0; font: 700 16px/1 var(--f-display); cursor: pointer; margin-top: 10px; }

  /* ---------- Mesa ---------- */
  .app { position: fixed; inset: 0; z-index: 1; display: grid; grid-template-rows: 60px minmax(0, 1fr); grid-template-columns: 1fr var(--side-w, 360px); background: var(--bg); }
  /* alça para redimensionar a barra lateral (só desktop) */
  .side-grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 5; touch-action: none; }
  .side-grip::after { content: ''; position: absolute; left: 3px; top: 50%; width: 3px; height: 44px; transform: translateY(-50%); border-radius: 3px; background: var(--border-2); transition: background var(--t-fast), height var(--t-fast); }
  .side-grip:hover::after, body.resizing .side-grip::after { background: var(--blue-6); height: 72px; }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  .app.side-off { grid-template-columns: 1fr 0; }
  .mbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border); min-width: 0; }
  .mbar .title { font: 700 18px/1.1 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .role { font: 800 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: var(--r-pill); background: var(--orange-1); color: var(--orange-8); border: 1px solid var(--orange-2); white-space: nowrap; }
  .role.pl { background: var(--blue-1); color: var(--blue-7); border-color: var(--blue-2); }
  .live { display: inline-flex; align-items: center; gap: 6px; font: 800 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--red-6); white-space: nowrap; }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--red-6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  /* O grupo da direita (CONVITE, largura e o botão "Painel") NÃO encolhe. Sem isto,
     numa tela estreita o .title encolhe até o limite, .role e .live são nowrap e não
     cedem, e quem sobrava espremido era o .right — o botão "Painel" saía da tela.
     Mesmo flex:none que .mbar .sair já usa. */
  .mbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  /* Com a direita fixa, quem cede espaço é o selo "Ao vivo": ele corta no fim em vez
     de empurrar o botão para fora. O título já encolhia por conta própria. */
  .mbar #liveTag { min-width: 0; overflow: hidden; }
  .mbar #liveTag .live { max-width: 100%; }
  .faces { display: flex; }
  .faces .av { width: 30px; height: 30px; border: 2px solid var(--surface); margin-left: -8px; }
  .faces .av:first-child { margin-left: 0; }
  .code { font: 700 13px/1 var(--f-display); letter-spacing: .12em; padding: 8px 12px; border-radius: var(--r-pill); background: var(--bg-2); border: 1px dashed var(--border-2); cursor: pointer; white-space: nowrap; }
  .code:hover { border-color: var(--blue-5); color: var(--blue-6); }
  @media (max-width: 860px) { .faces, .mbar .hide-sm { display: none; } }

  .stage { position: relative; overflow: hidden; background: #171925; min-width: 0; }
  .side { position: relative; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: visible; }
  .side > .pane, .side > .tabs { min-width: 0; }
  .app.side-off .side { display: none; }
  .tabs { display: flex; gap: 2px; padding: 8px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex: none; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 9px 8px; border-radius: var(--r-md); font: 700 13px/1 var(--f-body); color: var(--text-2); cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: var(--blue-1); color: var(--blue-7); }
  .pane { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  /* chat: lista rola sozinha, campo de mensagem fica preso embaixo */
  .pane.pane-chat { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 0; }
  .chat-head h4 { margin: 0; }
  .chat-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .chat-vazio { margin: auto; text-align: center; color: var(--text-3); font-size: 14px; padding: 20px; }
  .msg { display: grid; grid-template-columns: 30px 1fr; gap: 0 10px; padding: 6px 8px; border-radius: var(--r-md); }
  .msg.mine { background: var(--blue-1); }
  .msg.cont { padding-top: 0; }
  .msg .av { width: 30px; height: 30px; }
  .msg-h { display: flex; align-items: baseline; gap: 8px; font: 700 15px/1.2 var(--f-body); min-width: 0; }
  .msg-h b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-h time { font-size: 11px; font-weight: 600; color: var(--text-3); }
  .msg-h .gm { font: 800 9px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 6px; background: var(--orange-1); color: var(--orange-7); border: 1px solid var(--orange-2); }
  .msg-t { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.35; color: var(--text); }
  /* Menção: @nome vira um selo. O de quem foi mencionado puxa a cor de destaque,
     e a mensagem inteira ganha uma barra à esquerda para ser achada na rolagem. */
  .mencao { font-weight: 700; color: var(--blue-6); background: var(--blue-1); border-radius: 6px; padding: 0 4px; }
  .mencao.eu { color: var(--orange-7); background: var(--orange-1); }
  .msg.me-marcou { background: var(--orange-1); box-shadow: inset 3px 0 0 var(--orange-7); }
  /* Lista de nomes que abre ao digitar "@". Sem ela o jogador teria que acertar
     o nome de cor, acento e tudo. */
  .mencao-lista { position: absolute; left: 12px; right: 12px; bottom: 100%; margin-bottom: 6px; z-index: 20;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--sh-3); overflow: hidden; }
  .mencao-lista[hidden] { display: none; }
  .mencao-lista button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; background: transparent;
    color: var(--text); font: 600 14px/1.2 var(--f-body); text-align: left; cursor: pointer; }
  .mencao-lista button:hover, .mencao-lista button.on { background: var(--blue-1); color: var(--blue-6); }
  .chat-form { position: relative; }
  .chat-list .roll { margin: 4px 0; }
  .chat-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); flex: none; }
  .chat-form .input { height: 42px; }
  .chat-form .btn { width: 42px; padding: 0; flex: none; }
  .tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red-6); color: #fff; font: 800 11px/1 var(--f-body); }
  .pane h4 { font-size: 15px; margin: 4px 0 10px; }
  .pane .hint { font-size: 13px; color: var(--text-3); margin: 6px 0 0; }
  .pane .field { margin-bottom: 12px; }
  .pane .input { height: 42px; font-size: 14px; }
  .pane textarea.input { min-height: 70px; }
  .stack { display: grid; gap: 10px; }
  .sep { height: 1px; background: var(--border); margin: 18px 0; }
  .item { padding: 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2); }
  .item.on { border-color: var(--red-6); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red-6) 14%, transparent); }
  .item .thumb { width: 100%; aspect-ratio: 16/9; border-radius: 10px; background: var(--bg-2) center/cover; margin-bottom: 10px; }
  .item .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .item b { font-family: var(--f-display); }
  .upl { display: flex; align-items: center; gap: 10px; padding: 10px; border: 2px dashed var(--border-2); border-radius: var(--r-md); cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text-2); }
  .upl:hover { border-color: var(--blue-5); color: var(--blue-6); }
  .upl img { width: 52px; height: 36px; object-fit: cover; border-radius: 6px; }
  .modesw { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-pill); background: var(--bg-2); border: 1px solid var(--border); margin: 4px 0 4px; }
  .modesw button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: var(--r-pill); font: 700 13px/1 var(--f-body); color: var(--text-2); cursor: pointer; }
  .modesw button.on { background: var(--surface); color: var(--blue-7); box-shadow: var(--sh-1); }
  .geo { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .geo button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: var(--r-md); border: 2px solid var(--border); background: var(--surface); font: 700 12px/1.1 var(--f-body); color: var(--text-2); cursor: pointer; transition: border-color var(--t-fast), transform var(--t-fast) var(--ease-spring); }
  .geo button span { font-size: 22px; }
  .geo button:hover { border-color: var(--blue-4); transform: translateY(-1px); }
  .geo button.on { border-color: var(--blue-6); color: var(--blue-7); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue-6) 15%, transparent); }
  .dens { display: flex; align-items: center; gap: 8px; font: 700 12px/1 var(--f-body); color: var(--text-3); }
  .dens button { width: var(--s); height: var(--s); border-radius: 50%; border: 2px solid var(--border-2); background: var(--surface); cursor: pointer; padding: 0; transition: transform var(--t-fast) var(--ease-spring), background var(--t-fast); }
  .dens button:hover { transform: scale(1.2); }
  .dens button.on { background: var(--blue-6); border-color: var(--blue-6); }
  .mm-ov { position: fixed; inset: 0; z-index: 200; background: rgba(10,12,22,.55); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; opacity: 0; transition: opacity .2s; }
  .mm-ov.on { opacity: 1; }
  .mm { width: min(1180px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: var(--sh-3); overflow: hidden; transform: translateY(10px); transition: transform .25s var(--ease-out); }
  .mm-ov.on .mm { transform: none; }
  .mm-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .mm-h h3 { font-size: 22px; margin-top: 4px; }
  .mm-b { flex: 1; min-height: 0; display: grid; grid-template-columns: 430px 1fr; }
  .mm-l { overflow-y: auto; padding: 16px 20px 24px; border-right: 1px solid var(--border); }
  .mm-r { padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--bg-2); }
  .mm-step { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; font: 700 15px/1 var(--f-display); }
  .mm-step:first-child { margin-top: 0; }
  .mm-step span { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--orange-6, #ff7a00); color: #fff; font-size: 12px; }
  .mm-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .mm-chips button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: var(--r-pill); border: 1.5px solid var(--border-2); background: var(--surface); font: 700 13px/1 var(--f-body); color: var(--text-2); cursor: pointer; }
  .mm-chips button i { font-size: 16px; }
  .mm-chips button:hover { border-color: var(--blue-4); color: var(--text); }
  .mm-chips button.on { border-color: var(--blue-6); background: var(--blue-1); color: var(--blue-7); }
  .mm-plantas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .mm-plantas button { display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; color: var(--text); }
  .mm-plantas button.on { border-color: var(--blue-6); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue-6) 16%, transparent); }
  .mm-plantas .mini { aspect-ratio: 4 / 3; border-radius: 9px; background: #fff; display: grid; place-items: center; overflow: hidden; padding: 6px; }
  .mm-plantas .mini svg { width: 100%; height: 100%; }
  .mm-plantas b { font: 700 13px/1.2 var(--f-display); }
  .mm-plantas small { font-size: 11.5px; color: var(--text-3); }
  .mm-vert { display: grid; gap: 8px; }
  .vt { padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); }
  .vt.on { border-color: var(--blue-5); }
  .vt .chk span { display: flex; flex-direction: column; }
  .vt .chk small { font-weight: 600; color: var(--text-3); font-size: 12px; }
  .vt .sl { margin: 8px 0 0; grid-template-columns: 1fr; }
  .vt .sl-l { display: none; }
  .sl { display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: end; margin-bottom: 12px; }
  .sl-l { text-align: right; padding-bottom: 2px; }
  .sl-l b { display: block; font: 700 14px/1.15 var(--f-display); }
  .sl-l small { display: block; font-size: 11.5px; color: var(--text-3); line-height: 1.25; }
  .sl-n { display: flex; justify-content: space-between; font: 700 10px/1 var(--f-body); color: var(--text-3); margin: 0 1px 6px; }
  .sl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 6px; margin: 6px 0; cursor: pointer;
    background: linear-gradient(90deg, #ff8a1f var(--p), color-mix(in srgb, var(--text) 16%, transparent) var(--p)); }
  .sl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ff8a1f; border: 0; box-shadow: 0 0 0 4px color-mix(in srgb, #ff8a1f 25%, transparent); }
  .sl input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #ff8a1f; border: 0; }
  .mm-prev { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #171925; box-shadow: inset 0 0 0 1px var(--border); }
  .mm-cv { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .mm-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(31,45,82,.11) 1px, transparent 1px), linear-gradient(90deg, rgba(31,45,82,.11) 1px, transparent 1px); background-size: 64px 64px; pointer-events: none; }
  .mm-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 700 12px/1.2 var(--f-body); color: var(--text-2); }
  .mm-leg span { display: inline-flex; align-items: center; gap: 6px; }
  .mm-leg i { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, #f4f2ec); }
  .mm-acts { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .mm-f { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
  @media (max-width: 900px) {
    .mm-ov { padding: 0; }
    .mm { max-height: 100vh; height: 100%; border-radius: 0; }
    .mm-b { grid-template-columns: 1fr; overflow-y: auto; }
    .mm-l { overflow: visible; border-right: 0; order: 2; }
    .mm-r { order: 1; }
    .sl { grid-template-columns: 1fr; gap: 4px; } .sl-l { text-align: left; }
  }
  .prevnote { margin-top: 12px; padding: 10px 12px; border-radius: var(--r-md); background: var(--orange-1); border: 1px solid var(--orange-2); font-size: 13px; font-weight: 700; color: var(--orange-8); }
  .sel2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* Vale nos dois formatos. No celular ele abre e fecha a gaveta (side-open); no
     desktop recolhe a coluna da direita (side-off) — que o CSS já sabia fazer, mas
     que nenhum botão acionava: o painel do desktop trava em 300px no aplicarLargura,
     então não havia como ver o mapa inteiro. */
  .side-toggle { display: inline-flex; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 56px minmax(0, 1fr); }
    .side-grip, #sideWide { display: none; }
    .side { position: fixed; left: 0; right: 0; bottom: 0; height: 62vh; z-index: 40; border-left: 0; border-top: 1px solid var(--border); border-radius: 22px 22px 0 0; box-shadow: var(--sh-3); transform: translateY(100%); transition: transform var(--t-med) var(--ease-out); }
    .app.side-open .side { transform: none; }
    .app.side-off .side { display: flex; }
    .side-toggle { display: inline-flex; }
  }

  /* palco: espera e cena */
  .wait { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #e9e6df; padding: 24px; }
  .wait svg { width: 90px; height: 90px; color: var(--orange-6); animation: spin 8s linear infinite; opacity: .9; }
  .wait h2 { color: #fff; margin-top: 16px; font-size: 28px; }
  .wait p { color: #b7b9c9; margin-top: 6px; }
  .scene { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
  .scene img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 14px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); animation: rise .5s var(--ease-out); }

  /* battlemap */
  .vp { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
    --g: 64px; --gx: 0px; --gy: 0px; --gw: 1px; --ga: .05;
    background-color: #171925;
    /* A espessura e a opacidade viraram variáveis: o traço era fixo em 1px e .05,
       e num mapa claro ele sumia, enquanto num mapa escuro atrapalhava. */
    background-image: linear-gradient(rgba(255,255,255,var(--ga)) var(--gw), transparent var(--gw)), linear-gradient(90deg, rgba(255,255,255,var(--ga)) var(--gw), transparent var(--gw));
    background-size: var(--g) var(--g); background-position: var(--gx) var(--gy); }
  .vp.sem-grid { background-image: none; }
  .vp.panning, .vp.grab.panning { cursor: grabbing; }
  .vp.grab, .vp.grab .tok { cursor: grab; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .area { position: absolute; left: 0; top: 0; border-radius: 6px; box-shadow: 0 0 0 2px rgba(255,255,255,.12), 0 40px 120px -30px rgba(0,0,0,.8);
    background: #3b4a3a center / 100% 100% no-repeat; }
  .area.blank { background-color: #2d3548; background-image: radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.06), transparent 60%); }
  /* ── A camada de grid que fica SOBRE o mapa ────────────────────────────────
     Esta é a que o jogador vê em cima da imagem. Ela existia, mas com tudo fixo:
     64px, traço de 1px e preto a 28% — que num mapa escuro some. Os controles do
     painel mexiam só no fundo do .vp, que fica ATRÁS da imagem, então ligar,
     desligar ou engrossar não mudava nada sobre o mapa.
     Agora ela lê as mesmas variáveis, e a cor virou escolha: preto para mapas
     claros, branco para mapas escuros.
     Aqui NÃO entra o zoom: a .gl vive dentro do #world, que já está escalado. */
  .area .gl { position: absolute; inset: 0; pointer-events: none;
    --gl-c: rgba(0,0,0,.28); --gl-w: 1px; --gl-s: 64px; --gl-x: 0px; --gl-y: 0px;
    background-image: linear-gradient(var(--gl-c) var(--gl-w), transparent var(--gl-w)), linear-gradient(90deg, var(--gl-c) var(--gl-w), transparent var(--gl-w));
    background-size: var(--gl-s) var(--gl-s); background-position: var(--gl-x) var(--gl-y); }
  .area.sem-grid .gl { background-image: none; }
  .area.blank .gl { --gl-c: rgba(255,255,255,.09); }
  .area.gen { box-shadow: 0 0 0 1px rgba(31,45,82,.25), 0 40px 120px -30px rgba(0,0,0,.8); }
  .area.gen .gl { --gl-c: rgba(31,45,82,.11); }
  .mlegend { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; max-width: min(760px, calc(100% - 140px)); padding: 7px 14px; border-radius: var(--r-pill); background: rgba(247,245,240,.92); backdrop-filter: blur(8px); color: #3b3f52; box-shadow: 0 6px 20px -8px rgba(0,0,0,.5); font: 700 11px/1.2 var(--f-body); pointer-events: none; }
  .mlegend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mlegend i { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
  @media (max-width: 860px) { .mlegend { top: 56px; max-width: calc(100% - 24px); border-radius: 14px; } }
  .tok { position: absolute; touch-action: none; user-select: none; }
  /* Token esticado (6×2, 1×3…) vira retângulo arredondado: uma elipse muito
     comprida fica estranha e não sugere o que a peça é — um muro, um veículo,
     uma serpente. O quadrado continua redondo, como sempre foi. */
  .tok.retang .disc { border-radius: 18px; }
  .tok .disc { position: absolute; inset: 6%; border-radius: 50%; overflow: hidden; background: var(--c); box-shadow: 0 0 0 3px var(--c), 0 0 0 5px rgba(0,0,0,.45), 0 8px 18px rgba(0,0,0,.5); display: grid; place-items: center; color: #fff; font: 700 22px/1 var(--f-display); transition: box-shadow var(--t-fast); }
  .tok .disc img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  .tok .lbl { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 2px); white-space: nowrap; padding: 2px 8px; border-radius: 999px; background: rgba(15,17,30,.82); color: #fff; font: 700 11px/1.3 var(--f-body); pointer-events: none; }
  /* "Abrir ficha": aparece ao tocar no token. Fica do mesmo tamanho em qualquer zoom

  .tok-abrir { position: absolute; left: 50%; top: calc(100% + 22px); z-index: 60; transform: translateX(-50%) scale(calc(1 / var(--z, 1))); transform-origin: 50% 0;
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 0; white-space: nowrap; cursor: pointer;
    background: #00ff9d; color: #04120b; font: 700 12px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 6px 18px rgba(0,0,0,.55); animation: rise .2s var(--ease-out); touch-action: manipulation; }
  .tok-abrir:hover { background: #33ffb1; }
  .tok .bars { position: absolute; left: 8%; right: 8%; bottom: 100%; transform: translateY(-4px); display: grid; gap: 2px; pointer-events: none; }
  .tok .bars i { display: block; height: 7px; border-radius: 4px; background: rgba(0,0,0,.6); overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .tok .bars b { display: block; height: 100%; border-radius: 4px; transition: width var(--t-med) var(--ease-out); }
  .tok .bars .hp b { background: linear-gradient(90deg, #ff6b6b, #e5383b); }
  .tok .bars .au b { background: linear-gradient(90deg, #67e8f9, #00b8d4); }
  .roll-d i.x { opacity: .35; text-decoration: line-through; }
  .modo { display: flex; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--bg-2); border: 1px solid var(--border); margin-top: 10px; }
  .modo button { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: var(--r-sm); font: 700 12px/1 var(--f-body); color: var(--text-2); cursor: pointer; }
  .modo button.on { background: var(--blue-1); color: var(--blue-7); box-shadow: inset 0 0 0 1px var(--blue-3); }
  .tok .bars.priv::after { content: '\e224'; font-family: 'Phosphor-Fill'; position: absolute; right: -16px; top: -4px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .tok.npc .lbl { background: rgba(140,20,20,.85); }
  .tools { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 4px; padding: 4px; border-radius: var(--r-pill); background: rgba(15,17,30,.78); backdrop-filter: blur(8px); }
  .tools button { border: 0; background: transparent; color: #d9dbe6; padding: 8px 14px; border-radius: var(--r-pill); font: 700 13px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
  .tools button:hover { background: rgba(255,255,255,.1); }
  .tools button.on { background: #00ff9d; color: #04120b; }
  .vp.ruler, .vp.ruler .tok { cursor: crosshair; }
  .ovl { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 40; }
  .measure small { font-weight: 700; opacity: .8; }
  .dice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .die { position: relative; aspect-ratio: 1; border: 0; border-radius: 16px; cursor: pointer; color: #fff; font: 700 15px/1 var(--f-display); background: var(--grad-blue); box-shadow: var(--sh-blue); transition: transform var(--t-fast) var(--ease-spring); }

  .dice-opts { display: flex; gap: 10px; margin-top: 12px; }
  .stp { flex: 1; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); }

  .roll { padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); animation: rise .35s var(--ease-out); }
  .roll.crit { border-color: #3f9142; box-shadow: 0 0 0 3px rgba(63,145,66,.15); }

  .roll-d i.max { background: #e8f7ea; border-color: #3f9142; color: #2f7a33; }
  .roll-d i.min { background: #fdecec; border-color: var(--red-6); color: var(--red-6); }
  .roll-d .dk { font: 700 13px/1 var(--f-display); color: var(--text-2); }
  .droll { position: absolute; left: 50%; bottom: 26px; padding-bottom: 26px !important; transform: translateX(-50%); z-index: 9; display: flex; align-items: flex-end; gap: 22px; padding: 18px 20px 16px 24px; border-radius: 24px; background: rgba(15,17,30,.86); backdrop-filter: blur(10px); color: #fff; box-shadow: var(--sh-3); pointer-events: none; animation: rise .3s var(--ease-out); max-width: calc(100% - 24px); }
  .droll.out { opacity: 0; transform: translateX(-50%) translateY(8px); transition: opacity .4s, transform .4s; }
  .dr-tray { display: flex; align-items: flex-end; gap: 10px; }
  .dr-die { position: relative; width: 78px; height: 78px; }
  .dr-body { position: absolute; inset: 0; animation: dtumble 1.3s cubic-bezier(.25,.75,.35,1) both; animation-delay: calc(var(--i) * 120ms); filter: drop-shadow(0 8px 10px rgba(0,0,0,.45)); }
  .dr-body svg { width: 100%; height: 100%; display: block; }
  .dr-body.land .dnum { animation: dnum .35s var(--ease-spring); transform-origin: 50% 55%; transform-box: fill-box; }
  .dr-smoke { position: absolute; z-index: 2; left: -50px; right: -50px; bottom: -30px; height: 96px; opacity: 0; transform-origin: 50% 80%; animation: dsmoke 1.1s ease-out both; animation-delay: calc(860ms + var(--i) * 120ms); pointer-events: none; }
  .dr-smoke svg { width: 100%; height: 100%; overflow: visible; }
  .dr-neg { position: absolute; left: -12px; top: 50%; transform: translateY(-50%); font: 700 22px/1 var(--f-display); }
  .dr-more { font: 700 18px/1 var(--f-display); opacity: .8; margin: 0 0 26px 4px; }

  .dr-n { font: 700 15px/1.2 var(--f-display); text-align: right; }

  .dr-total { display: flex; align-items: baseline; gap: 10px; padding: 8px 16px; border-radius: 16px; background: rgba(255,255,255,.08); opacity: 0; animation: dtotal .4s var(--ease-spring) both; animation-delay: 1.55s; }

  @keyframes dtumble {

  /* trilha sonora: mini-player do YouTube (fica fora do palco para não reiniciar a música

  .som-bar button:hover { color: var(--blue-6); border-color: var(--blue-6); }

  .som-vol input { flex: 1; accent-color: #00ff9d; min-width: 0; }

  .trk { display: flex; align-items: center; gap: 10px; }

  .trk .acts { display: flex; gap: 4px; margin-left: auto; flex: none; }

  @media (max-width: 860px) { .som { flex: none; } .som-t, .som-vol { display: none; } }

  /* ── A barra do topo no celular ─────────────────────────────────────────────
     Ela é um flex de uma linha só, e quase todo filho é nowrap ou flex:none — o
     título, o selo "Ao vivo", o papel, o widget de som. Numa tela de 360px a soma
     passa da largura e quem era empurrado para fora era o .right, justamente onde
     mora o botão "Painel": no celular ele é o ÚNICO jeito de fechar a gaveta de
     abas e ver o mapa inteiro.
     Tentar encolher cada widget vira uma caça sem fim (hoje é o som, amanhã é outro).
     Então a barra ROLA na horizontal e o grupo da direita fica preso na borda: o
     botão está sempre visível, nada é escondido, e o resto da barra desliza por
     baixo dele. Mesmo scrollbar-width:none que .tabs já usa. */
  @media (max-width: 860px) {
    .mbar { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; gap: 8px; }
    .mbar::-webkit-scrollbar { display: none; }

      position: sticky; right: 0; flex: none;

      background: linear-gradient(90deg, transparent, var(--surface) 10px);

  }
  /* ordem de iniciativa (canto do palco) */

  .ordem-h .rod { font: 800 11px/1 var(--f-body); letter-spacing: .06em; padding: 4px 7px; border-radius: 7px; background: var(--blue-1); color: var(--blue-7); }
  .ordem-h .min { margin-left: auto; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border-2); background: transparent; color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
  .ordem-l { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; max-height: 46vh; overflow-y: auto; overflow-x: hidden; }

  .ordem-l .ov { min-width: 30px; height: 26px; padding: 0 4px; display: grid; place-items: center; border-radius: 7px; background: var(--bg-2); font: 700 13px/1 var(--f-display); flex: none; }
  .ordem-l li.vez .ov { background: var(--blue-6); color: #04120b; }
  .ordem-l .oa { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center; font: 700 11px/1 var(--f-display); color: #fff; }
  .ordem-l .on { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 14px; }
  .ordem-l li button { border: 0; background: transparent; color: var(--text-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 3px; }
  .ordem-l li button:hover { color: var(--red-6); }
  .ordem-vazio { font-size: 13px; color: var(--text-3); margin: 8px 0 0; }
  .ordem-fora { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 8px; font-size: 12px; color: var(--text-3); }
  .ordem-fora button { border: 1px dashed var(--border-2); background: transparent; color: var(--text-2); border-radius: var(--r-sm); padding: 4px 7px; font: 700 12px/1 var(--f-body); cursor: pointer; }
  .ordem-fora button:hover { border-color: var(--blue-6); color: var(--blue-6); }
  .ordem-a { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .ordem-a .btn { flex: 1; }
  .ordem-a .btn.sq { flex: none; width: 34px; padding: 0; }
  .tok.vez .disc { animation: vezpulse 1.4s ease-in-out infinite; }
  @keyframes vezpulse { 0%, 100% { box-shadow: 0 0 0 3px var(--c), 0 0 0 6px #00ff9d, 0 0 22px 6px rgba(0,255,157,.55); } 50% { box-shadow: 0 0 0 3px var(--c), 0 0 0 6px #00ff9d, 0 0 6px 2px rgba(0,255,157,.25); } }
  @media (max-width: 860px) { .ordem { top: 64px; right: 8px; width: 210px; } .ordem-l { max-height: 32vh; } }
  /* bestiário */
  .bcats { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 12px; }

  .bcats button.on { border-color: var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .bcard { border-radius: var(--r-md); border: 1px solid var(--border); border-left: 3px solid var(--c); background: var(--surface-2); padding: 10px; }
  .bcard-h { display: flex; gap: 10px; align-items: center; }

  .bcard-h b { display: block; font: 700 13px/1.2 var(--f-display); }

  .bdet { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); line-height: 1.4; }
  .bdet .attrs6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; margin-bottom: 8px; }

  .atk-sec { font: 800 10px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin: 6px 0 2px; }
  .res { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; margin-bottom: 8px; }

  .res .bar { height: 8px; border-radius: 4px; background: var(--bg-2); overflow: hidden; }

  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-2); cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--blue-6); }
  .rolls-mais { width: 100%; margin-top: 10px; }
  .mbar .sair { flex: none; }
  /* Reações (7 + SAB): contador no painel do token e selo no mapa */
  .reac { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .reac > span:first-child { font: 800 11px/1 var(--f-body); letter-spacing: .06em; color: #f59e0b; display: inline-flex; align-items: center; gap: 4px; }
  .reac-pips { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; min-width: 60px; }
  .reac-pips i { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .reac-pips i.gasta { background: var(--bg-2); box-shadow: inset 0 0 0 1.5px var(--border-2); }
  .reac b { font: 700 13px/1 var(--f-display); margin-left: auto; }
  .reac-b { display: flex; gap: 4px; flex-wrap: wrap; margin: -2px 0 10px; }
  .reac-b button { height: 28px; padding: 0 9px; border-radius: 9px; border: 1px solid var(--border-2); background: var(--surface); font: 700 11px/1 var(--f-display); cursor: pointer; color: var(--text); }
  .reac-b button:hover:not([disabled]) { border-color: #f59e0b; color: #b45309; }
  .reac-b button[disabled] { opacity: .4; cursor: default; }
  .reac-b button:last-child { flex: 1; }
  .rx { display: grid; gap: 6px; }
  .rx-i { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-2); color: var(--text); cursor: pointer; }
  .rx-i:hover:not([disabled]) { border-color: #f59e0b; }
  .rx-i[disabled] { opacity: .45; cursor: default; }
  .rx-n { flex: 1; min-width: 0; }
  .rx-n b { display: block; font: 700 13px/1.2 var(--f-display); }
  .rx-n small { display: block; font-size: 11px; color: var(--text-3); line-height: 1.3; margin-top: 2px; }
  .rx-v { flex: none; font: 700 13px/1 var(--f-display); color: #f59e0b; white-space: nowrap; }
  .tok .tok-reac { position: absolute; right: -2px; bottom: 2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center; background: #f59e0b; color: #1b1d2a; font: 800 11px/1 var(--f-display); box-shadow: 0 0 0 2px rgba(15,17,30,.85); pointer-events: none; }
  /* Nen: princípios ativados pelo token */
  .nen-on { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 8px; border-radius: 12px; background: color-mix(in srgb, #4ade80 12%, var(--surface)); border: 1px solid color-mix(in srgb, #4ade80 40%, transparent); font-size: 12px; font-weight: 700; color: #16a34a; }
  .nen-on span { flex: 1; min-width: 0; }
  .nen-on button { border: 1px solid color-mix(in srgb, #4ade80 50%, transparent); background: transparent; color: #16a34a; border-radius: 8px; padding: 5px 9px; font: 800 11px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
  .nen-l { display: grid; gap: 6px; }
  .nen-c { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-2); }
  .nen-c > i { font-size: 20px; color: var(--c); flex: none; }

  .nen-c.on > i { color: #16a34a; }
  .nen-n { flex: 1; min-width: 0; }
  .nen-n b { font: 700 14px/1.1 var(--f-display); letter-spacing: .04em; }
  .nen-n em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--c); margin-left: 4px; }
  .nen-c.on .nen-n em { color: #16a34a; }
  .nen-n small { display: block; font-size: 11px; color: var(--text-3); line-height: 1.3; margin-top: 2px; }
  .nen-a { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .nen-a span { font: 700 11px/1 var(--f-display); color: var(--text-3); white-space: nowrap; }
  .nen-a button { height: 28px; padding: 0 10px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--text); font: 700 11px/1 var(--f-display); cursor: pointer; }
  .nen-c.on .nen-a button { border-color: var(--border-2); background: var(--surface); }
  .nen-a button[disabled] { opacity: .4; cursor: default; }
  @container tp (min-width: 520px) { .nen-l { grid-template-columns: 1fr 1fr; } }
  /* aura pulsando no token com princípio ligado */
  .tok .nen-aura { position: absolute; inset: 4%; border-radius: 50%; pointer-events: none; box-shadow: 0 0 16px 6px var(--ac, var(--c)); animation: nenpulso 1.8s ease-in-out infinite; }
  /* camadas de aura (svg 150% do token, centrado; 1 unidade = 1% do token) */
  .tok .aura { position: absolute; inset: -25%; width: 150%; height: 150%; pointer-events: none; overflow: visible; color: var(--ac); }
  .tok .aura .ten { filter: url(#auraTen); transform-origin: 0 0; animation: rengira 14s linear infinite reverse, renpulso 2.2s ease-in-out infinite; }

  .tok .aura.ken .ren { opacity: 1; animation-duration: 6s, 1.1s; }

  @keyframes renpulso { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
  /* ZETSU: aura suprimida, o token quase some */
  .tok.zetsu .disc { opacity: .45; filter: grayscale(.6); box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .nen-cor { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; padding: 8px 10px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--border); }
  .nen-cor > span { font: 800 11px/1 var(--f-body); letter-spacing: .06em; color: var(--text-2); margin-right: auto; }
  .nen-cor button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); background: var(--sw); box-shadow: 0 0 0 1px var(--border-2), 0 0 8px var(--sw); cursor: pointer; padding: 0; }
  .nen-cor button.on { box-shadow: 0 0 0 2px var(--text), 0 0 10px var(--sw); }
  .nen-cor input { width: 30px; height: 26px; padding: 0; border: 1px solid var(--border-2); border-radius: 8px; background: transparent; cursor: pointer; }
  @keyframes nenpulso { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: .95; transform: scale(1.08); } }
  /* ping: "gota na água" no duplo clique do mapa */
  .ping { position: absolute; width: 0; height: 0; z-index: 40; pointer-events: none; }
  .ping i { position: absolute; left: calc(var(--s) / -2); top: calc(var(--s) / -2); width: var(--s); height: var(--s); border-radius: 50%; border: calc(var(--s) * .025) solid var(--c); box-shadow: 0 0 calc(var(--s) * .08) var(--c), inset 0 0 calc(var(--s) * .06) var(--c); opacity: 0; transform: scale(.05); animation: pingonda 1.5s cubic-bezier(.15,.6,.3,1) forwards; animation-delay: calc(var(--i) * .24s); }
  .ping b { position: absolute; left: calc(var(--s) * -.06); top: calc(var(--s) * -.06); width: calc(var(--s) * .12); height: calc(var(--s) * .12); border-radius: 50%; background: var(--c); box-shadow: 0 0 calc(var(--s) * .1) var(--c); animation: pinggota .9s ease-out forwards; }
  .ping span { position: absolute; left: 0; top: calc(var(--s) * .16); transform: translateX(-50%); white-space: nowrap; padding: .25em .7em; border-radius: 999px; background: rgba(15,17,30,.85); color: var(--c); font: 800 var(--fs) / 1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; animation: pingnome 2s ease-out forwards; }
  @keyframes pingonda { 0% { opacity: .95; transform: scale(.05); } 65% { opacity: .55; } 100% { opacity: 0; transform: scale(1); } }
  @keyframes pinggota { 0% { opacity: 1; transform: scale(0); } 35% { transform: scale(1.5); } 100% { opacity: 0; transform: scale(.4); } }
  @keyframes pingnome { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ping i, .ping b { animation: none; opacity: .7; transform: scale(.5); } .ping i ~ i { display: none; } }
  .tok .tok-reac.zero { background: #4b5563; color: #fff; }
